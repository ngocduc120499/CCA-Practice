<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Bilingual (English / Vietnamese) study hub for the Claude Certified Architect — Foundations exam: format, domains, topics and an 88-question practice bank.">
<meta name="theme-color" content="#1d6b57">
<title>Claude Certified Architect — Foundations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: single reading column (max 980px) with sticky tab bar; question bank is a filter rail over a stack of question cards. */
:root {
  --bg: #f4f6f5;
  --surface: #ffffff;
  --ink: #15201d;
  --muted: #5b6a65;
  --line: #d9e1de;
  --accent: #1d6b57;
  --accent-soft: #e2efea;
  --amber: #a5620f;
  --amber-soft: #fbefdc;
  --good: #1f7a3d;
  --good-soft: #e3f3e7;
  --bad: #b3362b;
  --bad-soft: #fbe6e3;
  --code-bg: #eaefed;
  --f-display: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1513; --surface: #161e1b; --ink: #e4ebe8; --muted: #93a39d; --line: #2a3632;
  --accent: #5cc3a4; --accent-soft: #1b322b; --amber: #e5a54f; --amber-soft: #352816;
  --good: #6fd08f; --good-soft: #17301f; --bad: #f08a7f; --bad-soft: #3a1d1a; --code-bg: #1f2a26;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1513; --surface: #161e1b; --ink: #e4ebe8; --muted: #93a39d; --line: #2a3632;
  --accent: #5cc3a4; --accent-soft: #1b322b; --amber: #e5a54f; --amber-soft: #352816;
  --good: #6fd08f; --good-soft: #17301f; --bad: #f08a7f; --bad-soft: #3a1d1a; --code-bg: #1f2a26;
  color-scheme: dark; }

body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15.5px; line-height: 1.6; }
.wrap { max-width: 980px; margin: 0 auto; padding-inline: 20px; padding-block: 0 64px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; line-height: 1.15; margin: 0; }
h1 { font-size: clamp(1.9rem, 4.5vw, 2.7rem); letter-spacing: -0.01em; }
h2 { font-size: 1.45rem; }
h3 { font-size: 1.08rem; }
p { margin: 0; }
code { font-family: var(--f-mono); font-size: .86em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
a { color: var(--accent); }
.eyebrow { font-family: var(--f-mono); font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }

header.hero { padding-block: 36px 20px; display: grid; gap: 12px; }
.hero p.lede { max-width: 66ch; color: var(--muted); font-size: 1.02rem; }
.src { font-size: .85rem; color: var(--muted); }

nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); display: flex; gap: 4px; overflow-x: auto; margin-bottom: 28px; }
nav.tabs button { font: 500 .95rem var(--f-body); color: var(--muted); background: none; border: 0; border-bottom: 2px solid transparent; padding: 12px 12px 10px; cursor: pointer; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
nav.tabs button:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

section.panel { display: grid; gap: 32px; }
.block { display: grid; gap: 14px; }

/* Overview facts */
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.fact { background: var(--surface); padding: 16px; display: grid; gap: 4px; align-content: start; }
.fact .v { font-family: var(--f-display); font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.fact .k { font-size: .85rem; color: var(--muted); }

/* Domain weight bars */
.weights { display: grid; gap: 10px; }
.wrow { display: grid; grid-template-columns: minmax(0, 1fr) 52px; gap: 6px 14px; align-items: center; }
.wrow .name { font-weight: 500; min-width: 0; }
.wrow .pct { font-family: var(--f-mono); text-align: right; font-variant-numeric: tabular-nums; }
.bar { grid-column: 1 / -1; height: 8px; background: var(--code-bg); border-radius: 4px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); border-radius: 4px; }

.scen { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.scen article { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.scen .n { font-family: var(--f-mono); font-size: .75rem; color: var(--accent); }
.scen .qc { font-size: .8rem; color: var(--muted); }
.note { background: var(--amber-soft); color: var(--ink); border-radius: 8px; padding: 12px 14px; font-size: .93rem; }
.note b { color: var(--amber); }
ul.clean { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }

/* Topics */
details.dom { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
details.dom > summary { list-style: none; cursor: pointer; padding: 16px 18px; display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 14px; align-items: center; }
details.dom > summary::-webkit-details-marker { display: none; }
.dnum { font-family: var(--f-mono); font-size: .8rem; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 3px 8px; }
.dw { font-family: var(--f-mono); font-variant-numeric: tabular-nums; color: var(--muted); }
.dbody { padding: 0 18px 18px; display: grid; gap: 18px; }
.task { border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 10px; }
.task h3 .tid { font-family: var(--f-mono); color: var(--muted); font-weight: 400; font-size: .9rem; margin-right: 6px; }
.ks { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.ks > div { min-width: 0; display: grid; gap: 6px; align-content: start; }
.ks ul { margin: 0; padding-left: 1.1em; display: grid; gap: 5px; font-size: .93rem; }

/* Question bank */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.toolbar label { display: grid; gap: 4px; font-size: .78rem; color: var(--muted); min-width: 0; }
.toolbar select, .toolbar input[type=search] { font: inherit; font-size: .92rem; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; max-width: 100%; }
.toolbar input[type=search] { width: 200px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { font: 500 .88rem var(--f-body); background: var(--bg); color: var(--muted); border: 0; padding: 8px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.chk { display: flex !important; align-items: center; gap: 6px; font-size: .88rem !important; color: var(--ink) !important; padding-bottom: 6px; }
.btn { font: 500 .88rem var(--f-body); background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 7px; padding: 8px 12px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.score { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; font-family: var(--f-mono); font-size: .88rem; font-variant-numeric: tabular-nums; color: var(--muted); }
.score b { color: var(--ink); }
.qlist { display: grid; gap: 14px; }
.q { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 12px; min-width: 0; }
.qhead { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tag { font-family: var(--f-mono); font-size: .72rem; border-radius: 5px; padding: 2px 7px; background: var(--code-bg); color: var(--muted); }
.tag.set-ex { background: var(--amber-soft); color: var(--amber); }
.tag.res-good { background: var(--good-soft); color: var(--good); }
.tag.res-bad { background: var(--bad-soft); color: var(--bad); }
.ask { font-weight: 600; }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 28px minmax(0,1fr); gap: 10px; align-items: start; text-align: left; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; }
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt[disabled] { cursor: default; }
.opt .l { font-family: var(--f-mono); font-weight: 500; color: var(--muted); }
.opt.correct { background: var(--good-soft); border-color: var(--good); }
.opt.correct .l { color: var(--good); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.opt.wrong .l { color: var(--bad); }
.expl { background: var(--accent-soft); border-radius: 8px; padding: 12px 14px; font-size: .94rem; display: grid; gap: 4px; }
.expl .h { font-weight: 600; color: var(--accent); }
.qfoot { display: flex; gap: 8px; flex-wrap: wrap; }
.empty { text-align: center; color: var(--muted); padding: 40px 0; }

/* Exercises / resources */
.ex { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; display: grid; gap: 8px; }
.ex ol { margin: 0; padding-left: 1.3em; display: grid; gap: 4px; font-size: .94rem; }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .92rem; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--f-mono); font-size: .74rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
tr:last-child td { border-bottom: 0; }
.cols2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
.cols2 > div { min-width: 0; display: grid; gap: 10px; align-content: start; }
@media (max-width: 520px) { .toolbar input[type=search] { width: 100%; } .toolbar label { flex: 1 1 100%; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.lang button { padding: 6px 12px; font-size: .85rem; }
html[lang="vi"] .tag, html[lang="vi"] .eyebrow, html[lang="vi"] .score, html[lang="vi"] .scen .n, html[lang="vi"] th { font-family: var(--f-body); letter-spacing: .02em; }
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} body{margin:0} img{max-width:100%} [hidden]{display:none!important}</style>
</head>
<body>


<div class="wrap">
  <header class="hero">
    <div class="topbar">
      <span class="eyebrow" data-t="eyebrow"></span>
      <span class="seg lang" role="group" aria-label="Language / Ngôn ngữ"><button type="button" id="lEn" aria-pressed="true" lang="en">English</button><button type="button" id="lVi" aria-pressed="false" lang="vi">Tiếng Việt</button></span>
    </div>
    <h1>Claude Certified Architect — Foundations</h1>
    <p class="lede" id="lede"></p>
    <p class="src" data-h="src"></p>
  </header>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" id="tab-overview" aria-selected="true" data-tab="overview" data-t="tabOverview"></button>
    <button role="tab" id="tab-topics" aria-selected="false" data-tab="topics" data-t="tabTopics"></button>
    <button role="tab" id="tab-bank" aria-selected="false" data-tab="bank"><span data-t="tabBank"></span> <span class="muted">(88)</span></button>
    <button role="tab" id="tab-practice" aria-selected="false" data-tab="practice" data-t="tabPractice"></button>
  </nav>

  <section class="panel" id="panel-overview" role="tabpanel">
    <div class="block">
      <h2 data-t="hFormat"></h2>
      <div class="facts">
        <div class="fact"><span class="v">720</span><span class="k" data-t="f1"></span></div>
        <div class="fact"><span class="v" data-t="f2v"></span><span class="k" data-t="f2"></span></div>
        <div class="fact"><span class="v" data-t="f3v"></span><span class="k" data-t="f3"></span></div>
        <div class="fact"><span class="v">0</span><span class="k" data-t="f4"></span></div>
      </div>
    </div>
    <div class="cols2">
      <div><h2 data-t="hWeights"></h2><div class="weights" id="weights"></div></div>
      <div><h2 data-t="hCand"></h2><p class="muted" id="candlead"></p><ul class="clean" id="cand"></ul></div>
    </div>
    <div class="block">
      <h2 data-t="hScen"></h2>
      <p class="muted" data-t="scenNote"></p>
      <div class="scen" id="scenarios"></div>
    </div>
    <div class="block">
      <h2 data-t="hRead"></h2>
      <div class="note" data-h="tip"></div>
      <ul class="clean" id="readTips"></ul>
    </div>
  </section>

  <section class="panel" id="panel-topics" role="tabpanel" hidden>
    <div class="block"><h2 data-t="hTopics"></h2><p class="muted" data-t="topicsNote"></p></div>
    <div class="block" id="domains"></div>
    <div class="cols2">
      <div><h2 data-t="hTech"></h2><div class="tbl"><table id="tech"></table></div></div>
      <div><h2 data-t="hOos"></h2><ul class="clean muted" id="oos"></ul></div>
    </div>
  </section>

  <section class="panel" id="panel-bank" role="tabpanel" hidden>
    <div class="block">
      <h2 data-t="tabBank"></h2>
      <p class="muted" data-t="bankNote"></p>
      <div class="toolbar">
        <label for="fScen"><span data-t="lScen"></span><select id="fScen"></select></label>
        <label for="fSet"><span data-t="lSet"></span><select id="fSet"></select></label>
        <label for="fSearch"><span data-t="lSearch"></span><input type="search" id="fSearch"></label>
        <label><span data-t="lMode"></span><span class="seg" role="group"><button type="button" id="mQuiz" aria-pressed="true" data-t="quiz"></button><button type="button" id="mStudy" aria-pressed="false" data-t="study"></button></span></label>
        <label class="chk" for="fShuffle"><input type="checkbox" id="fShuffle"> <span data-t="shuffle"></span></label>
        <label class="chk" for="fWrong"><input type="checkbox" id="fWrong"> <span data-t="onlyMissed"></span></label>
        <button type="button" class="btn" id="bReset" data-t="reset"></button>
      </div>
    </div>
    <div class="score" id="score"></div>
    <div class="qlist" id="qlist"></div>
  </section>

  <section class="panel" id="panel-practice" role="tabpanel" hidden>
    <div class="block"><h2 data-t="hEx"></h2><div class="block" id="exercises"></div></div>
    <div class="block"><h2 data-t="hPrep"></h2><ol class="clean" id="prep"></ol></div>
    <div class="block"><h2 data-t="hDocs"></h2><div class="tbl"><table id="docs"></table></div></div>
    <div class="block"><h2 data-t="hMore"></h2><ul class="clean" id="more"></ul></div>
  </section>
</div>

<script>
const DATA = {"en": {"examples": [{"set": "example", "n": 1, "scenario": "Customer Support Agent", "situation": "Data shows that in 12% of cases the agent skips `get_customer` and calls `lookup_order` using only the customer’s name, which leads to incorrect refunds.", "ask": "Which change is most effective?", "options": [{"id": "A", "text": "Add a programmatic precondition that blocks `lookup_order` and `process_refund` until an ID is obtained from `get_customer`"}, {"id": "B", "text": "Improve the system prompt"}, {"id": "C", "text": "Add few-shot examples"}, {"id": "D", "text": "Implement a routing classifier"}], "correct": "A", "explanation": "When critical business logic requires a specific tool sequence, software provides **deterministic guarantees** that prompt-based approaches (B, C) cannot. D addresses availability, not tool ordering."}, {"set": "example", "n": 2, "scenario": "Customer Support Agent", "situation": "The agent often calls `get_customer` instead of `lookup_order` for order-related questions. Tool descriptions are minimal and similar.", "ask": "What is the first step?", "options": [{"id": "A", "text": "Few-shot examples"}, {"id": "B", "text": "Expand each tool’s description with input formats, examples, and boundaries"}, {"id": "C", "text": "Add a routing layer"}, {"id": "D", "text": "Merge the tools"}], "correct": "B", "explanation": "Tool descriptions are the model’s primary selection mechanism. This is the lowest-effort, highest-impact fix. A adds tokens without addressing the root cause. C is overengineering. D requires more effort than justified."}, {"set": "example", "n": 3, "scenario": "Customer Support Agent", "situation": "The agent resolves only 55% of issues with a target of 80%. It escalates simple cases and tries to handle complex policy exceptions autonomously.", "ask": "How do you improve calibration?", "options": [{"id": "A", "text": "Add explicit escalation criteria with few-shot examples"}, {"id": "B", "text": "Self-rated confidence (1–10) with automatic escalation"}, {"id": "C", "text": "A separate classifier trained on historical data"}, {"id": "D", "text": "Sentiment analysis"}], "correct": "A", "explanation": "It directly addresses the root cause—unclear decision boundaries. B is unreliable (the model can be confidently wrong). C is overengineering. D solves a different problem (mood != complexity)."}, {"set": "example", "n": 4, "scenario": "Code Generation with Claude Code", "situation": "You need a custom `/review` command for standard code review that is available to the whole team when they clone the repository.", "ask": "Where should you create the command file?", "options": [{"id": "A", "text": "`.claude/commands/` in the project repository"}, {"id": "B", "text": "`~/.claude/commands/`"}, {"id": "C", "text": "Root `CLAUDE.md`"}, {"id": "D", "text": "`.claude/config.json`"}], "correct": "A", "explanation": "Project commands stored in `.claude/commands/` are version-controlled and automatically available to everyone. B is for personal commands. C is for instructions, not command definitions. D does not exist."}, {"set": "example", "n": 5, "scenario": "Code Generation with Claude Code", "situation": "You need to restructure a monolith into microservices (dozens of files, service-boundary decisions).", "ask": "What approach should you use?", "options": [{"id": "A", "text": "Planning mode: explore the codebase, understand dependencies, design an approach"}, {"id": "B", "text": "Direct execution incrementally"}, {"id": "C", "text": "Direct execution with detailed up-front instructions"}, {"id": "D", "text": "Direct execution and switch to planning when it gets hard"}], "correct": "A", "explanation": "Planning mode is designed for large changes, multiple possible approaches, and architectural decisions. B risks expensive rework. C assumes you already know the structure. D is reactive."}, {"set": "example", "n": 6, "scenario": "Code Generation with Claude Code", "situation": "A codebase has different conventions across areas (React, API, database). Tests are co-located with code. You want conventions to be applied automatically.", "ask": "What approach should you use?", "options": [{"id": "A", "text": "`.claude/rules/` files with YAML frontmatter and glob patterns"}, {"id": "B", "text": "Put everything in the root CLAUDE.md"}, {"id": "C", "text": "Skills in `.claude/skills/`"}, {"id": "D", "text": "CLAUDE.md in every directory"}], "correct": "A", "explanation": "`.claude/rules/` with glob patterns (e.g., `**/*.test.tsx`) enables automatic convention application based on file paths—ideal for tests spread across the codebase. B relies on model inference. C is manual/on-demand. D does not work well when relevant files are in many directories."}, {"set": "example", "n": 7, "scenario": "Multi-agent Research System", "situation": "The system researches “AI impact on creative industries,” but reports cover only visual art. The coordinator decomposed the topic into: “AI in digital art,” “AI in graphic design,” “AI in photography.”", "ask": "What’s the cause?", "options": [{"id": "A", "text": "The synthesis agent does not detect gaps"}, {"id": "B", "text": "The coordinator decomposed the task too narrowly"}, {"id": "C", "text": "The web search agent does not search thoroughly enough"}, {"id": "D", "text": "The document analysis agent filters out non-visual sources"}], "correct": "B", "explanation": "The logs show the coordinator decomposed “creative industries” only into visual subtopics, completely missing music, literature, and film. Subagents executed correctly—the issue is what they were assigned."}, {"set": "example", "n": 8, "scenario": "Multi-agent Research System", "situation": "A web-search subagent times out while researching a complex topic. You need to design how error information is passed back to the coordinator.", "ask": "Which error propagation approach best enables intelligent recovery?", "options": [{"id": "A", "text": "Return structured error context to the coordinator: failure type, query, partial results, and alternatives"}, {"id": "B", "text": "Implement automatic retries with exponential backoff inside the subagent, then return a generic “search unavailable” status"}, {"id": "C", "text": "Catch the timeout inside the subagent and return an empty result set marked as success"}, {"id": "D", "text": "Propagate the timeout exception to a top-level handler that terminates the whole workflow"}], "correct": "A", "explanation": "Structured error context gives the coordinator what it needs to decide whether to retry with a modified query, try an alternative approach, or continue with partial results. B hides context behind a generic status. C masks failure as success. D aborts the entire workflow unnecessarily."}, {"set": "example", "n": 9, "scenario": "Multi-agent Research System", "situation": "The synthesis agent often needs to verify specific claims while merging results. Currently, when verification is needed, the synthesis agent hands control back to the coordinator, which calls the web-search agent and then re-runs synthesis with the new results. This adds 2–3 extra round trips per task and increases latency by 40%. Your assessment shows that 85% of these checks are simple fact checks (dates, names, statistics), while 15% require deeper investigation.", "ask": "How do you reduce overhead while maintaining reliability?", "options": [{"id": "A", "text": "Give the synthesis agent a limited `verify_fact` tool for simple checks, and continue routing complex verification through the coordinator"}, {"id": "B", "text": "Accumulate all verification needs into a batch and return them to the coordinator at the end"}, {"id": "C", "text": "Give the synthesis agent full access to all web-search tools"}, {"id": "D", "text": "Proactively cache additional context around each source"}], "correct": "A", "explanation": "This applies the principle of least privilege: the synthesis agent gets exactly what it needs for the 85% common case (simple fact checks) while preserving the coordinator-mediated path for complex investigations. B introduces blocking dependencies (later synthesis steps may depend on earlier verified facts). C breaks separation of responsibilities. D relies on speculative caching that cannot reliably predict needs."}, {"set": "example", "n": 10, "scenario": "Claude Code for Continuous Integration", "situation": "A pipeline runs `claude \"Analyze this pull request for security issues\"`, but hangs waiting for interactive input.", "ask": "What is the correct approach?", "options": [{"id": "A", "text": "Use the `-p` flag: `claude -p \"Analyze this pull request for security issues\"`"}, {"id": "B", "text": "Set `CLAUDE_HEADLESS=true`"}, {"id": "C", "text": "Redirect stdin from `/dev/null`"}, {"id": "D", "text": "Use `--batch`"}], "correct": "A", "explanation": "`-p` (or `--print`) is the documented way to run Claude Code in non-interactive mode. It processes the prompt, prints to stdout, and exits. The other options are either non-existent features or Unix workarounds."}, {"set": "example", "n": 11, "scenario": "Claude Code for Continuous Integration", "situation": "The team wants to reduce API cost for automated analysis. Claude currently serves two workflows in real time: (1) a blocking pre-merge check that must complete before developers can merge a PR, and (2) a tech-debt report generated overnight for morning review. A manager proposes moving both to the Message Batches API to save 50%.", "ask": "How should you evaluate this proposal?", "options": [{"id": "A", "text": "Use batch processing only for tech-debt reports; keep real-time calls for pre-merge checks"}, {"id": "B", "text": "Move both workflows to batch processing and poll for completion"}, {"id": "C", "text": "Keep real-time calls for both to avoid ordering issues in batch results"}, {"id": "D", "text": "Move both to batch processing with a fallback to real time if a batch takes too long"}], "correct": "A", "explanation": "The Message Batches API saves 50%, but processing time can be up to 24 hours with no guaranteed latency SLA. That makes it unsuitable for blocking pre-merge checks where developers are waiting, but ideal for overnight batch workloads like tech-debt reports."}, {"set": "example", "n": 12, "scenario": "Multi-file Code Review", "situation": "A pull request changes 14 files in an inventory tracking module. A single-pass review of all files produces inconsistent results: detailed comments for some files but superficial ones for others, missed obvious bugs, and contradictory feedback (a pattern is flagged as problematic in one file but approved in identical code in another file).", "ask": "How should you restructure the review?", "options": [{"id": "A", "text": "Split into focused passes: analyze each file individually for local issues, then run a separate integration pass for cross-file data flows"}, {"id": "B", "text": "Require developers to split large PRs into submissions of 3–4 files"}, {"id": "C", "text": "Switch to a higher-tier model with a larger context window to review all 14 files in one pass"}, {"id": "D", "text": "Run three independent full-PR review passes and report only issues found in at least two runs"}], "correct": "A", "explanation": "Focused passes directly address the root cause—attention dilution when processing many files at once. Per-file analysis ensures consistent depth, and a separate integration pass catches cross-file issues. B shifts burden to developers without improving the system. C is a misconception: larger context does not fix attention quality. D suppresses real bugs by requiring consensus across inconsistent detections."}], "practice": [{"set": "practice", "n": 1, "scenario": "Multi-agent Research System", "situation": "A document analysis agent discovers that two credible sources contain directly contradictory statistics for a key metric: a government report states 40% growth, while an industry analysis states 12%. Both sources look credible, and the discrepancy could materially affect the research conclusions. How should the document analysis agent handle this situation most effectively?", "ask": "Which approach is most effective?", "options": [{"id": "A", "text": "Apply credibility heuristics to pick the most likely correct number, finish analysis with that value, and add a footnote mentioning the discrepancy."}, {"id": "B", "text": "Include both numbers in the analysis output without marking them as conflicting, letting the synthesis agent decide which to use based on broader context."}, {"id": "C", "text": "Stop analysis and immediately escalate to the coordinator, asking it to decide which source is more authoritative before continuing."}, {"id": "D", "text": "Complete analysis with both numbers, explicitly annotate the conflict with source attribution, and let the coordinator decide how to reconcile the data before passing to synthesis."}], "correct": "D", "explanation": "This approach preserves separation of responsibilities: the analysis agent completes its core work without blocking, preserves both conflicting values with clear attribution, and correctly passes reconciliation to the coordinator, which has broader context."}, {"set": "practice", "n": 2, "scenario": "Multi-agent Research System", "situation": "The web-search and document-analysis agents have completed their tasks and returned results to the coordinator. What is the next step for creating an integrated research report?", "ask": "Which next step is most appropriate?", "options": [{"id": "A", "text": "Each agent sends its results directly to the report-writing agent, bypassing the coordinator."}, {"id": "B", "text": "The document analysis agent requests web-search results and merges them internally."}, {"id": "C", "text": "The coordinator passes both sets of results to the synthesis agent for a unified integration."}, {"id": "D", "text": "The coordinator concatenates the raw outputs from both agents and returns them as the final result."}], "correct": "C", "explanation": "In a coordinator–subagent architecture, the coordinator forwards both result sets to the synthesis agent for centralized integration, preserving control and ensuring high-quality merging."}, {"set": "practice", "n": 3, "scenario": "Multi-agent Research System", "situation": "A document analysis subagent frequently fails when processing PDF files: some have corrupted sections that trigger parsing exceptions, others are password-protected, and sometimes the parsing library hangs on large files. Currently, any exception immediately terminates the subagent and returns an error to the coordinator, which must decide whether to retry, skip, or fail the whole task. This causes excessive coordinator involvement in routine error handling. What architectural improvement is most effective?", "ask": "Which improvement is most effective?", "options": [{"id": "A", "text": "Create a dedicated error-handling agent that monitors all failures via a shared queue and decides recovery actions, sending restart commands directly to subagents."}, {"id": "B", "text": "Configure the subagent to always return partial results with a success status, embedding error details in metadata; the coordinator treats all responses as successful."}, {"id": "C", "text": "Make the coordinator validate all documents before sending them to the subagent, rejecting documents that might cause failures."}, {"id": "D", "text": "Implement local recovery in the subagent for transient failures and escalate to the coordinator only errors it cannot resolve, including attempted steps and partial results."}], "correct": "D", "explanation": "Handle errors at the lowest level capable of resolving them. Local recovery reduces coordinator workload while still escalating truly unrecoverable issues with full context and partial progress."}, {"set": "practice", "n": 4, "scenario": "Multi-agent Research System", "situation": "After running the system on “AI impact on creative industries,” you observe that every subagent completes successfully: the web-search agent finds relevant articles, the document analysis agent summarizes them correctly, and the synthesis agent produces coherent text. However, final reports cover only visual art and completely miss music, literature, and film. In the coordinator logs, you see it decomposed the topic into three subtasks: “AI in digital art,” “AI in graphic design,” and “AI in photography.” What is the most likely root cause?", "ask": "What is the most likely root cause?", "options": [{"id": "A", "text": "The synthesis agent lacks instructions to detect coverage gaps."}, {"id": "B", "text": "The document analysis agent filters out non-visual sources due to overly strict relevance criteria."}, {"id": "C", "text": "The coordinator’s task decomposition is too narrow, assigning subagents work that does not cover all relevant areas."}, {"id": "D", "text": "The web-search agent’s queries are insufficient and should be broadened to cover more sectors."}], "correct": "C", "explanation": "The coordinator decomposed a broad topic only into visual-art subtasks, missing music, literature, and film entirely. Since subagents executed their assignments correctly, the narrow decomposition is the obvious root cause."}, {"set": "practice", "n": 5, "scenario": "Multi-agent Research System", "situation": "The web-search subagent returns results for only 3 of 5 requested source categories (competitor sites and industry reports succeed, but news archives and social feeds time out). The document analysis subagent successfully processes all provided documents. The synthesis subagent must produce a summary from mixed-quality upstream inputs. Which error-propagation strategy is most effective?", "ask": "Which error-propagation strategy is most effective?", "options": [{"id": "A", "text": "Continue synthesis using only successful sources and produce an output without mentioning which data was unavailable."}, {"id": "B", "text": "The synthesis subagent returns an error to the coordinator, triggering a full retry or task failure due to incomplete data."}, {"id": "C", "text": "The synthesis subagent asks the coordinator to retry timed-out sources with a longer timeout before starting synthesis."}, {"id": "D", "text": "Structure the synthesis output with coverage annotations that indicate which conclusions are well-supported and where gaps exist due to unavailable sources."}], "correct": "D", "explanation": "Coverage annotations implement graceful degradation with transparency, preserving value from completed work while propagating uncertainty to enable informed decisions about confidence."}, {"set": "practice", "n": 6, "scenario": "Multi-agent Research System", "situation": "The document analysis subagent encounters a corrupted PDF file that it cannot parse. When designing the system’s error handling, what is the most effective way to handle this failure?", "ask": "Which approach is most effective?", "options": [{"id": "A", "text": "Return an error with context to the coordinator agent, allowing it to decide how to proceed."}, {"id": "B", "text": "Silently skip the corrupted document and continue processing the remaining files to avoid interrupting the workflow."}, {"id": "C", "text": "Automatically retry parsing the document three times with exponential backoff before reporting a failure."}, {"id": "D", "text": "Throw an exception that terminates the entire research workflow."}], "correct": "A", "explanation": "Returning an error with context to the coordinator is the most effective approach because it lets the coordinator make an informed decision—skip the file, try an alternative parsing method, or notify the user—while maintaining visibility into the failure."}, {"set": "practice", "n": 7, "scenario": "Multi-agent Research System", "situation": "Production logs show a persistent pattern: requests like “analyze the uploaded quarterly report” are routed to the web-search agent 45% of the time instead of the document analysis agent. Reviewing tool definitions, you find that the web-search agent has a tool `analyze_content` described as “analyzes content and extracts key information,” while the document analysis agent has a tool `analyze_document` described as “analyzes documents and extracts key information.” How should you fix the misrouting problem?", "ask": "How should you fix the misrouting problem?", "options": [{"id": "A", "text": "Add a pre-routing classifier that detects whether the user refers to uploaded files or web content before the coordinator decides on delegation."}, {"id": "B", "text": "Rename the web-search tool to `extract_web_results` and update its description to “processes and returns information retrieved from web search and URLs.”"}, {"id": "C", "text": "Add few-shot examples to the coordinator prompt showing correct routing: “User uploads a quarterly report → document analysis agent” and “User asks about a web page → web-search agent.”"}, {"id": "D", "text": "Expand the document analysis tool description with usage examples like “Use for uploaded PDFs, Word docs, and spreadsheets,” leaving the web-search tool unchanged."}], "correct": "B", "explanation": "Renaming the web-search tool to `extract_web_results` and updating its description to explicitly reference web search and URLs directly removes the root cause by eliminating semantic overlap between the two tool names and descriptions. This makes each tool’s purpose unambiguous, enabling the coordinator to reliably distinguish document analysis from web search."}, {"set": "practice", "n": 8, "scenario": "Multi-agent Research System", "situation": "A colleague proposes that the document analysis agent should send its results directly to the synthesis agent, bypassing the coordinator. What is the main advantage of keeping the coordinator as the central hub for all communication between subagents?", "ask": "What is the main advantage of keeping the coordinator as the central hub?", "options": [{"id": "A", "text": "The coordinator can observe all interactions, handle errors uniformly, and decide what information each subagent should receive."}, {"id": "B", "text": "The coordinator batches multiple requests to subagents, reducing total API calls and overall latency."}, {"id": "C", "text": "Routing through the coordinator enables automatic retry logic that direct inter-agent calls cannot support."}, {"id": "D", "text": "Subagents use isolated memory, and direct communication would require complex serialization that only the coordinator can perform."}], "correct": "A", "explanation": "The coordinator pattern provides centralized visibility into all interactions, uniform error handling across the system, and fine-grained control over what information each subagent receives—these are the primary advantages of a star-shaped communication topology."}, {"set": "practice", "n": 9, "scenario": "Multi-agent Research System", "situation": "The web-search subagent times out while researching a complex topic. You need to design how information about this failure is returned to the coordinator. Which error-propagation approach best enables intelligent recovery?", "ask": "Which error-propagation approach best enables intelligent recovery?", "options": [{"id": "A", "text": "Return structured error context to the coordinator including the failure type, the query executed, any partial results, and potential alternative approaches."}, {"id": "B", "text": "Catch the timeout within the subagent and return an empty result set marked as successful."}, {"id": "C", "text": "Implement automatic exponential-backoff retries inside the subagent, only returning a generic “search unavailable” status after exhausting retries."}, {"id": "D", "text": "Propagate the timeout exception directly to the top-level handler, terminating the entire research workflow."}], "correct": "A", "explanation": "Returning structured error context—including failure type, executed query, partial results, and alternative approaches—gives the coordinator everything needed to make intelligent recovery decisions (e.g., retry with a modified query or continue with partial results). It preserves maximum context for informed coordination-level decision-making."}, {"set": "practice", "n": 10, "scenario": "Multi-agent Research System", "situation": "In your system design, you gave the document analysis agent access to a general-purpose tool `fetch_url` so it could download documents by URL. Production logs show this agent now frequently downloads search engine results pages to perform ad hoc web search—behavior that should be routed through the web-search agent—causing inconsistent results. Which fix is most effective?", "ask": "Which fix is most effective?", "options": [{"id": "A", "text": "Replace `fetch_url` with a `load_document` tool that validates that URLs point to document formats."}, {"id": "B", "text": "Remove `fetch_url` from the document analysis agent and route all URL fetching through the coordinator to the web-search agent."}, {"id": "C", "text": "Implement filtering that blocks `fetch_url` calls to known search engine domains while allowing other URLs."}, {"id": "D", "text": "Add instructions to the document analysis agent prompt that `fetch_url` should only be used to download document URLs, not to search."}], "correct": "A", "explanation": "Replacing a general-purpose tool with a document-specific tool that validates URLs against document formats fixes the root cause by constraining capability at the interface level. This follows the principle of least privilege, making undesired search behavior impossible rather than merely discouraged."}, {"set": "practice", "n": 11, "scenario": "Multi-agent Research System", "situation": "While researching a broad topic, you observe that the web-search agent and the document analysis agent investigate the same subtopics, leading to substantial duplication in their outputs. Token usage nearly doubles without a proportional increase in research breadth or depth. What is the most effective way to address this?", "ask": "What is the most effective way to address this?", "options": [{"id": "A", "text": "Allow both agents to finish in parallel, then have the coordinator deduplicate overlapping results before passing them to the synthesis agent."}, {"id": "B", "text": "The coordinator explicitly partitions the research space before delegating, assigning each agent distinct subtopics or source types."}, {"id": "C", "text": "Implement a shared-state mechanism where agents log their current focus area so other agents can dynamically avoid duplication during execution."}, {"id": "D", "text": "Switch to sequential execution where document analysis runs only after web search completes, using web-search results as context to avoid duplication."}], "correct": "B", "explanation": "Having the coordinator explicitly partition the research space before delegating is most effective because it addresses the root cause—unclear task boundaries—before any work begins. It preserves parallelism while preventing duplicated effort and wasted tokens."}, {"set": "practice", "n": 12, "scenario": "Multi-agent Research System", "situation": "During research, the web-search subagent queries three source categories with different outcomes: academic databases return 15 relevant papers, industry reports return “0 results,” and patent databases return “Connection timeout.” When designing error propagation to the coordinator, which approach enables the best recovery decisions?", "ask": "Which approach enables the best recovery decisions?", "options": [{"id": "A", "text": "Aggregate the results into a single success-percentage metric (e.g., “67% source coverage”) with detailed logs available on demand."}, {"id": "B", "text": "Report both “timeout” and “0 results” as failures requiring coordinator intervention."}, {"id": "C", "text": "Retry transient failures internally and report only persistent errors."}, {"id": "D", "text": "Distinguish access failures (timeout) that require a retry decision from valid empty results (“0 results”) that represent successful queries."}], "correct": "D", "explanation": "A timeout (access failure) and “0 results” (valid empty result) are semantically different outcomes requiring different responses. Distinguishing them allows the coordinator to retry the patent database while accepting the industry reports “0 results” as a valid, informative finding."}, {"set": "practice", "n": 13, "scenario": "Multi-agent Research System", "situation": "Production monitoring shows inconsistent synthesis quality. When aggregated results are ~75K tokens, the synthesis agent reliably cites information from the first 15K tokens (web-search headlines/snippets) and the last 10K tokens (document analysis conclusions), but often misses critical findings in the middle 50K tokens—even when they directly answer the research question. How should you restructure the aggregated input?", "ask": "How should you restructure the aggregated input?", "options": [{"id": "A", "text": "Summarize all subagent outputs to under 20K tokens before aggregation to keep content within the model’s reliable processing range."}, {"id": "B", "text": "Stream subagent results to the synthesis agent incrementally, processing web-search results first to completion, then adding document analysis results."}, {"id": "C", "text": "Place a key-findings summary at the start of the aggregated input and organize detailed results with explicit section headings for easier navigation."}, {"id": "D", "text": "Implement rotation that alternates which subagent’s results appear first across research tasks to ensure both sources get equal top positioning over time."}], "correct": "C", "explanation": "Putting a key-findings summary at the start leverages primacy effects so critical information sits in the most reliably processed position. Adding explicit section headings throughout helps the model navigate and attend to mid-input content, directly mitigating the “lost in the middle” phenomenon."}, {"set": "practice", "n": 14, "scenario": "Multi-agent Research System", "situation": "In testing, the combined output of the web-search agent (85K tokens including page content) and the document analysis agent (70K tokens including chains of thought) totals 155K tokens, but the synthesis agent performs best with inputs under 50K tokens. Which solution is most effective?", "ask": "Which solution is most effective?", "options": [{"id": "A", "text": "Modify upstream agents to return structured data (key facts, quotes, relevance scores) instead of verbose content and reasoning."}, {"id": "B", "text": "Add an intermediate summarization agent that condenses findings before passing them to synthesis."}, {"id": "C", "text": "Have the synthesis agent process findings in sequential batches, maintaining state between calls."}, {"id": "D", "text": "Store findings in a vector database and give the synthesis agent search tools to query during its work."}], "correct": "A", "explanation": "Modifying upstream agents to return structured data fixes the root cause by reducing token volume at the source while preserving essential information. It avoids passing bulky page content and reasoning traces that inflate tokens without improving the synthesis step."}, {"set": "practice", "n": 15, "scenario": "Multi-agent Research System", "situation": "In testing, you observe that the synthesis agent often needs to verify specific claims while merging results. Currently, when verification is needed, the synthesis agent returns control to the coordinator, which calls the web-search agent and then re-invokes synthesis with the results. This adds 2–3 extra loops per task and increases latency by 40%. Your assessment shows 85% of these verifications are simple fact checks (dates, names, stats) and 15% require deeper research. Which approach most effectively reduces overhead while preserving system reliability?", "ask": "Which approach is most effective?", "options": [{"id": "A", "text": "Give the synthesis agent access to all web-search tools so it can handle any verification need directly without coordinator loops."}, {"id": "B", "text": "Have the synthesis agent accumulate all verification needs and return them as a batch to the coordinator at the end, which then sends them all to the web-search agent at once."}, {"id": "C", "text": "Have the web-search agent proactively cache extra context around each source during initial research in anticipation of synthesis needing verification."}, {"id": "D", "text": "Give the synthesis agent a limited-scope `verify_fact` tool for simple checks, while routing complex verifications through the coordinator to the web-search agent."}], "correct": "D", "explanation": "A limited-scope fact-verification tool lets the synthesis agent handle 85% of simple checks directly, eliminating most loops, while preserving the coordinator delegation path for the 15% of complex verifications. This applies least privilege while significantly reducing latency."}, {"set": "practice", "n": 16, "scenario": "Claude Code for Continuous Integration", "situation": "Your CI pipeline runs the Claude Code CLI (in `--print` mode) using CLAUDE.md to provide project context for code review, and developers generally find the reviews substantive. However, they report that integrating findings into the workflow is difficult—Claude outputs narrative paragraphs that must be manually copied into PR comments. The team wants to automatically post each finding as a separate inline PR comment at the relevant place in code, which requires structured data with file path, line number, severity level, and suggested fix. Which approach is most effective?", "ask": "Which approach is most effective?", "options": [{"id": "A", "text": "Add an “Output Format for Review” section to CLAUDE.md with examples of structured findings so Claude learns the expected format from project context."}, {"id": "B", "text": "Use the CLI flags `--output-format json` and `--json-schema` to enforce structured findings, then parse the output to post inline comments via the GitHub API."}, {"id": "C", "text": "Include explicit formatting instructions in the review prompt requiring each finding to follow a parseable template like `[FILE:path] [LINE:n] [SEVERITY:level] ...`."}, {"id": "D", "text": "Keep narrative review format but add a summarization step that uses Claude to generate a structured JSON summary of findings."}], "correct": "B", "explanation": "Using `--output-format json` with `--json-schema` enforces structured output at the CLI level, guaranteeing well-formed JSON with the required fields (file path, line number, severity, suggested fix) that can be reliably parsed and posted as inline PR comments via the GitHub API. It leverages built-in CLI capabilities designed specifically for structured output."}, {"set": "practice", "n": 17, "scenario": "Claude Code for Continuous Integration", "situation": "Your team uses Claude Code for generating code suggestions, but you notice a pattern: non-obvious issues—performance optimizations that break edge cases, cleanups that unexpectedly change behavior—are only caught when another team member reviews the PR. Claude’s reasoning during generation shows it considered these cases but concluded its approach was correct. Which approach directly addresses the root cause of this self-check limitation?", "ask": "Which approach directly addresses the root cause?", "options": [{"id": "A", "text": "Run a second independent instance of Claude Code to review the changes without access to the generator’s reasoning."}, {"id": "B", "text": "Enable extended thinking mode for the generation stage to allow more thorough deliberation before producing suggestions."}, {"id": "C", "text": "Add explicit self-review instructions to the generation prompt asking Claude to critique its own suggestions before finalizing output."}, {"id": "D", "text": "Include full test files and documentation in prompt context so Claude better understands expected behavior during generation."}], "correct": "A", "explanation": "A second independent Claude Code instance without access to the generator’s reasoning directly addresses the root cause by avoiding confirmation bias. This “fresh eyes” perspective mirrors human peer review, where another reviewer catches issues the author rationalized."}, {"set": "practice", "n": 18, "scenario": "Claude Code for Continuous Integration", "situation": "Your code review component is iterative: Claude analyzes the changed file, then may request related files (imports, base classes, tests) via tool calls to understand context before providing final feedback. Your application defines a tool that lets Claude request file contents; Claude calls the tool, gets results, and continues analysis. You’re evaluating batch processing to reduce API cost. What is the primary technical limitation when considering batch processing for this workflow?", "ask": "What is the primary technical limitation?", "options": [{"id": "A", "text": "Batch processing does not include correlation IDs to map outputs back to input requests."}, {"id": "B", "text": "The asynchronous model cannot execute tools mid-request and return results for Claude to continue analysis."}, {"id": "C", "text": "The Batch API does not support tool definitions in request parameters."}, {"id": "D", "text": "The batch processing latency of up to 24 hours is too slow for pull request feedback, although the workflow would otherwise function."}], "correct": "B", "explanation": "A “fire-and-forget” asynchronous Batch API model has no mechanism to intercept a tool call during a request, execute the tool, and return results for Claude to continue analysis. This is fundamentally incompatible with iterative tool-calling workflows that require multiple tool request/response rounds within a single logical interaction."}, {"set": "practice", "n": 19, "scenario": "Claude Code for Continuous Integration", "situation": "Your CI/CD system runs three Claude-based analyses: (1) fast style checks on every PR that block merging until completion, (2) comprehensive weekly security audits of the entire codebase, and (3) nightly test-case generation for recently changed modules. The Message Batches API offers 50% savings but processing can take up to 24 hours. You want to optimize API cost while maintaining an acceptable developer experience. Which combination correctly matches each task to an API approach?", "ask": "Which combination is correct?", "options": [{"id": "A", "text": "Use the Message Batches API for all three tasks to maximize 50% savings, configuring the pipeline to poll for batch completion."}, {"id": "B", "text": "Use synchronous calls for PR style checks; use the Message Batches API for weekly security audits and nightly test generation."}, {"id": "C", "text": "Use synchronous calls for all three tasks for consistent response times, relying on prompt caching to reduce costs across workloads."}, {"id": "D", "text": "Use synchronous calls for PR style checks and nightly test generation; use the Message Batches API only for weekly security audits."}], "correct": "B", "explanation": "PR style checks block developers and require immediate responses via synchronous calls, while weekly security audits and nightly test generation are scheduled tasks with flexible deadlines that can tolerate up to a 24-hour batch window—capturing 50% savings for both."}, {"set": "practice", "n": 20, "scenario": "Claude Code for Continuous Integration", "situation": "Your automated reviews find real issues, but developers report the feedback is not actionable. Findings include phrases like “complex ticket routing logic” or “potential null pointer” without specifying what exactly to change. When you add detailed instructions like “always include concrete fix suggestions,” the model still produces inconsistent output—sometimes detailed, sometimes vague. Which prompting technique most reliably produces consistently actionable feedback?", "ask": "Which prompting technique is most reliable?", "options": [{"id": "A", "text": "Further refine instructions with more explicit requirements for each part of the feedback format (location, issue, severity, proposed fix)."}, {"id": "B", "text": "Expand the context window to include more surrounding codebase so the model has enough information to propose concrete fixes."}, {"id": "C", "text": "Implement a two-pass approach where one prompt identifies issues and a second generates fixes, allowing specialization."}, {"id": "D", "text": "Add 3–4 few-shot examples showing the exact required format: identified issue, location in code, concrete fix suggestion."}], "correct": "D", "explanation": "Few-shot examples are the most effective technique for achieving consistent output format when instructions alone produce variable results. Providing 3–4 examples that show the exact desired structure (issue, location, concrete fix) gives the model a concrete pattern to follow, which is more reliable than abstract instructions."}, {"set": "practice", "n": 21, "scenario": "Claude Code for Continuous Integration", "situation": "Your CI pipeline includes two Claude-based code review modes: a pre-merge-commit hook that blocks PR merge until completion, and a “deep analysis” that runs overnight, polls for batch completion, and posts detailed suggestions to the PR. You want to reduce API cost using the Message Batches API, which offers 50% savings but requires polling and can take up to 24 hours. Which mode should use batch processing?", "ask": "Which mode should use batch processing?", "options": [{"id": "A", "text": "Only the pre-merge-commit hook."}, {"id": "B", "text": "Only the deep analysis."}, {"id": "C", "text": "Both modes."}, {"id": "D", "text": "Neither mode."}], "correct": "B", "explanation": "Deep analysis is an ideal candidate for batch processing because it already runs overnight, tolerates delay, and uses a polling model before publishing results—matching the asynchronous, polling-based architecture of the Message Batches API while capturing 50% savings."}, {"set": "practice", "n": 22, "scenario": "Claude Code for Continuous Integration", "situation": "Your automated review analyzes comments and docstrings. The current prompt instructs Claude to “check that comments are accurate and up to date.” Findings often flag acceptable patterns (TODO markers, simple descriptions) while missing comments describing behavior the code no longer implements. What change addresses the root cause of this inconsistent analysis?", "ask": "What change addresses the root cause?", "options": [{"id": "A", "text": "Include `git blame` data so Claude can identify comments that predate recent code changes."}, {"id": "B", "text": "Add few-shot examples of misleading comments to help the model recognize similar patterns in the codebase."}, {"id": "C", "text": "Filter TODO, FIXME, and descriptive comment patterns before analysis to reduce noise."}, {"id": "D", "text": "Specify explicit criteria: flag comments only when the behavior they claim contradicts the code’s actual behavior."}], "correct": "D", "explanation": "Explicit criteria—flagging comments only when claimed behavior contradicts actual code behavior—directly addresses the root cause by replacing a vague instruction with a precise definition of what constitutes a problem. This reduces false positives on acceptable patterns and misses of truly misleading comments."}, {"set": "practice", "n": 23, "scenario": "Claude Code for Continuous Integration", "situation": "Your automated code review system shows inconsistent severity ratings—similar issues like null pointer risks are rated “critical” in some PRs but only “medium” in others. Developer surveys show growing distrust—many start dismissing findings without reading because “half are wrong.” High-false-positive categories erode trust in accurate categories. Which approach best restores developer trust while improving the system?", "ask": "Which approach best restores developer trust?", "options": [{"id": "A", "text": "Temporarily disable high-false-positive categories (style, naming, documentation) and keep only high-precision categories while improving prompts."}, {"id": "B", "text": "Keep all categories enabled but display confidence scores with each finding so developers can decide what to investigate."}, {"id": "C", "text": "Keep all categories enabled and add few-shot examples to improve accuracy for each category over the next few weeks."}, {"id": "D", "text": "Apply a uniform strictness reduction across all categories to bring the overall false-positive rate down."}], "correct": "A", "explanation": "Temporarily disabling high-false-positive categories immediately stops trust erosion by removing noisy findings that cause developers to dismiss everything, while preserving value from high-precision categories like security and correctness. It also creates space to improve prompts for problematic categories before re-enabling them."}, {"set": "practice", "n": 24, "scenario": "Claude Code for Continuous Integration", "situation": "Your automated review generates test-case suggestions for each PR. Reviewing a PR that adds course completion tracking, Claude suggests 10 test cases, but developer feedback shows that 6 duplicate scenarios already covered by the existing test suite. What change most effectively reduces duplicate suggestions?", "ask": "What change is most effective?", "options": [{"id": "A", "text": "Include the existing test file in context so Claude can determine what scenarios are already covered."}, {"id": "B", "text": "Reduce the requested number of suggestions from 10 to 5, assuming Claude prioritizes the most valuable cases first."}, {"id": "C", "text": "Add instructions directing Claude to focus exclusively on edge cases and error conditions rather than success paths."}, {"id": "D", "text": "Implement post-processing that filters suggestions whose descriptions match existing test names via keyword overlap."}], "correct": "A", "explanation": "Including the existing test file fixes the root cause of duplication: Claude can only avoid suggesting already-covered scenarios if it knows what tests already exist. This gives Claude the information needed to propose genuinely new, valuable tests."}, {"set": "practice", "n": 25, "scenario": "Claude Code for Continuous Integration", "situation": "After an initial automated review identifies 12 findings, a developer pushes new commits to address issues. Re-running review produces 8 findings, but developers report that 5 duplicate previous comments on code that was already fixed in the new commits. What is the most effective way to eliminate this redundant feedback while maintaining thoroughness?", "ask": "What is the most effective way to eliminate redundant feedback?", "options": [{"id": "A", "text": "Run review only when the PR is created and in the final pre-merge state, skipping intermediate commits."}, {"id": "B", "text": "Add a post-processing filter that removes findings that match previous ones by file paths and issue descriptions before posting comments."}, {"id": "C", "text": "Restrict review scope to files changed in the most recent push, excluding files from earlier commits."}, {"id": "D", "text": "Include previous review findings in context and instruct Claude to report only new or still-unresolved issues."}], "correct": "D", "explanation": "Including prior review findings in context lets Claude distinguish new problems from those already addressed in recent commits. This preserves review thoroughness while using Claude’s reasoning to avoid redundant feedback on fixed code."}, {"set": "practice", "n": 26, "scenario": "Claude Code for Continuous Integration", "situation": "Your pipeline script runs `claude \"Analyze this pull request for security issues\"`, but the job hangs indefinitely. Logs show Claude Code is waiting for interactive input. What is the correct approach to run Claude Code in an automated pipeline?", "ask": "What is the correct approach?", "options": [{"id": "A", "text": "Add a `--batch` flag: `claude --batch \"Analyze this pull request for security issues\"`."}, {"id": "B", "text": "Add the `-p` flag: `claude -p \"Analyze this pull request for security issues\"`."}, {"id": "C", "text": "Redirect stdin from `/dev/null`: `claude \"Analyze this pull request for security issues\" < /dev/null`."}, {"id": "D", "text": "Set the environment variable `CLAUDE_HEADLESS=true` before running the command."}], "correct": "B", "explanation": "The `-p` (or `--print`) flag is the documented way to run Claude Code non-interactively. It processes the prompt, prints the result to stdout, and exits without waiting for user input—ideal for CI/CD pipelines."}, {"set": "practice", "n": 27, "scenario": "Claude Code for Continuous Integration", "situation": "A pull request changes 14 files in an inventory tracking module. A single-pass review that analyzes all files together produces inconsistent results: detailed feedback on some files but shallow comments on others, missed obvious bugs, and contradictory feedback (a pattern is flagged in one file but identical code is approved in another file in the same PR). How should you restructure the review?", "ask": "How should you restructure the review?", "options": [{"id": "A", "text": "Run three independent full-PR review passes and flag only issues that appear in at least two of the three runs."}, {"id": "B", "text": "Split into focused passes: review each file individually for local issues, then run a separate integration-oriented pass to examine cross-file data flows."}, {"id": "C", "text": "Require developers to split large PRs into smaller submissions of 3–4 files before running automated review."}, {"id": "D", "text": "Switch to a larger model with a bigger context window so it can pay sufficient attention to all 14 files in one pass."}], "correct": "B", "explanation": "Focused per-file passes address the root cause—attention dilution—by ensuring consistent depth and reliable local issue detection. A separate integration-oriented pass then covers cross-file concerns such as dependency and data-flow interactions."}, {"set": "practice", "n": 28, "scenario": "Claude Code for Continuous Integration", "situation": "Your automated code review averages 15 findings per pull request, and developers report a 40% false-positive rate. The bottleneck is investigation time: developers must click into each finding to read Claude’s rationale before deciding whether to fix or dismiss it. Your CLAUDE.md already contains comprehensive rules for acceptable patterns, and stakeholders rejected any approach that filters findings before developers see them. What change best addresses investigation time?", "ask": "What change best addresses investigation time?", "options": [{"id": "A", "text": "Require Claude to include its rationale and confidence estimate directly in each finding."}, {"id": "B", "text": "Add a post-processor that analyzes finding patterns and automatically suppresses those that match historical false-positive signatures."}, {"id": "C", "text": "Categorize findings as “blocking issues” vs “suggestions,” with different review requirements by level."}, {"id": "D", "text": "Configure Claude to show only high-confidence findings, filtering uncertain flags before developers see them."}], "correct": "A", "explanation": "Including rationale and confidence directly in each finding reduces investigation time by letting developers quickly triage without opening each finding. It satisfies the “no filtering” constraint because all findings remain visible while accelerating developer decision-making."}, {"set": "practice", "n": 29, "scenario": "Claude Code for Continuous Integration", "situation": "Analysis of your automated code review shows large differences in false-positive rates by finding category: security/correctness findings have 8% false positives, performance findings 18%, style/naming findings 52%, and documentation findings 48%. Developer surveys show growing distrust—many start dismissing findings without reading because “half are wrong.” High-false-positive categories erode trust in accurate categories. Which approach best restores developer trust while improving the system?", "ask": "Which approach best restores developer trust?", "options": [{"id": "A", "text": "Temporarily disable high-false-positive categories (style, naming, documentation) and keep only high-precision categories while improving prompts."}, {"id": "B", "text": "Keep all categories enabled but display confidence scores with each finding so developers can decide what to investigate."}, {"id": "C", "text": "Keep all categories enabled and add few-shot examples to improve accuracy for each category over the next few weeks."}, {"id": "D", "text": "Apply a uniform strictness reduction across all categories to bring the overall false-positive rate down."}], "correct": "A", "explanation": "Temporarily disabling high-false-positive categories immediately stops trust erosion by removing noisy findings that cause developers to dismiss everything, while preserving value from high-precision categories like security and correctness. It also creates space to improve prompts for problematic categories before re-enabling them."}, {"set": "practice", "n": 30, "scenario": "Claude Code for Continuous Integration", "situation": "Your team wants to reduce API costs for automated analysis. Currently, synchronous Claude calls support two workflows: (1) a blocking pre-merge check that must complete before developers can merge, and (2) a technical debt report generated overnight for review the next morning. Your manager proposes moving both to the Message Batches API to save 50%. How should you evaluate this proposal?", "ask": "How should you evaluate this proposal?", "options": [{"id": "A", "text": "Move both to batch processing with fallback to synchronous calls if batches take too long."}, {"id": "B", "text": "Move both workflows to batch processing with status polling to verify completion."}, {"id": "C", "text": "Use batch processing only for technical debt reports; keep synchronous calls for pre-merge checks."}, {"id": "D", "text": "Keep synchronous calls for both workflows to avoid issues with batch result ordering."}], "correct": "C", "explanation": "Message Batches API processing can take up to 24 hours with no latency SLA, which is acceptable for overnight technical debt reports but unacceptable for blocking pre-merge checks where developers wait. This matches each workflow to the right API based on latency requirements."}, {"set": "practice", "n": 31, "scenario": "Code Generation with Claude Code", "situation": "You asked Claude Code to implement a function that transforms API responses into an internal normalized format. After two iterations, the output structure still doesn’t match expectations—some fields are nested differently and timestamps are formatted incorrectly. You described requirements in prose, but Claude interprets them differently each time.", "ask": "Which approach is most effective for the next iteration?", "options": [{"id": "A", "text": "Write a JSON schema describing the expected output structure and validate Claude’s output against it after each iteration."}, {"id": "B", "text": "Provide 2–3 concrete input-output examples showing the expected transformation for representative API responses."}, {"id": "C", "text": "Rewrite requirements with more technical precision, specifying exact field mappings, nesting rules, and timestamp format strings."}, {"id": "D", "text": "Ask Claude to explain its current understanding of the requirements to identify where interpretations diverge."}], "correct": "B", "explanation": "Concrete input-output examples remove ambiguity inherent in prose descriptions by showing Claude the exact expected transformation results. This directly addresses the root cause—misinterpretation of textual requirements—by providing unambiguous patterns for field nesting and timestamp formatting."}, {"set": "practice", "n": 32, "scenario": "Code Generation with Claude Code", "situation": "You need to add Slack as a new notification channel. The existing codebase has clear, established patterns for email, SMS, and push channels. However, Slack’s API offers fundamentally different integration approaches—incoming webhooks (simple, one-way), bot tokens (support delivery confirmation and programmatic control), or Slack Apps (two-way events, requires workspace approval). Your task says “add Slack support” without specifying integration method or requiring advanced features like delivery tracking.", "ask": "How should you approach this task?", "options": [{"id": "A", "text": "Start in direct execution mode using incoming webhooks to match the existing one-way notification pattern."}, {"id": "B", "text": "Switch to planning mode to explore integration options and architectural implications, then present a recommendation before implementation."}, {"id": "C", "text": "Start in direct execution mode by scaffolding a Slack channel class using existing patterns, deferring the integration method decision."}, {"id": "D", "text": "Start in direct execution mode using a bot-token approach to ensure delivery confirmation is possible."}], "correct": "B", "explanation": "Slack integration has multiple valid approaches with significantly different architectural implications, and requirements are ambiguous. Planning mode lets you evaluate trade-offs among webhooks, bot tokens, and Slack Apps and align on an approach before implementation."}, {"set": "practice", "n": 33, "scenario": "Code Generation with Claude Code", "situation": "Your CLAUDE.md file has grown to 400+ lines containing coding standards, testing conventions, a detailed PR review checklist, deployment instructions, and database migration procedures. You want Claude to always follow coding standards and testing conventions, but apply PR review, deploy, and migration guidance only when doing those tasks.", "ask": "Which restructuring approach is most effective?", "options": [{"id": "A", "text": "Move all guidance into separate Skills files organized by workflow type, leaving only a brief project description in CLAUDE.md."}, {"id": "B", "text": "Keep everything in CLAUDE.md but use `@import` syntax to organize into separately maintained files by category."}, {"id": "C", "text": "Split CLAUDE.md into files under `.claude/rules/` with path-bound glob patterns so each rule loads only for the relevant file types."}, {"id": "D", "text": "Keep universal standards in CLAUDE.md and create Skills for workflow-specific guidance (PR review, deploy, migrations) with trigger keywords."}], "correct": "D", "explanation": "CLAUDE.md content loads in every session, ensuring coding standards and testing conventions always apply, while Skills are invoked on demand when Claude detects trigger keywords—ideal for workflow-specific guidance like PR review, deployment, and migrations."}, {"set": "practice", "n": 34, "scenario": "Code Generation with Claude Code", "situation": "You’re tasked with restructuring your team’s monolithic application into microservices. This impacts changes across dozens of files and requires decisions about service boundaries and module dependencies.", "ask": "Which approach should you choose?", "options": [{"id": "A", "text": "Switch to planning mode to explore the codebase, understand dependencies, and design the implementation approach before making changes."}, {"id": "B", "text": "Start in direct execution mode and switch to planning only after encountering unexpected complexity during implementation."}, {"id": "C", "text": "Start in direct execution mode and make incremental changes, letting implementation reveal natural service boundaries."}, {"id": "D", "text": "Use direct execution with detailed upfront instructions that specify each service structure."}], "correct": "A", "explanation": "Planning mode is the right strategy for complex architectural restructuring like splitting a monolith: it allows safe exploration and informed decisions about boundaries before committing to potentially expensive changes across many files."}, {"set": "practice", "n": 35, "scenario": "Code Generation with Claude Code", "situation": "Your team created a `/analyze-codebase` skill that performs deep code analysis—dependency scanning, test coverage counts, and code quality metrics. After running the command, team members report Claude becomes less responsive in the session and loses the context of the original task.", "ask": "How do you most effectively fix this while keeping full analysis capabilities?", "options": [{"id": "A", "text": "Add `context: fork` in the skill frontmatter to run the analysis in an isolated subagent context."}, {"id": "B", "text": "Add `model: haiku` in frontmatter to use a faster, cheaper model for analysis."}, {"id": "C", "text": "Split the skill into three smaller skills, each producing less output."}, {"id": "D", "text": "Add instructions to the skill to compress all results into a short summary before displaying them."}], "correct": "A", "explanation": "`context: fork` runs the analysis in an isolated subagent context so the large output does not pollute the main session’s context window and Claude does not lose track of the original task. It preserves full analysis capability while keeping the main session responsive."}, {"set": "practice", "n": 36, "scenario": "Code Generation with Claude Code", "situation": "Your team uses a `/commit` skill in `.claude/skills/commit/SKILL.md`. A developer wants to customize it for their personal workflow (different commit message format, extra checks) without affecting teammates.", "ask": "What do you recommend?", "options": [{"id": "A", "text": "Create a personal version under `~/.claude/skills/` with a different name, e.g., `/my-commit`."}, {"id": "B", "text": "Add conditional logic based on username in the project skill frontmatter."}, {"id": "C", "text": "Create a personal version at `~/.claude/skills/commit/SKILL.md` with the same name."}, {"id": "D", "text": "Set `override: true` in the personal skill frontmatter to prioritize it over the project version."}], "correct": "C", "explanation": "Skill resolution is positional: enterprise overrides personal, and personal overrides project. A personal skill at `~/.claude/skills/commit/SKILL.md` therefore shadows the team's `.claude/skills/commit/SKILL.md` for that developer alone — nothing in the repository changes, so teammates keep running the project version and `/commit` behaves the same for everyone else. A works mechanically but is the weaker recommendation: the project `/commit` stays active alongside `/my-commit`, and two skills with near-identical `description` fields make Claude's automatic skill selection unpredictable, while breaking the muscle memory and team docs that say to run `/commit`. B fails because skill frontmatter has no conditional or username facility, and it would require editing the shared project file the scenario rules out. D fails because there is no `override` field — precedence comes from location, not from a declaration."}, {"set": "practice", "n": 37, "scenario": "Code Generation with Claude Code", "situation": "Your team has used Claude Code for months. Recently, three developers report Claude follows the guidance “always include comprehensive error handling,” but a fourth developer who just joined says Claude does not follow it. All four work in the same repo and have up-to-date code.", "ask": "What is the most likely cause and fix?", "options": [{"id": "A", "text": "The guidance lives in the original developers’ user-level `~/.claude/CLAUDE.md` files, not in the project `.claude/CLAUDE.md`. Move the instruction to the project-level file so all team members receive
