specific validation error", "Add few-shot examples for documents with different structures", "Use batch processing via the Message Batches API: 100 documents, handle failures via `custom_id`", "Route to humans: field-level confidence scores, document-type analysis"], "domains": "4 (Prompt engineering), 5 (Context and reliability)"}, {"title": "Designing and Debugging a Multi-agent Research Pipeline", "goal": "Subagent orchestration, context passing, error propagation, synthesis with source tracking.", "steps": ["A coordinator with 2+ subagents (`allowedTools` includes `\"Task\"`, context is passed explicitly in prompts)", "Run subagents in parallel via multiple `Task` calls in a single response", "Require structured subagent output: claim, quote, source URL, publication date", "Simulate a subagent timeout: return structured error context to the coordinator and continue with partial results", "Test with conflicting data: preserve both values with attribution; separate confirmed vs disputed findings"], "domains": "1 (Agent architecture), 2 (Tools and MCP), 5 (Context and reliability)"}], "prep": ["**Build an agent with the Claude Agent SDK** — implement a full agent loop with tool calling, error handling, and session management. Practice subagents and explicit context passing.", "**Configure Claude Code for a real project** — use CLAUDE.md hierarchy, path-specific rules in `.claude/rules/`, skills with `context: fork` and `allowed-tools`, and MCP server integration.", "**Design and test MCP tools** — write descriptions that differentiate similar tools, return structured errors with categories and retry flags, and test against ambiguous user requests.", "**Build a data extraction pipeline** — use `tool_use` with JSON schemas, validation/retry loops, optional/nullable fields, and batch processing via the Message Batches API.", "**Practice prompt engineering** — add few-shot examples for ambiguous scenarios, explicit review criteria, and multi-pass architectures for large code reviews.", "**Study context management patterns** — extract facts from verbose outputs, use scratchpad files, and delegate discovery to subagents to handle context limits.", "**Understand escalation and human-in-the-loop** — when to escalate (policy gaps, explicit user request, inability to make progress) and confidence-based routing workflows.", "**Take a practice exam** before the real one. It uses the same scenarios and format."], "oos": ["Fine-tuning Claude models or training custom models", "Claude API authentication, billing, or account management", "Detailed implementation in specific programming languages or frameworks (beyond what’s needed for tool/schema configuration)", "Deploying or hosting MCP servers (infrastructure, networking, container orchestration)", "Claude’s internal architecture, training process, or model weights", "Constitutional AI, RLHF, or safety training methodologies", "Embedding models or vector database implementation details", "Computer use (browser automation, desktop interaction)", "Image analysis capabilities (Vision)", "Streaming API or server-sent events", "Rate limiting, quotas, or detailed API cost calculations", "OAuth, API key rotation, or authentication protocol details", "Cloud-provider-specific configurations (AWS, GCP, Azure)", "Performance benchmarks or model comparison metrics", "Prompt caching implementation details (beyond knowing it exists)", "Token counting algorithms or tokenization specifics"], "tech": [["Claude Agent SDK", "AgentDefinition, agent loops, `stop_reason`, hooks (PostToolUse), spawning subagents via Task, `allowedTools`"], ["Model Context Protocol (MCP)", "MCP servers, tools, resources, `isError`, tool descriptions, `.mcp.json`, environment variables"], ["Claude Code", "CLAUDE.md hierarchy, `.claude/rules/` with glob patterns, `.claude/commands/`, `.claude/skills/` with SKILL.md, planning mode, `/compact`, `--resume`, `fork_session`"], ["Claude Code CLI", "`-p` / `--print` for non-interactive mode, `--output-format json`, `--json-schema`"], ["Claude API", "`tool_use` with JSON schemas, `tool_choice` (\"auto\"/\"any\"/forced), `stop_reason`, `max_tokens`, system prompts"], ["Message Batches API", "50% savings, up to 24-hour window, `custom_id`, no multi-turn tool calling"], ["JSON Schema", "Required vs optional, nullable fields, enum types, \"other\" + detail, strict mode"], ["Pydantic", "Schema validation, semantic errors, validation/retry loops"], ["Built-in tools", "Read, Write, Edit, Bash, Grep, Glob — purpose and selection criteria"], ["Few-shot prompting", "Targeted examples for ambiguous situations, generalization to new patterns"], ["Prompt chaining", "Sequential decomposition into focused passes"], ["Context window", "Token budgets, progressive summarization, \"lost in the middle\", scratchpad files"], ["Session management", "Resume, `fork_session`, named sessions, context isolation"], ["Confidence calibration", "Field-level scoring, calibration on labeled sets, stratified sampling"]], "cand": ["**Claude Agent SDK** — multi-agent orchestration, delegating to subagents, tool integration, lifecycle hooks", "**Claude Code** — CLAUDE.md, MCP servers, Agent Skills, planning mode", "**Model Context Protocol (MCP)** — tools and resources for backend integration", "**Prompt engineering** — JSON schemas, few-shot examples, data extraction templates", "**Context windows** — working with long documents, multi-agent context passing", "**CI/CD pipelines** — automated code review, test generation", "**Escalation and reliability** — error handling, human-in-the-loop"], "candlead": "The ideal candidate is a **solution architect** who designs and ships production applications with Claude. You should have at least 6 months of hands-on experience with:", "lede": "The **Claude Certified Architect — Foundations** certification confirms that a specialist can make sound trade-off decisions when implementing real-world Claude-based solutions. The exam assesses foundational knowledge of Claude Code, the Claude Agent SDK, the Claude API, and the Model Context Protocol (MCP)—the core technologies for building production applications with Claude."}, "vi": {"examples": [{"set": "example", "n": 1, "situation": "Dữ liệu cho thấy trong 12% trường hợp, agent bỏ qua `get_customer` và gọi `lookup_order` chỉ dựa trên tên của khách hàng, dẫn đến hoàn tiền sai.", "ask": "Thay đổi nào hiệu quả nhất?", "options": [{"id": "A", "text": "Thêm một điều kiện tiên quyết bằng code để chặn `lookup_order` và `process_refund` cho đến khi lấy được ID từ `get_customer`"}, {"id": "B", "text": "Cải thiện system prompt"}, {"id": "C", "text": "Thêm các ví dụ few-shot"}, {"id": "D", "text": "Triển khai một bộ phân loại định tuyến (routing classifier)"}], "correct": "A", "explanation": "Khi logic nghiệp vụ quan trọng đòi hỏi một trình tự tool cụ thể, phần mềm mang lại **các đảm bảo deterministic** mà các cách tiếp cận dựa trên prompt (B, C) không thể có được. D giải quyết vấn đề về tính sẵn sàng, không phải về thứ tự gọi tool.", "scenario": "Customer Support Agent"}, {"set": "example", "n": 2, "situation": "Agent thường gọi `get_customer` thay vì `lookup_order` cho các câu hỏi liên quan đến đơn hàng. Mô tả của các tool sơ sài và giống nhau.", "ask": "Bước đầu tiên là gì?", "options": [{"id": "A", "text": "Các ví dụ few-shot"}, {"id": "B", "text": "Mở rộng mô tả của mỗi tool với định dạng đầu vào, ví dụ và ranh giới áp dụng"}, {"id": "C", "text": "Thêm một lớp định tuyến (routing layer)"}, {"id": "D", "text": "Gộp các tool lại"}], "correct": "B", "explanation": "Mô tả tool là cơ chế lựa chọn chính của mô hình. Đây là cách sửa tốn ít công sức nhất nhưng tác động lớn nhất. A bổ sung token mà không giải quyết nguyên nhân gốc rễ. C là thiết kế quá mức (overengineering). D đòi hỏi nhiều công sức hơn mức cần thiết.", "scenario": "Customer Support Agent"}, {"set": "example", "n": 3, "situation": "Agent chỉ giải quyết được 55% sự vụ trong khi mục tiêu là 80%. Nó escalation cả những trường hợp đơn giản và lại cố tự xử lý các ngoại lệ chính sách phức tạp.", "ask": "Bạn cải thiện việc hiệu chỉnh (calibration) như thế nào?", "options": [{"id": "A", "text": "Thêm các tiêu chí escalation rõ ràng kèm các ví dụ few-shot"}, {"id": "B", "text": "Để mô hình tự đánh giá độ tin cậy (1–10) với escalation tự động"}, {"id": "C", "text": "Một bộ phân loại riêng được huấn luyện trên dữ liệu lịch sử"}, {"id": "D", "text": "Phân tích cảm xúc (sentiment analysis)"}], "correct": "A", "explanation": "Cách này giải quyết trực tiếp nguyên nhân gốc rễ—ranh giới quyết định không rõ ràng. B không đáng tin cậy (mô hình có thể sai mà vẫn tự tin). C là thiết kế quá mức. D giải quyết một vấn đề khác (tâm trạng != độ phức tạp).", "scenario": "Customer Support Agent"}, {"set": "example", "n": 4, "situation": "Bạn cần một lệnh `/review` tùy chỉnh cho việc review code theo chuẩn, có sẵn cho cả nhóm khi họ clone repository.", "ask": "Bạn nên tạo file lệnh ở đâu?", "options": [{"id": "A", "text": "`.claude/commands/` trong repository của dự án"}, {"id": "B", "text": "`~/.claude/commands/`"}, {"id": "C", "text": "`CLAUDE.md` ở thư mục gốc"}, {"id": "D", "text": "`.claude/config.json`"}], "correct": "A", "explanation": "Các lệnh cấp dự án được lưu trong `.claude/commands/` được quản lý phiên bản và tự động có sẵn cho mọi người. B dành cho các lệnh cá nhân. C dành cho hướng dẫn, không phải định nghĩa lệnh. D không tồn tại.", "scenario": "Code Generation with Claude Code"}, {"set": "example", "n": 5, "situation": "Bạn cần tái cấu trúc một monolith thành microservices (hàng chục file, các quyết định về ranh giới dịch vụ).", "ask": "Bạn nên dùng cách tiếp cận nào?", "options": [{"id": "A", "text": "Planning mode: khám phá codebase, hiểu các phụ thuộc, thiết kế cách tiếp cận"}, {"id": "B", "text": "Thực thi trực tiếp theo từng phần nhỏ tăng dần"}, {"id": "C", "text": "Thực thi trực tiếp với hướng dẫn chi tiết được đưa ra ngay từ đầu"}, {"id": "D", "text": "Thực thi trực tiếp và chuyển sang planning khi gặp khó"}], "correct": "A", "explanation": "Planning mode được thiết kế cho các thay đổi lớn, nhiều cách tiếp cận khả thi và các quyết định kiến trúc. B có nguy cơ phải làm lại tốn kém. C giả định bạn đã biết sẵn cấu trúc. D mang tính phản ứng bị động.", "scenario": "Code Generation with Claude Code"}, {"set": "example", "n": 6, "situation": "Một codebase có các quy ước khác nhau giữa các khu vực (React, API, database). Các test được đặt cùng chỗ với code. Bạn muốn các quy ước được áp dụng tự động.", "ask": "Bạn nên dùng cách tiếp cận nào?", "options": [{"id": "A", "text": "Các file `.claude/rules/` với YAML frontmatter và glob pattern"}, {"id": "B", "text": "Đặt mọi thứ trong CLAUDE.md ở thư mục gốc"}, {"id": "C", "text": "Skills trong `.claude/skills/`"}, {"id": "D", "text": "CLAUDE.md trong mọi thư mục"}], "correct": "A", "explanation": "`.claude/rules/` với glob pattern (ví dụ `**/*.test.tsx`) cho phép áp dụng quy ước tự động dựa trên đường dẫn file—lý tưởng cho các test nằm rải rác khắp codebase. B dựa vào suy luận của mô hình. C mang tính thủ công/theo yêu cầu. D không hoạt động tốt khi các file liên quan nằm ở nhiều thư mục.", "scenario": "Code Generation with Claude Code"}, {"set": "example", "n": 7, "situation": "Hệ thống nghiên cứu chủ đề “tác động của AI lên các ngành sáng tạo”, nhưng báo cáo chỉ đề cập đến nghệ thuật thị giác. Coordinator đã phân rã chủ đề thành: “AI trong nghệ thuật số”, “AI trong thiết kế đồ họa”, “AI trong nhiếp ảnh”.", "ask": "Nguyên nhân là gì?", "options": [{"id": "A", "text": "Agent tổng hợp (synthesis) không phát hiện ra các lỗ hổng"}, {"id": "B", "text": "Coordinator đã phân rã nhiệm vụ quá hẹp"}, {"id": "C", "text": "Agent tìm kiếm web không tìm đủ kỹ"}, {"id": "D", "text": "Agent phân tích tài liệu đã lọc bỏ các nguồn không thuộc nghệ thuật thị giác"}], "correct": "B", "explanation": "Log cho thấy coordinator chỉ phân rã “các ngành sáng tạo” thành các chủ đề con về thị giác, bỏ sót hoàn toàn âm nhạc, văn học và điện ảnh. Các subagent đã thực thi đúng—vấn đề nằm ở những gì chúng được giao.", "scenario": "Multi-agent Research System"}, {"set": "example", "n": 8, "situation": "Một subagent tìm kiếm web bị timeout khi nghiên cứu một chủ đề phức tạp. Bạn cần thiết kế cách thông tin lỗi được truyền ngược về coordinator.", "ask": "Cách tiếp cận lan truyền lỗi nào hỗ trợ tốt nhất cho việc khôi phục một cách thông minh?", "options": [{"id": "A", "text": "Trả về context lỗi có cấu trúc cho coordinator: loại lỗi, query, kết quả một phần và các phương án thay thế"}, {"id": "B", "text": "Triển khai retry tự động với exponential backoff bên trong subagent, rồi trả về một trạng thái chung chung “search unavailable”"}, {"id": "C", "text": "Bắt timeout bên trong subagent và trả về một tập kết quả rỗng được đánh dấu là thành công"}, {"id": "D", "text": "Lan truyền ngoại lệ timeout lên một handler ở cấp cao nhất để chấm dứt toàn bộ workflow"}], "correct": "A", "explanation": "Context lỗi có cấu trúc cung cấp cho coordinator những gì nó cần để quyết định có nên retry với một query đã chỉnh sửa, thử một cách tiếp cận thay thế, hay tiếp tục với kết quả một phần. B che giấu context phía sau một trạng thái chung chung. C che đậy thất bại như thể thành công. D hủy bỏ toàn bộ workflow một cách không cần thiết.", "scenario": "Multi-agent Research System"}, {"set": "example", "n": 9, "situation": "Agent tổng hợp (synthesis) thường cần xác minh các tuyên bố cụ thể trong khi hợp nhất kết quả. Hiện tại, khi cần xác minh, agent tổng hợp trao quyền điều khiển lại cho coordinator, coordinator gọi agent tìm kiếm web rồi chạy lại quá trình tổng hợp với kết quả mới. Điều này thêm 2–3 lượt round trip cho mỗi nhiệm vụ và làm tăng độ trễ thêm 40%. Đánh giá của bạn cho thấy 85% các lần kiểm tra này là kiểm tra dữ kiện đơn giản (ngày tháng, tên, số liệu thống kê), trong khi 15% đòi hỏi điều tra sâu hơn.", "ask": "Bạn giảm chi phí phụ trội (overhead) như thế nào trong khi vẫn duy trì độ tin cậy?", "options": [{"id": "A", "text": "Cấp cho agent tổng hợp một tool `verify_fact` giới hạn cho các kiểm tra đơn giản, và tiếp tục định tuyến việc xác minh phức tạp qua coordinator"}, {"id": "B", "text": "Gom tất cả các nhu cầu xác minh vào một batch và trả về cho coordinator ở cuối"}, {"id": "C", "text": "Cấp cho agent tổng hợp toàn quyền truy cập tất cả các tool tìm kiếm web"}, {"id": "D", "text": "Chủ động cache thêm context xung quanh mỗi nguồn"}], "correct": "A", "explanation": "Cách này áp dụng nguyên tắc least privilege: agent tổng hợp nhận được đúng những gì nó cần cho trường hợp phổ biến chiếm 85% (kiểm tra dữ kiện đơn giản) trong khi vẫn giữ lại đường đi qua trung gian coordinator cho các điều tra phức tạp. B đưa vào các phụ thuộc gây nghẽn (các bước tổng hợp sau có thể phụ thuộc vào các dữ kiện đã xác minh trước đó). C phá vỡ sự tách bạch trách nhiệm. D dựa vào việc cache mang tính phỏng đoán, không thể dự đoán nhu cầu một cách đáng tin cậy.", "scenario": "Multi-agent Research System"}, {"set": "example", "n": 10, "situation": "Một pipeline chạy `claude \"Analyze this pull request for security issues\"`, nhưng treo lại để chờ đầu vào tương tác.", "ask": "Cách tiếp cận đúng là gì?", "options": [{"id": "A", "text": "Dùng cờ `-p`: `claude -p \"Analyze this pull request for security issues\"`"}, {"id": "B", "text": "Đặt `CLAUDE_HEADLESS=true`"}, {"id": "C", "text": "Chuyển hướng stdin từ `/dev/null`"}, {"id": "D", "text": "Dùng `--batch`"}], "correct": "A", "explanation": "`-p` (hay `--print`) là cách được tài liệu hóa để chạy Claude Code ở chế độ non-interactive. Nó xử lý prompt, in ra stdout, rồi thoát. Các phương án khác hoặc là tính năng không tồn tại hoặc là các cách lách kiểu Unix.", "scenario": "Claude Code for Continuous Integration"}, {"set": "example", "n": 11, "situation": "Nhóm muốn giảm chi phí API cho việc phân tích tự động. Hiện Claude phục vụ hai workflow theo thời gian thực: (1) một bước kiểm tra chặn (blocking) trước khi merge, phải hoàn thành trước khi lập trình viên có thể merge một PR, và (2) một báo cáo về tech-debt được tạo qua đêm để xem vào buổi sáng. Một quản lý đề xuất chuyển cả hai sang Message Batches API để tiết kiệm 50%.", "ask": "Bạn nên đánh giá đề xuất này như thế nào?", "options": [{"id": "A", "text": "Chỉ dùng xử lý batch cho các báo cáo tech-debt; giữ các lệnh gọi thời gian thực cho bước kiểm tra trước khi merge"}, {"id": "B", "text": "Chuyển cả hai workflow sang xử lý batch và poll để chờ hoàn thành"}, {"id": "C", "text": "Giữ các lệnh gọi thời gian thực cho cả hai để tránh các vấn đề về thứ tự trong kết quả batch"}, {"id": "D", "text": "Chuyển cả hai sang xử lý batch với một fallback về thời gian thực nếu một batch mất quá lâu"}], "correct": "A", "explanation": "Message Batches API tiết kiệm 50%, nhưng thời gian xử lý có thể lên tới 24 giờ mà không có SLA về độ trễ được đảm bảo. Điều đó khiến nó không phù hợp cho các bước kiểm tra chặn trước khi merge nơi lập trình viên đang chờ, nhưng lý tưởng cho các tải batch chạy qua đêm như báo cáo tech-debt.", "scenario": "Claude Code for Continuous Integration"}, {"set": "example", "n": 12, "situation": "Một pull request thay đổi 14 file trong một module theo dõi kho hàng. Việc review tất cả các file trong một lượt duy nhất cho ra kết quả không nhất quán: nhận xét chi tiết cho một số file nhưng hời hợt cho các file khác, bỏ sót những lỗi hiển nhiên, và phản hồi mâu thuẫn (một pattern bị gắn cờ là có vấn đề ở một file nhưng lại được chấp thuận với code y hệt ở một file khác).", "ask": "Bạn nên tái cấu trúc việc review như thế nào?", "options": [{"id": "A", "text": "Chia thành các lượt tập trung: phân tích từng file riêng lẻ cho các vấn đề cục bộ, rồi chạy một lượt tích hợp riêng cho các luồng dữ liệu liên file"}, {"id": "B", "text": "Yêu cầu lập trình viên chia các PR lớn thành các lần nộp gồm 3–4 file"}, {"id": "C", "text": "Chuyển sang một mô hình cấp cao hơn với context window lớn hơn để review tất cả 14 file trong một lượt"}, {"id": "D", "text": "Chạy ba lượt review toàn bộ PR độc lập và chỉ báo cáo những vấn đề được tìm thấy ở ít nhất hai lượt"}], "correct": "A", "explanation": "Các lượt tập trung giải quyết trực tiếp nguyên nhân gốc rễ—sự pha loãng chú ý khi xử lý nhiều file cùng lúc. Phân tích theo từng file đảm bảo độ sâu nhất quán, và một lượt tích hợp riêng bắt được các vấn đề liên file. B đẩy gánh nặng sang lập trình viên mà không cải thiện hệ thống. C là một quan niệm sai lầm: context lớn hơn không khắc phục chất lượng chú ý. D che lấp các lỗi thật vì đòi hỏi sự đồng thuận trên các phát hiện vốn không nhất quán.", "scenario": "Multi-file Code Review"}], "practice": [{"set": "practice", "n": 1, "situation": "Một agent phân tích tài liệu phát hiện rằng hai nguồn đáng tin cậy chứa những số liệu thống kê mâu thuẫn trực tiếp cho một chỉ số quan trọng: một báo cáo của chính phủ nêu mức tăng trưởng 40%, trong khi một phân tích ngành nêu 12%. Cả hai nguồn đều trông đáng tin cậy, và sự chênh lệch này có thể ảnh hưởng đáng kể đến các kết luận nghiên cứu. Agent phân tích tài liệu nên xử lý tình huống này hiệu quả nhất như thế nào?", "ask": "Cách tiếp cận nào là hiệu quả nhất?", "options": [{"id": "A", "text": "Áp dụng các quy tắc kinh nghiệm về độ tin cậy để chọn ra con số có khả năng đúng nhất, hoàn thành phân tích với giá trị đó, và thêm một chú thích đề cập đến sự chênh lệch."}, {"id": "B", "text": "Đưa cả hai con số vào kết quả phân tích mà không đánh dấu chúng là mâu thuẫn, để agent tổng hợp quyết định dùng con số nào dựa trên bối cảnh rộng hơn."}, {"id": "C", "text": "Dừng phân tích và lập tức escalation lên coordinator, yêu cầu nó quyết định nguồn nào có thẩm quyền hơn trước khi tiếp tục."}, {"id": "D", "text": "Hoàn thành phân tích với cả hai con số, chú thích rõ ràng sự mâu thuẫn kèm theo nguồn trích dẫn, và để coordinator quyết định cách dung hòa dữ liệu trước khi chuyển sang tổng hợp."}], "correct": "D", "explanation": "Cách tiếp cận này bảo toàn sự phân tách trách nhiệm: agent phân tích hoàn thành công việc cốt lõi của nó mà không bị chặn, giữ lại cả hai giá trị mâu thuẫn kèm trích dẫn rõ ràng, và chuyển đúng việc dung hòa cho coordinator, vốn có bối cảnh rộng hơn.", "scenario": "Multi-agent Research System"}, {"set": "practice", "n": 2, "situation": "Các agent web-search và document-analysis đã hoàn thành nhiệm vụ của chúng và trả kết quả về cho coordinator. Bước tiếp theo để tạo một báo cáo nghiên cứu tích hợp là gì?", "ask": "Bước tiếp theo nào là phù hợp nhất?", "options": [{"id": "A", "text": "Mỗi agent gửi kết quả của nó trực tiếp đến agent viết báo cáo, bỏ qua coordinator."}, {"id": "B", "text": "Agent phân tích tài liệu yêu cầu kết quả web-search và hợp nhất chúng trong nội bộ."}, {"id": "C", "text": "Coordinator chuyển cả hai bộ kết quả cho agent tổng hợp để tích hợp thống nhất."}, {"id": "D", "text": "Coordinator nối các kết quả thô từ cả hai agent và trả về như kết quả cuối cùng."}], "correct": "C", "explanation": "Trong kiến trúc coordinator–subagent, coordinator chuyển cả hai bộ kết quả cho agent tổng hợp để tích hợp tập trung, bảo toàn quyền kiểm soát và đảm bảo việc hợp nhất chất lượng cao.", "scenario": "Multi-agent Research System"}, {"set": "practice", "n": 3, "situation": "Một subagent phân tích tài liệu thường xuyên thất bại khi xử lý các file PDF: một số file có các phần bị hỏng gây ra ngoại lệ phân tích cú pháp, một số khác được bảo vệ bằng mật khẩu, và đôi khi thư viện phân tích cú pháp bị treo trên các file lớn. Hiện tại, bất kỳ ngoại lệ nào cũng ngay lập tức kết thúc subagent và trả về lỗi cho coordinator, vốn phải quyết định nên retry, bỏ qua, hay để cả nhiệm vụ thất bại. Điều này khiến coordinator phải tham gia quá mức vào việc xử lý lỗi thông thường. Cải tiến kiến trúc nào là hiệu quả nhất?", "ask": "Cải tiến nào là hiệu quả nhất?", "options": [{"id": "A", "text": "Tạo một agent xử lý lỗi chuyên dụng giám sát mọi thất bại qua một hàng đợi dùng chung và quyết định các hành động khôi phục, gửi lệnh khởi động lại trực tiếp đến các subagent."}, {"id": "B", "text": "Cấu hình subagent để luôn trả về kết quả một phần với trạng thái thành công, nhúng chi tiết lỗi vào metadata; coordinator xem mọi phản hồi là thành công."}, {"id": "C", "text": "Buộc coordinator xác thực tất cả tài liệu trước khi gửi chúng đến subagent, từ chối các tài liệu có thể gây thất bại."}, {"id": "D", "text": "Triển khai khôi phục cục bộ trong subagent cho các thất bại tạm thời và chỉ escalation lên coordinator những lỗi mà nó không thể tự giải quyết, kèm theo các bước đã thử và kết quả một phần."}], "correct": "D", "explanation": "Hãy xử lý lỗi ở cấp thấp nhất có khả năng giải quyết chúng. Khôi phục cục bộ làm giảm khối lượng công việc của coordinator trong khi vẫn escalation những vấn đề thực sự không thể khôi phục kèm theo đầy đủ bối cảnh và tiến độ một phần.", "scenario": "Multi-agent Research System"}, {"set": "practice", "n": 4, "situation": "Sau khi chạy hệ thống trên chủ đề “tác động của AI lên các ngành công nghiệp sáng tạo,” bạn quan sát thấy mọi subagent đều hoàn thành thành công: agent web-search tìm thấy các bài viết liên quan, agent phân tích tài liệu tóm tắt chúng chính xác, và agent tổng hợp tạo ra văn bản mạch lạc. Tuy nhiên, các báo cáo cuối cùng chỉ bao phủ nghệ thuật thị giác và hoàn toàn bỏ sót âm nhạc, văn học, và điện ảnh. Trong log của coordinator, bạn thấy nó đã phân rã chủ đề thành ba subtask: “AI trong nghệ thuật số,” “AI trong thiết kế đồ họa,” và “AI trong nhiếp ảnh.” Nguyên nhân gốc rễ có khả năng nhất là gì?", "ask": "Nguyên nhân gốc rễ có khả năng nhất là gì?", "options": [{"id": "A", "text": "Agent tổng hợp thiếu hướng dẫn để phát hiện các lỗ hổng về độ bao phủ."}, {"id": "B", "text": "Agent phân tích tài liệu lọc bỏ các nguồn phi thị giác do tiêu chí liên quan quá nghiêm ngặt."}, {"id": "C", "text": "Việc phân rã nhiệm vụ của coordinator quá hẹp, giao cho các subagent công việc không bao phủ tất cả các lĩnh vực liên quan."}, {"id": "D", "text": "Các truy vấn của agent web-search là không đủ và nên được mở rộng để bao phủ nhiều ngành hơn."}], "correct": "C", "explanation": "Coordinator chỉ phân rã một chủ đề rộng thành các subtask về nghệ thuật thị giác, bỏ sót hoàn toàn âm nhạc, văn học, và điện ảnh. Vì các subagent đã thực hiện đúng phần việc được giao, việc phân rã quá hẹp là nguyên nhân gốc rễ hiển nhiên.", "scenario": "Multi-agent Research System"}, {"set": "practice", "n": 5, "situation": "Subagent web-search chỉ trả về kết quả cho 3 trên 5 danh mục nguồn được yêu cầu (các trang web đối thủ và báo cáo ngành thành công, nhưng kho lưu trữ tin tức và các nguồn cấp mạng xã hội bị timeout). Subagent phân tích tài liệu xử lý thành công tất cả các tài liệu được cung cấp. Subagent tổng hợp phải tạo ra một bản tóm tắt từ các đầu vào thượng nguồn có chất lượng hỗn hợp. Chiến lược lan truyền lỗi nào là hiệu quả nhất?", "ask": "Chiến lược lan truyền lỗi nào là hiệu quả nhất?", "options": [{"id": "A", "text": "Tiếp tục tổng hợp chỉ dùng các nguồn thành công và tạo ra một kết quả mà không đề cập đến dữ liệu nào không khả dụng."}, {"id": "B", "text": "Subagent tổng hợp trả về lỗi cho coordinator, kích hoạt một lần retry toàn bộ hoặc làm cho nhiệm vụ thất bại do dữ liệu không đầy đủ."}, {"id": "C", "text": "Subagent tổng hợp yêu cầu coordinator retry các nguồn bị timeout với timeout dài hơn trước khi bắt đầu tổng hợp."}, {"id": "D", "text": "Cấu trúc kết quả tổng hợp với các chú thích về độ bao phủ cho biết những kết luận nào được hỗ trợ tốt và những lỗ hổng tồn tại ở đâu do các nguồn không khả dụng."}], "correct": "D", "explanation": "Các chú thích về độ bao phủ hiện thực hóa sự suy giảm nhẹ nhàng (graceful degradation) kèm tính minh bạch, bảo toàn giá trị từ phần việc đã hoàn thành trong khi lan truyền sự không chắc chắn để cho phép các quyết định có hiểu biết về độ tin cậy.", "scenario": "Multi-agent Research System"}, {"set": "practice", "n": 6, "situation": "Subagent phân tích tài liệu gặp một file PDF bị hỏng mà nó không thể phân tích cú pháp. Khi thiết kế việc xử lý lỗi của hệ thống, cách hiệu quả nhất để xử lý thất bại này là gì?", "ask": "Cách tiếp cận nào là hiệu quả nhất?", "options": [{"id": "A", "text": "Trả về lỗi kèm bối cảnh cho agent coordinator, cho phép nó quyết định cách tiến hành."}, {"id": "B", "text": "Âm thầm bỏ qua tài liệu bị hỏng và tiếp tục xử lý các file còn lại để tránh làm gián đoạn quy trình."}, {"id": "C", "text": "Tự động retry phân tích cú pháp tài liệu ba lần với exponential backoff trước khi báo cáo thất bại."}, {"id": "D", "text": "Ném ra một ngoại lệ chấm dứt toàn bộ quy trình nghiên cứu."}], "correct": "A", "explanation": "Trả về lỗi kèm bối cảnh cho coordinator là cách tiếp cận hiệu quả nhất vì nó cho phép coordinator đưa ra quyết định có hiểu biết—bỏ qua file, thử một phương pháp phân tích cú pháp thay thế, hoặc thông báo cho người dùng—trong khi vẫn duy trì khả năng quan sát thất bại đó.", "scenario": "Multi-agent Research System"}, {"set": "practice", "n": 7, "situation": "Log sản xuất cho thấy một mẫu hình dai dẳng: các yêu cầu như “phân tích báo cáo quý đã tải lên” được định tuyến đến agent web-search 45% số lần thay vì đến agent phân tích tài liệu. Xem xét các định nghĩa tool, bạn thấy rằng agent web-search có một tool `analyze_content` được mô tả là “phân tích nội dung và trích xuất thông tin then chốt,” trong khi agent phân tích tài liệu có một tool `analyze_document` được mô tả là “phân tích tài liệu và trích xuất thông tin then chốt.” Bạn nên khắc phục vấn đề định tuyến sai như thế nào?", "ask": "Bạn nên khắc phục vấn đề định tuyến sai như thế nào?", "options": [{"id": "A", "text": "Thêm một bộ phân loại tiền định tuyến phát hiện liệu người dùng đang nhắc đến các file đã tải lên hay nội dung web trước khi coordinator quyết định việc giao việc."}, {"id": "B", "text": "Đổi tên tool web-search thành `extract_web_results` và cập nhật mô tả của nó thành “xử lý và trả về thông tin được truy xuất từ web search và URL.”"}, {"id": "C", "text": "Thêm các ví dụ few-shot vào prompt của coordinator cho thấy việc định tuyến đúng: “Người dùng tải lên một báo cáo quý → agent phân tích tài liệu” và “Người dùng hỏi về một trang web → agent web-search.”"}, {"id": "D", "text": "Mở rộng mô tả tool phân tích tài liệu với các ví dụ sử dụng như “Dùng cho các PDF, file Word, và bảng tính đã tải lên,” giữ nguyên tool web-search."}], "correct": "B", "explanation": "Đổi tên tool web-search thành `extract_web_results` và cập nhật mô tả của nó để tham chiếu rõ ràng đến web search và URL sẽ trực tiếp loại bỏ nguyên nhân gốc rễ bằng cách triệt tiêu sự chồng lấn ngữ nghĩa giữa hai tên tool và mô tả. Điều này khiến mục đích của mỗi tool trở nên rõ ràng, cho phép coordinator phân biệt một cách đáng tin cậy giữa phân tích tài liệu và web search.", "scenario": "Multi-agent Research System"}, {"set": "practice", "n": 8, "situation": "Một đồng nghiệp đề xuất rằng agent phân tích tài liệu nên gửi kết quả của nó trực tiếp đến agent tổng hợp, bỏ qua coordinator. Lợi thế chính của việc giữ coordinator làm trung tâm điều phối cho mọi giao tiếp giữa các subagent là gì?", "ask": "Lợi thế chính của việc giữ coordinator làm trung tâm điều phối là gì?", "options": [{"id": "A", "text": "Coordinator có thể quan sát mọi tương tác, xử lý lỗi một cách thống nhất, và quyết định thông tin nào mỗi subagent nên nhận."}, {"id": "B", "text": "Coordinator gộp nhiều yêu cầu đến các subagent thành batch, giảm tổng số lần gọi API và độ trễ tổng thể."}, {"id": "C", "text": "Định tuyến qua coordinator cho phép logic retry tự động mà các cuộc gọi trực tiếp giữa agent không thể hỗ trợ."}, {"id": "D", "text": "Các subagent dùng bộ nhớ tách biệt, và giao tiếp trực tiếp sẽ đòi hỏi serialization phức tạp mà chỉ coordinator mới thực hiện được."}], "correct": "A", "explanation": "Mẫu hình coordinator cung cấp khả năng quan sát tập trung vào mọi tương tác, xử lý lỗi thống nhất trên toàn hệ thống, và kiểm soát chi tiết về thông tin nào mỗi subagent nhận được—đây là những lợi thế chính của một cấu trúc giao tiếp hình sao.", "scenario": "Multi-agent Research System"}, {"set": "practice", "n": 9, "situation": "Subagent web-search bị timeout khi nghiên cứu một chủ đề phức tạp. Bạn cần thiết kế cách thông tin về thất bại này được trả về cho coordinator. Cách tiếp cận lan truyền lỗi nào cho phép khôi phục thông minh tốt nhất?", "ask": "Cách tiếp cận lan truyền lỗi nào cho phép khôi phục thông minh tốt nhất?", "options": [{"id": "A", "text": "Trả về bối cảnh lỗi có cấu trúc cho coordinator bao gồm loại thất bại, truy vấn đã thực thi, mọi kết quả một phần, và các cách tiếp cận thay thế tiềm năng."}, {"id": "B", "text": "Bắt timeout bên trong subagent và trả về một tập kết quả rỗng được đánh dấu là thành công."}, {"id": "C", "text": "Triển khai các lần retry tự động với exponential-backoff bên trong subagent, chỉ trả về một trạng thái chung chung “search unavailable” sau khi đã hết lượt retry."}, {"id": "D", "text": "Lan truyền ngoại lệ timeout trực tiếp đến bộ xử lý cấp cao nhất, chấm dứt toàn bộ quy trình nghiên cứu."}], "correct": "A", "explanation": "Trả về bối cảnh lỗi có cấu trúc—bao gồm loại thất bại, truy vấn đã thực thi, kết quả một phần, và các cách tiếp cận thay thế—cung cấp cho coordinator mọi thứ cần thiết để đưa ra các quyết định khôi phục thông minh (ví dụ: retry với một truy vấn đã sửa đổi hoặc tiếp tục với kết quả một phần). Nó bảo toàn tối đa bối cảnh cho việc ra quyết định có hiểu biết ở cấp điều phối.", "scenario": "Multi-agent Research System"}, {"set": "practice", "n": 10, "situation": "Trong thiết kế hệ thống của bạn, bạn đã cấp cho agent phân tích tài liệu quyền truy cập một tool đa năng `fetch_url` để nó có thể tải xuống tài liệu theo URL. Log sản xuất cho thấy agent này giờ thường xuyên tải xuống các trang kết quả của công cụ tìm kiếm để thực hiện web search tùy ý—hành vi lẽ ra phải được định tuyến qua agent web-search—gây ra các kết quả không nhất quán. Cách khắc phục nào là hiệu quả nhất?", "ask": "Cách khắc phục nào là hiệu quả nhất?", "options": [{"id": "A", "text": "Thay thế `fetch_url` bằng một tool `load_document` xác thực rằng các URL trỏ đến các định dạng tài liệu."}, {"id": "B", "text": "Loại bỏ `fetch_url` khỏi agent phân tích tài liệu và định tuyến mọi việc tải URL qua coordinator đến agent web-search."}, {"id": "C", "text": "Triển khai bộ lọc chặn các lệnh gọi `fetch_url` đến các tên miền công cụ tìm kiếm đã biết trong khi cho phép các URL khác."}, {"id": "D", "text": "Thêm hướng dẫn vào prompt của agent phân tích tài liệu rằng `fetch_url` chỉ nên được dùng để tải xuống các URL tài liệu, không phải để tìm kiếm."}], "correct": "A", "explanation": "Thay thế một tool đa năng bằng một tool chuyên cho tài liệu, vốn xác thực các URL theo các định dạng tài liệu, sẽ khắc phục nguyên nhân gốc rễ bằng cách ràng buộc khả năng ở cấp giao diện. Điều này tuân theo nguyên tắc least privilege, khiến hành vi tìm kiếm không mong muốn trở nên bất khả thi thay vì chỉ bị khuyến cáo.", "scenario": "Multi-agent Research System"}, {"set": "practice", "n": 11, "situation": "Trong khi nghiên cứu một chủ đề rộng, bạn quan sát thấy rằng agent web-search và agent phân tích tài liệu điều tra cùng các chủ đề con, dẫn đến sự trùng lặp đáng kể trong kết quả của chúng. Mức sử dụng token gần như tăng gấp đôi mà không có sự gia tăng tương ứng về độ rộng hay độ sâu của nghiên cứu. Cách hiệu quả nhất để giải quyết điều này là gì?", "ask": "Cách hiệu quả nhất để giải quyết điều này là gì?", "options": [{"id": "A", "text": "Cho phép cả hai agent hoàn thành song song, sau đó để coordinator khử trùng lặp các kết quả chồng lấn trước khi chuyển chúng cho agent tổng hợp."}, {"id": "B", "text": "Coordinator phân chia rõ ràng không gian nghiên cứu trước khi giao việc, gán cho mỗi agent các chủ đề con hoặc loại nguồn riêng biệt."}, {"id": "C", "text": "Triển khai một cơ chế trạng thái dùng chung trong đó các agent ghi lại lĩnh vực trọng tâm hiện tại của chúng để các agent khác có thể tránh trùng lặp một cách động trong khi thực thi."}, {"id": "D", "text": "Chuyển sang thực thi tuần tự, trong đó phân tích tài liệu chỉ chạy sau khi web search hoàn thành, dùng kết quả web-search làm bối cảnh để tránh trùng lặp."}], "correct": "B", "explanation": "Việc để coordinator phân chia rõ ràng không gian nghiên cứu trước khi giao việc là hiệu quả nhất vì nó giải quyết nguyên nhân gốc rễ—ranh giới nhiệm vụ không rõ ràng—trước khi bất kỳ công việc nào bắt đầu. Nó bảo toàn tính song song trong khi ngăn ngừa nỗ lực bị trùng lặp và token bị lãng phí.", "scenario": "Multi-agent Research System"}, {"set": "practice", "n": 12, "situation": "Trong quá trình nghiên cứu, subagent web-search truy vấn ba danh mục nguồn với các kết quả khác nhau: các cơ sở dữ liệu học thuật trả về 15 bài báo liên quan, các báo cáo ngành trả về “0 results,” và các cơ sở dữ liệu bằng sáng chế trả về “Connection timeout.” Khi thiết kế việc lan truyền lỗi đến coordinator, cách tiếp cận nào cho phép các quyết định khôi phục tốt nhất?", "ask": "Cách tiếp cận nào cho phép các quyết định khôi phục tốt nhất?", "options": [{"id": "A", "text": "Tổng hợp các kết quả thành một chỉ số phần-trăm-thành-công duy nhất (ví dụ: “67% độ bao phủ nguồn”) với các log chi tiết có sẵn theo yêu cầu."}, {"id": "B", "text": "Báo cáo cả “timeout” lẫn “0 results” như những thất bại đòi hỏi coordinator can thiệp."}, {"id": "C", "text": "Retry các thất bại tạm thời trong nội bộ và chỉ báo cáo các lỗi dai dẳng."}, {"id": "D", "text": "Phân biệt các thất bại truy cập (timeout) vốn đòi hỏi một quyết định retry với các kết quả rỗng hợp lệ (“0 results”) vốn đại diện cho các truy vấn thành công."}], "correct": "D", "explanation": "Một timeout (thất bại truy cập) và “0 results” (kết quả rỗng hợp lệ) là những kết cục khác nhau về mặt ngữ nghĩa đòi hỏi các phản ứng khác nhau. Việc phân biệt chúng cho phép coordinator retry cơ sở dữ liệu bằng sáng chế trong khi chấp nhận “0 results” của các báo cáo ngành như một phát hiện hợp lệ, mang tính thông tin.", "scenario": "Multi-agent Research System"}, {"set": "practice", "n": 13, "situation": "Giám sát sản xuất cho thấy chất lượng tổng hợp không nhất quán. Khi các kết quả tổng hợp là ~75K token, agent tổng hợp trích dẫn một cách đáng tin cậy thông tin từ 15K token đầu tiên (tiêu đề/đoạn trích web-search) và 10K token cuối cùng (kết luận phân tích tài liệu), nhưng thường bỏ sót các phát hiện then chốt ở 50K token ở giữa—ngay cả khi chúng trực tiếp trả lời câu hỏi nghiên cứu. Bạn nên tái cấu trúc đầu vào tổng hợp như thế nào?", "ask": "Bạn nên tái cấu trúc đầu vào tổng hợp như thế nào?", "options": [{"id": "A", "text": "Tóm tắt mọi kết quả của subagent xuống dưới 20K token trước khi tổng hợp để giữ nội dung trong phạm vi xử lý đáng tin cậy của mô hình."}, {"id": "B", "text": "Stream kết quả của subagent đến agent tổng hợp một cách tăng dần, xử lý kết quả web-search trước cho đến hết, sau đó thêm các kết quả phân tích tài liệu."}, {"id": "C", "text": "Đặt một bản tóm tắt các phát hiện then chốt ở đầu đầu vào tổng hợp và tổ chức các kết quả chi tiết với các tiêu đề mục rõ ràng để dễ điều hướng hơn."}, {"id": "D", "text": "Triển khai một cơ chế luân phiên đảo thứ tự xuất hiện đầu tiên của kết quả từ mỗi subagent qua các nhiệm vụ nghiên cứu để đảm bảo cả hai nguồn đều được vị trí đầu trang ngang nhau theo thời gian."}], "correct": "C", "explanation": "Đặt một bản tóm tắt các phát hiện then chốt ở đầu tận dụng hiệu ứng vị trí đầu (primacy) để thông tin quan trọng nằm ở vị trí được xử lý đáng tin cậy nhất. Việc thêm các tiêu đề mục rõ ràng xuyên suốt giúp mô hình điều hướng và chú ý đến nội dung ở giữa đầu vào, trực tiếp giảm thiểu hiện tượng “lạc giữa chừng” (lost in the middle).", "scenario": "Multi-agent Research System"}, {"set": "practice", "n": 14, "situation": "Trong quá trình kiểm thử, kết quả kết hợp của agent web-search (85K token bao gồm nội dung trang) và agent phân tích tài liệu (70K token bao gồm các chuỗi suy luận) tổng cộng là 155K token, nhưng agent tổng hợp hoạt động tốt nhất với các đầu vào dưới 50K token. Giải pháp nào là hiệu quả nhất?", "ask": "Giải pháp nào là hiệu quả nhất?", "options": [{"id": "A", "text": "Sửa đổi các agent thượng nguồn để trả về dữ liệu có cấu trúc (các sự kiện then chốt, trích dẫn, điểm số liên quan) thay vì nội dung và lập luận dài dòng."}, {"id": "B", "text": "Thêm một agent tóm tắt trung gian cô đọng các phát hiện trước khi chuyển chúng đến tổng hợp."}, {"id": "C", "text": "Để agent tổng hợp xử lý các phát hiện theo các batch tuần tự, duy trì trạng thái giữa các lần gọi."}, {"id": "D", "text": "Lưu trữ các phát hiện trong một cơ sở dữ liệu vector và cấp cho agent tổng hợp các tool tìm kiếm để truy vấn trong khi nó làm việc."}], "correct": "A", "explanation": "Sửa đổi các agent thượng nguồn để trả về dữ liệu có cấu trúc khắc phục nguyên nhân gốc rễ bằng cách giảm khối lượng token tại nguồn trong khi bảo toàn thông tin thiết yếu. Nó tránh việc chuyển đi nội dung trang cồng kềnh và các vết suy luận làm phình token mà không cải thiện bước tổng hợp.", "scenario": "Multi-agent Research System"}, {"set": "practice", "n": 15, "situation": "Trong quá trình kiểm thử, bạn quan sát thấy rằng agent tổng hợp thường cần xác minh các khẳng định cụ thể trong khi hợp nhất kết quả. Hiện tại, khi cần xác minh, agent tổng hợp trả quyền kiểm soát về cho coordinator, vốn gọi agent web-search rồi gọi lại agent tổng hợp với các kết quả. Điều này thêm 2–3 vòng lặp phụ cho mỗi nhiệm vụ và tăng độ trễ thêm 40%. Đánh giá của bạn cho thấy 85% các lần xác minh này là kiểm tra sự kiện đơn giản (ngày tháng, tên, số liệu thống kê) và 15% đòi hỏi nghiên cứu sâu hơn. Cách tiếp cận nào giảm chi phí phụ trội hiệu quả nhất trong khi vẫn bảo toàn độ tin cậy của hệ thống?", "ask": "Cách tiếp cận nào là hiệu quả nhất?", "options": [{"id": "A", "text": "Cấp cho agent tổng hợp quyền truy cập tất cả các tool web-search để nó có thể xử lý bất kỳ nhu cầu xác minh nào trực tiếp mà không cần các vòng lặp qua coordinator."}, {"id": "B", "text": "Để agent tổng hợp tích lũy mọi nhu cầu xác minh và trả chúng về dưới dạng một batch cho coordinator vào cuối, sau đó coordinator gửi tất cả chúng đến agent web-search cùng một lúc."}, {"id": "C", "text": "Để agent web-search chủ động cache thêm bối cảnh xung quanh mỗi nguồn trong quá trình nghiên cứu ban đầu nhằm dự liệu trước nhu cầu xác minh của tổng hợp."}, {"id": "D", "text": "Cấp cho agent tổng hợp một tool `verify_fact` có phạm vi giới hạn cho các kiểm tra đơn giản, trong khi định tuyến các lần xác minh phức tạp qua coordinator đến agent web-search."}], "correct": "D", "explanation": "Một tool xác minh sự kiện có phạm vi giới hạn cho phép agent tổng hợp xử lý 85% các kiểm tra đơn giản một cách trực tiếp, loại bỏ hầu hết các vòng lặp, trong khi vẫn bảo toàn đường giao việc qua coordinator cho 15% các lần xác minh phức tạp. Điều này áp dụng least privilege trong khi giảm đáng kể độ trễ.", "scenario": "Multi-agent Research System"}, {"set": "practice", "n": 16, "situation": "Pipeline CI/CD của bạn chạy Claude Code CLI (ở chế độ `--print`) sử dụng CLAUDE.md để cung cấp bối cảnh dự án cho việc review code, và các lập trình viên nhìn chung thấy các bản review có nội dung thực chất. Tuy nhiên, họ báo cáo rằng việc tích hợp các phát hiện vào quy trình làm việc là khó khăn—Claude xuất ra các đoạn văn dạng tường thuật phải được sao chép thủ công vào các comment của pull request. Đội nhóm muốn tự động đăng mỗi phát hiện như một comment inline riêng biệt của pull request tại đúng vị trí trong code, điều này đòi hỏi dữ liệu có cấu trúc với đường dẫn file, số dòng, mức độ nghiêm trọng, và bản sửa đề xuất. Cách tiếp cận nào là hiệu quả nhất?", "ask": "Cách tiếp cận nào là hiệu quả nhất?", "options": [{"id": "A", "text": "Thêm một mục “Output Format for Review” vào CLAUDE.md với các ví dụ về phát hiện có cấu trúc để Claude học định dạng mong đợi từ bối cảnh dự án."}, {"id": "B", "text": "Dùng các cờ CLI `--output-format json` và `--json-schema` để áp đặt các phát hiện có cấu trúc, sau đó phân tích cú pháp kết quả để đăng các comment inline qua GitHub API."}, {"id": "C", "text": "Bao gồm các hướng dẫn định dạng rõ ràng trong prompt review yêu cầu mỗi phát hiện tuân theo một mẫu có thể phân tích cú pháp như `[FILE:path] [LINE:n] [SEVERITY:level] ...`."}, {"id": "D", "text": "Giữ định dạng review tường thuật nhưng thêm một bước tóm tắt dùng Claude để tạo ra một bản tóm tắt JSON có cấu trúc về các phát hiện."}], "correct": "B", "explanation": "Sử dụng `--output-format json` với `--json-schema` áp đặt structured output ở cấp CLI, đảm bảo JSON đúng định dạng với các trường bắt buộc (đường dẫn file, số dòng, mức độ nghiêm trọng, bản sửa đề xuất) có thể được phân tích cú pháp một cách đáng tin cậy và đăng như các comment inline của pull request qua GitHub API. Nó tận dụng các khả năng CLI tích hợp sẵn được thiết kế chuyên cho structured output.", "scenario": "Claude Code for Continuous Integration"}, {"set": "practice", "n": 17, "situation": "Đội nhóm của bạn dùng Claude Code để tạo các gợi ý code, nhưng bạn nhận thấy một mẫu hình: các vấn đề không hiển nhiên—các tối ưu hóa hiệu năng làm hỏng các edge case, các đợt dọn dẹp bất ngờ thay đổi hành vi—chỉ được phát hiện khi một thành viên khác trong đội review pull request. Lập luận của Claude trong quá trình tạo cho thấy nó đã cân nhắc các trường hợp này nhưng kết luận rằng cách tiếp cận của nó là đúng. Cách tiếp cận nào trực tiếp giải quyết nguyên nhân gốc rễ của hạn chế tự-kiểm-tra này?", "ask": "Cách tiếp cận nào trực tiếp giải quyết nguyên nhân gốc rễ?", "options": [{"id": "A", "text": "Chạy một phiên bản Claude Code độc lập thứ hai để review các thay đổi mà không có quyền truy cập vào lập luận của bộ tạo."}, {"id": "B", "text": "Bật chế độ extended thinking cho giai đoạn tạo để cho phép cân nhắc kỹ lưỡng hơn trước khi đưa ra gợi ý."}, {"id": "C", "text": "Thêm các hướng dẫn tự-review rõ ràng vào prompt tạo yêu cầu Claude phê bình các gợi ý của chính nó trước khi hoàn thiện kết quả."}, {"id": "D", "text": "Bao gồm đầy đủ các file kiểm thử và tài liệu trong bối cảnh prompt để Claude hiểu rõ hơn hành vi mong đợi trong quá trình tạo."}], "correct": "A", "explanation": "Một phiên bản Claude Code độc lập thứ hai không có quyền truy cập vào lập luận của bộ tạo trực tiếp giải quyết nguyên nhân gốc rễ bằng cách tránh thiên kiến xác nhận (confirmation bias). Góc nhìn “con mắt tươi mới” này phản chiếu việc review đồng cấp của con người, nơi một người review khác phát hiện các vấn đề mà tác giả đã hợp lý hóa.", "scenario": "Claude Code for Continuous Integration"}, {"set": "practice", "n": 18, "situation": "Thành phần review code của bạn mang tính lặp: Claude phân tích file đã thay đổi, sau đó có thể yêu cầu các file liên quan (imports, lớp cơ sở, tests) qua các lệnh gọi tool để hiểu bối cảnh trước khi đưa ra phản hồi cuối cùng. Ứng dụng của bạn định nghĩa một tool cho phép Claude yêu cầu nội dung file; Claude gọi tool, nhận kết quả, và tiếp tục phân tích. Bạn đang đánh giá việc xử lý theo batch để giảm chi phí API. Hạn chế kỹ thuật chính khi cân nhắc xử lý batch cho quy trình làm việc này là gì?", "ask": "Hạn chế kỹ thuật chính là gì?", "options": [{"id": "A", "text": "Xử lý batch không bao gồm các correlation ID để ánh xạ kết quả đầu ra trở lại các yêu cầu đầu vào."}, {"id": "B", "text": "Mô hình bất đồng bộ không thể thực thi tool giữa chừng của một yêu cầu và trả kết quả về để Claude tiếp tục phân tích."}, {"id": "C", "text": "Batch API không hỗ trợ các định nghĩa tool trong các tham số yêu cầu."}, {"id": "D", "text": "Độ trễ xử lý batch lên đến 24 giờ là quá chậm cho phản hồi pull request, mặc dù quy trình làm việc nếu không thì vẫn vận hành được."}], "correct": "B", "explanation": "Một mô hình Batch API bất đồng bộ kiểu “fire-and-forget” không có cơ chế nào để chặn một lệnh gọi tool trong một yêu cầu, thực thi tool, và trả kết quả về để Claude tiếp tục phân tích. Điều này về cơ bản là không tương thích với các quy trình gọi tool mang tính lặp vốn đòi hỏi nhiều vòng yêu cầu/phản hồi tool trong một tương tác logic đơn lẻ.", "scenario": "Claude Code for Continuous Integration"}, {"set": "practice", "n": 19, "situation": "Hệ thống CI/CD của bạn chạy ba phân tích dựa trên Claude: (1) các kiểm tra style nhanh trên mỗi pull request chặn việc merge cho đến khi hoàn thành, (2) các đợt audit bảo mật toàn diện hàng tuần trên toàn bộ codebase, và (3) việc tạo test-case hàng đêm cho các module được thay đổi gần đây. Message Batches API cung cấp khoản tiết kiệm 50% nhưng việc xử lý có thể mất đến 24 giờ. Bạn muốn tối ưu hóa chi phí API trong khi duy trì một trải nghiệm lập trình viên chấp nhận được. Sự kết hợp nào ghép đúng mỗi nhiệm vụ với một cách tiếp cận API?", "ask": "Sự kết hợp nào là đúng?", "options": [{"id": "A", "text": "Dùng Message Batches API cho cả ba nhiệm vụ để tối đa hóa khoản tiết kiệm 50%, cấu hình pipeline để poll cho việc hoàn thành batch."}, {"id": "B", "text": "Dùng các lệnh gọi đồng bộ cho các kiểm tra style của pull request; dùng Message Batches API cho các đợt audit bảo mật hàng tuần và việc tạo test hàng đêm."}, {"id": "C", "text": "Dùng các lệnh gọi đồng bộ cho cả ba nhiệm vụ để có thời gian phản hồi nhất quán, dựa vào prompt caching để giảm chi phí trên các khối lượng công việc."}, {"id": "D", "text": "Dùng các lệnh gọi đồng bộ cho các kiểm tra style của pull request và việc tạo test hàng đêm; chỉ dùng Message Batches API cho các đợt audit bảo mật hàng tuần."}], "correct": "B", "explanation": "Các kiểm tra style của pull request chặn các lập trình viên và đòi hỏi phản hồi tức thì qua các lệnh gọi đồng bộ, trong khi các đợt audit bảo mật hàng tuần và việc tạo test hàng đêm là các nhiệm vụ theo lịch với thời hạn linh hoạt có thể chịu được cửa sổ batch lên đến 24 giờ—nắm bắt khoản tiết kiệm 50% cho cả hai.", "scenario": "Claude Code for Continuous Integration"}, {"set": "practice", "n": 20, "situation": "Các bản review tự động của bạn tìm ra các vấn đề thực sự, nhưng các lập trình viên báo cáo rằng phản hồi không thể hành động được. Các phát hiện bao gồm các cụm từ như “logic định tuyến phiếu phức tạp” hoặc “null pointer tiềm ẩn” mà không chỉ rõ chính xác cần thay đổi điều gì. Khi bạn thêm các hướng dẫn chi tiết như “luôn bao gồm các gợi ý sửa cụ thể,” mô hình vẫn tạo ra kết quả không nhất quán—đôi khi chi tiết, đôi khi mơ hồ. Kỹ thuật prompting nào tạo ra phản hồi có thể hành động được một cách nhất quán đáng tin cậy nhất?", "ask": "Kỹ thuật prompting nào là đáng tin cậy nhất?", "options": [{"id": "A", "text": "Tinh chỉnh thêm các hướng dẫn với các yêu cầu rõ ràng hơn cho mỗi phần của định dạng phản hồi (vị trí, vấn đề, mức độ nghiêm trọng, bản sửa đề xuất)."}, {"id": "B", "text": "Mở rộng context window để bao gồm nhiều codebase xung quanh hơn nhằm cho mô hình đủ thông tin để đề xuất các bản sửa cụ thể."}, {"id": "C", "text": "Triển khai một cách tiếp cận hai lượt trong đó một prompt xác định các vấn đề và một prompt thứ hai tạo các bản sửa, cho phép chuyên môn hóa."}, {"id": "D", "text": "Thêm 3–4 ví dụ few-shot cho thấy chính xác định dạng bắt buộc: vấn đề được xác định, vị trí trong code, gợi ý sửa cụ thể."}], "correct": "D", "explanation": "Các ví dụ few-shot là kỹ thuật hiệu quả nhất để đạt được định dạng kết quả nhất quán khi chỉ riêng các hướng dẫn tạo ra kết quả biến thiên. Cung cấp 3–4 ví dụ cho thấy chính xác cấu trúc mong muốn (vấn đề, vị trí, bản sửa cụ thể) cho mô hình một mẫu hình cụ thể để noi theo, điều này đáng tin cậy hơn các hướng dẫn trừu tượng.", "scenario": "Claude Code for Continuous Integration"}, {"set": "practice", "n": 21, "situation": "Pipeline CI/CD của bạn bao gồm hai chế độ review code dựa trên Claude: một hook pre-merge-commit chặn việc merge pull request cho đến khi hoàn thành, và một “phân tích sâu” chạy qua đêm, poll cho việc hoàn thành batch, và đăng các gợi ý chi tiết lên pull request. Bạn muốn giảm chi phí API bằng cách dùng Message Batches API, vốn cung cấp khoản tiết kiệm 50% nhưng đòi hỏi polling và có thể mất đến 24 giờ. Chế độ nào nên dùng xử lý batch?", "ask": "Chế độ nào nên dùng xử lý batch?", "options": [{"id": "A", "text": "Chỉ hook pre-merge-commit."}, {"id": "B", "text": "Chỉ phân tích sâu."}, {"id": "C", "text": "Cả hai chế độ."}, {"id": "D", "text": "Không chế độ nào."}], "correct": "B", "explanation": "Phân tích sâu là một ứng viên lý tưởng cho xử lý batch vì nó vốn đã chạy qua đêm, chịu được độ trễ, và dùng một mô hình polling trước khi công bố kết quả—khớp với kiến trúc bất đồng bộ, dựa trên polling của Message Batches API trong khi nắm bắt khoản tiết kiệm 50%.", "scenario": "Claude Code for Continuous Integration"}, {"set": "practice", "n": 22, "situation": "Bản review tự động của bạn phân tích các comment và docstring. Prompt hiện tại hướng dẫn Claude “kiểm tra rằng các comment chính xác và cập nhật.” Các phát hiện thường gắn cờ các mẫu hình chấp nhận được (các đánh dấu TODO, các mô tả đơn giản) trong khi bỏ sót các comment mô tả hành vi mà code không còn hiện thực nữa. Thay đổi nào giải quyết nguyên nhân gốc rễ của việc phân tích không nhất quán này?", "ask": "Thay đổi nào giải quyết nguyên nhân gốc rễ?", "options": [{"id": "A", "text": "Bao gồm dữ liệu `git blame` để Claude có thể xác định các comment có trước các thay đổi code gần đây."}, {"id": "B", "text": "Thêm các ví dụ few-shot về các comment gây hiểu lầm để giúp mô hình nhận ra các mẫu hình tương tự trong codebase."}, {"id": "C", "text": "Lọc các mẫu hình comment TODO, FIXME, và mô tả trước khi phân tích để giảm nhiễu."}, {"id": "D", "text": "Chỉ định các tiêu chí rõ ràng: chỉ gắn cờ các comment khi hành vi mà chúng tuyên bố mâu thuẫn với hành vi thực tế của code."}], "correct": "D", "explanation": "Các tiêu chí rõ ràng—chỉ gắn cờ các comment khi hành vi được tuyên bố mâu thuẫn với hành vi code thực tế—trực tiếp giải quyết nguyên nhân gốc rễ bằng cách thay thế một hướng dẫn mơ hồ bằng một định nghĩa chính xác về điều gì cấu thành một vấn đề. Điều này giảm các false positive trên các mẫu hình chấp nhận được và việc bỏ sót các comment thực sự gây hiểu lầm.", "scenario": "Claude Code for Continuous Integration"}, {"set": "practice", "n": 23, "situation": "Hệ thống review code tự động của bạn cho thấy các đánh giá mức độ nghiêm trọng không nhất quán—các vấn đề tương tự như rủi ro null pointer được đánh giá là “critical” trong một số pull request nhưng chỉ là “medium” trong các pull request khác. Các khảo sát lập trình viên cho thấy sự mất tin tưởng đang gia tăng—nhiều người bắt đầu gạt bỏ các phát hiện mà không đọc vì “một nửa là sai.” Các danh mục có tỷ lệ false-positive cao làm xói mòn niềm tin vào các danh mục chính xác. Cách tiếp cận nào khôi phục niềm tin của lập trình viên tốt nhất trong khi cải thiện hệ thống?", "ask": "Cách tiếp cận nào khôi phục niềm tin của lập trình viên tốt nhất?", "options": [{"id": "A", "text": "Tạm thời vô hiệu hóa các danh mục có tỷ lệ false-positive cao (style, naming, documentation) và chỉ giữ các danh mục có độ chính xác cao trong khi cải thiện các prompt."}, {"id": "B", "text": "Giữ tất cả các danh mục được bật nhưng hiển thị điểm tin cậy với mỗi phát hiện để các lập trình viên có thể quyết định điều gì cần điều tra."}, {"id": "C", "text": "Giữ tất cả các danh mục được bật và thêm các ví dụ few-shot để cải thiện độ chính xác cho mỗi danh mục trong vài tuần tới."}, {"id": "D", "text": "Áp dụng một mức giảm độ nghiêm ngặt đồng đều trên tất cả các danh mục để đưa tỷ lệ false-positive tổng thể xuống."}], "correct": "A", "explanation": "Tạm thời vô hiệu hóa các danh mục có tỷ lệ false-positive cao ngay lập tức chặn sự xói mòn niềm tin bằng cách loại bỏ các phát hiện gây nhiễu khiến các lập trình viên gạt bỏ mọi thứ, trong khi bảo toàn giá trị từ các danh mục có độ chính xác cao như bảo mật và tính đúng đắn. Nó cũng tạo không gian để cải thiện các prompt cho các danh mục có vấn đề trước khi bật lại chúng.", "scenario": "Claude Code for Continuous Integration"}, {"set": "practice", "n": 24, "situation": "Bản review tự động của bạn tạo các gợi ý test-case cho mỗi pull request. Khi review một pull request thêm tính năng theo dõi việc hoàn thành khóa học, Claude gợi ý 10 test case, nhưng phản hồi của lập trình viên cho thấy 6 trong số đó trùng lặp các kịch bản đã được bao phủ bởi bộ test hiện có. Thay đổi nào giảm các gợi ý trùng lặp hiệu quả nhất?", "ask": "Thay đổi nào là hiệu quả nhất?", "options": [{"id": "A", "text": "Bao gồm file test hiện có trong bối cảnh để Claude có thể xác định những kịch bản nào đã được bao phủ."}, {"id": "B", "text": "Giảm số lượng gợi ý được yêu cầu từ 10 xuống 5, giả định rằng Claude ưu tiên các trường hợp có giá trị nhất trước."}, {"id": "C", "text": "Thêm các hướng dẫn chỉ đạo Claude chỉ tập trung vào các edge case và điều kiện lỗi thay vì các đường thành công."}, {"id": "D", "text": "Triển khai hậu xử lý lọc các gợi ý có mô tả khớp với các tên test hiện có qua sự chồng lấn từ khóa."}], "correct": "A", "explanation": "Bao gồm file test hiện có khắc phục nguyên nhân gốc rễ của sự trùng lặp: Claude chỉ có thể tránh gợi ý các kịch bản đã được bao phủ nếu nó biết những test nào đã tồn tại. Điều này cho Claude thông tin cần thiết để đề xuất các test thực sự mới, có giá trị.", "scenario": "Claude Code for Continuous Integration"}, {"set": "practice", "n": 25, "situation": "Sau khi một bản review tự động ban đầu xác định 12 phát hiện, một lập trình viên push các commit mới để giải quyết các vấn đề. Việc chạy lại review tạo ra 8 phát hiện, nhưng các lập trình viên báo cáo rằng 5 trong số đó trùng lặp các comment trước đó trên code đã được sửa trong các commit mới. Cách hiệu quả nhất để loại bỏ phản hồi dư thừa này trong khi duy trì tính kỹ lưỡng là gì?", "ask": "Cách hiệu quả nhất để loại bỏ phản hồi dư thừa là gì?", "options": [{"id": "A", "text": "Chỉ chạy review khi pull request được tạo và ở trạng thái pre-merge cuối cùng, bỏ qua các commit trung gian."}, {"id": "B", "text": "Thêm một bộ lọc hậu xử lý loại bỏ các phát hiện khớp với các phát hiện trước đó theo đường dẫn file và mô tả vấn đề trước khi đăng các comment."}, {"id": "C", "text": "Giới hạn phạm vi review vào các file đã thay đổi trong lần push gần nhất, loại trừ các file từ các commit trước đó."}, {"id": "D", "text": "Bao gồm các phát hiện review trước đó trong bối cảnh và hướng dẫn Claude chỉ báo cáo các vấn đề mới hoặc vẫn chưa được giải quyết."}], "correct": "D", "explanation": "Bao gồm các phát hiện review trước đó trong bối cảnh cho phép Claude phân biệt các vấn đề mới với những vấn đề đã được giải quyết trong các commit gần đây. Điều này bảo toàn tính kỹ lưỡng của review trong khi dùng lập luận của Claude để tránh phản hồi dư thừa trên code đã được sửa.", "scenario": "Claude Code for Continuous Integration"}, {"set": "practice", "n": 26, "situation": "Script pipeline của bạn chạy `claude \"Analyze this pull request for security issues\"`, nhưng tác vụ bị treo vô thời hạn. Log cho thấy Claude Code đang chờ đầu vào tương tác. Cách tiếp cận đúng để chạy Claude Code trong một pipeline tự động là gì?", "ask": "Cách tiếp cận đúng là gì?", "options": [{"id": "A", "text": "Thêm cờ `--batch`: `claude --batch \"Analyze this pull request for security issues\"`."}, {"id": "B", "text": "Thêm cờ `-p`: `claude -p \"Analyze this pull request for security issues\"`."}, {"id": "C", "text": "Chuyển hướng stdin từ `/dev/null`: `claude \"Analyze this pull request for security issues\" < /dev/null`."}, {"id": "D", "text": "Đặt biến môi trường `CLAUDE_HEADLESS=true` trước khi chạy lệnh."}], "correct": "B", "explanation": "Cờ `-p` (hay `--print`) là cách được tài liệu hóa để chạy Claude Code không tương tác. Nó xử lý prompt, in kết quả ra stdout, và thoát mà không chờ đầu vào của người dùng—lý tưởng cho các pipeline CI/CD.", "scenario": "Claude Code for Continuous Integration"}, {"set": "practice", "n": 27, "situation": "Một pull request thay đổi 14 file trong một module theo dõi tồn kho. Một bản review một-lượt phân tích tất cả các file cùng nhau tạo ra các kết quả không nhất quán: phản hồi chi tiết trên một số file nhưng các comment hời hợt trên các file khác, bỏ sót các bug hiển nhiên, và phản hồi mâu thuẫn (một mẫu hình bị gắn cờ trong một file nhưng code y hệt được duyệt trong một file khác trong cùng pull request). Bạn nên tái cấu trúc bản review như thế nào?", "ask": "Bạn nên tái cấu trúc bản review như thế nào?", "options": [{"id": "A", "text": "Chạy ba lượt review toàn-pull-request độc lập và chỉ gắn cờ các vấn đề xuất hiện trong ít nhất hai trong ba lần chạy."}, {"id": "B", "text": "Chia thành các lượt tập trung: review từng file riêng lẻ cho các vấn đề cục bộ, sau đó chạy một lượt riêng định hướng tích hợp để xem xét các luồng dữ liệu liên file."}, {"id": "C", "text": "Yêu cầu các lập trình viên chia các pull request lớn thành các bản nộp nhỏ hơn gồm 3–4 file trước khi chạy review tự động."}, {"id": "D", "text": "Chuyển sang một mô hình lớn hơn với context window lớn hơn để nó có thể chú ý đầy đủ đến tất cả 14 file trong một lượt."}], "correct": "B", "explanation": "Các lượt tập trung theo từng file giải quyết nguyên nhân gốc rễ—sự pha loãng chú ý—bằng cách đảm bảo độ sâu nhất quán và phát hiện vấn đề cục bộ đáng tin cậy. Sau đó một lượt riêng định hướng tích hợp bao phủ các mối quan tâm liên file như các tương tác phụ thuộc và luồng dữ liệu.", "scenario": "Claude Code for Continuous Integration"}, {"set": "practice", "n": 28, "situation": "Bản review code tự động của bạn trung bình có 15 phát hiện cho mỗi pull request, và các lập trình viên báo cáo tỷ lệ false-positive 40%. Nút thắt cổ chai là thời gian điều tra: các lập trình viên phải nhấp vào từng phát hiện để đọc lý lẽ của Claude trước khi quyết định nên sửa hay gạt bỏ nó. CLAUDE.md của bạn đã chứa các quy tắc toàn diện về các mẫu hình chấp nhận được, và các bên liên quan đã từ chối bất kỳ cách tiếp cận nào lọc các phát hiện trước khi các lập trình viên nhìn thấy chúng. Thay đổi nào giải quyết thời gian điều tra tốt nhất?", "ask": "Thay đổi nào giải quyết thời gian điều tra tốt nhất?", "options": [{"id": "A", "text": "Yêu cầu Claude bao gồm lý lẽ và ước lượng độ tin cậy của nó trực tiếp trong mỗi phát hiện."}, {"id": "B", "text": "Thêm một bộ hậu xử lý phân tích các mẫu hình phát hiện và tự động ức chế những phát hiện khớp với các chữ ký false-positive trong lịch sử."}, {"id": "C", "text": "Phân loại các phát hiện thành “các vấn đề chặn” so với “các gợi ý,” với các yêu cầu review khác nhau theo cấp độ."}, {"id": "D", "text": "Cấu hình Claude chỉ hiển thị các phát hiện có độ tin cậy cao, lọc các cờ không chắc chắn trước khi các lập trình viên nhìn thấy chúng."}], "correct": "A", "explanation": "Bao gồm lý lẽ và độ tin cậy trực tiếp trong mỗi phát hiện giảm thời gian điều tra bằng cách cho phép các lập trình viên phân loại nhanh mà không cần mở từng phát hiện. Nó thỏa mãn ràng buộc “không lọc” vì tất cả các phát hiện vẫn hiển thị trong khi tăng tốc việc ra quyết định của lập trình viên.", "scenario": "Claude Code for Continuous Integration"}, {"set": "practice", "n": 29, "situation": "Phân tích bản review code tự động của bạn cho thấy sự khác biệt lớn về tỷ lệ false-positive theo danh mục phát hiện: các phát hiện về bảo mật/tính đúng đắn có 8% false positive, các phát hiện về hiệu năng 18%, các phát hiện về style/naming 52%, và các phát hiện về documentation 48%. Các khảo sát lập trình viên cho thấy sự mất tin tưởng đang gia tăng—nhiều người bắt đầu gạt bỏ các phát hiện mà không đọc vì “một nửa là sai.” Các danh mục có tỷ lệ false-positive cao làm xói mòn niềm tin vào các danh mục chính xác. Cách tiếp cận nào khôi phục niềm tin của lập trình viên tốt nhất trong khi cải thiện hệ thống?", "ask": "Cách tiếp cận nào khôi phục niềm tin của lập trình viên tốt nhất?", "options": [{"id": "A", "text": "Tạm thời vô hiệu hóa các danh mục có tỷ lệ false-positive cao (style, naming, documentation) và chỉ giữ các danh mục có độ chính xác cao trong khi cải thiện các prompt."}, {"id": "B", "text": "Giữ tất cả các danh mục được bật nhưng hiển thị điểm tin cậy với mỗi phát hiện để các lập trình viên có thể quyết định điều gì cần điều tra."}, {"id": "C", "text": "Giữ tất cả các danh mục được bật và thêm các ví dụ few-shot để cải thiện độ chính xác cho mỗi danh mục trong vài tuần tới."}, {"id": "D", "text": "Áp dụng một mức giảm độ nghiêm ngặt đồng đều trên tất cả các danh mục để đưa tỷ lệ false-positive tổng thể xuống."}], "correct": "A", "explanation": "Tạm thời vô hiệu hóa các danh mục có tỷ lệ false-positive cao ngay lập tức chặn sự xói mòn niềm tin bằng cách loại bỏ các phát hiện gây nhiễu khiến các lập trình viên gạt bỏ mọi thứ, trong khi bảo toàn giá trị từ các danh mục có độ chính xác cao như bảo mật và tính đúng đắn. Nó cũng tạo không gian để cải thiện các prompt cho các danh mục có vấn đề trước khi bật lại chúng.", "scenario": "Claude Code for Continuous Integration"}, {"set": "practice", "n": 30, "situation": "Đội nhóm của bạn muốn giảm chi phí API cho việc phân tích tự động. Hiện tại, các lệnh gọi Claude đồng bộ hỗ trợ hai quy trình làm việc: (1) một kiểm tra pre-merge mang tính chặn vốn phải hoàn thành trước khi các lập trình viên có thể merge, và (2) một báo cáo nợ kỹ thuật được tạo qua đêm để review vào sáng hôm sau. Quản lý của bạn đề xuất chuyển cả hai sang Message Batches API để tiết kiệm 50%. Bạn nên đánh giá đề xuất này như thế nào?", "ask": "Bạn nên đánh giá đề xuất này như thế nào?", "options": [{"id": "A", "text": "Chuyển cả hai sang xử lý batch với phương án dự phòng là các lệnh gọi đồng bộ nếu các batch mất quá lâu."}, {"id": "B", "text": "Chuyển cả hai quy trình làm việc sang xử lý batch với việc poll trạng thái để xác minh sự hoàn thành."}, {"id": "C", "text": "Chỉ dùng xử lý batch cho các báo cáo nợ kỹ thuật; giữ các lệnh gọi đồng bộ cho các kiểm tra pre-merge."}, {"id": "D", "text": "Giữ các lệnh gọi đồng bộ cho cả hai quy trình làm việc để tránh các vấn đề với việc sắp xếp thứ tự kết quả batch."}], "correct": "C", "explanation": "Việc xử lý của Message Batches API có thể mất đến 24 giờ mà không có SLA về độ trễ, điều này chấp nhận được cho các báo cáo nợ kỹ thuật qua đêm nhưng không chấp nhận được cho các kiểm tra pre-merge mang tính chặn nơi các lập trình viên phải chờ. Điều này ghép mỗi quy trình làm việc với đúng API dựa trên các yêu cầu về độ trễ.", "scenario": "Claude Code for Continuous Integration"}, {"set": "practice", "n": 31, "situation": "Bạn yêu cầu Claude Code triển khai một hàm chuyển đổi các phản hồi API thành định dạng chuẩn hóa nội bộ. Sau hai vòng lặp, cấu trúc đầu ra vẫn không khớp với kỳ vọng—một số trường được lồng nhau theo cách khác và các dấu thời gian được định dạng sai. Bạn đã mô tả yêu cầu bằng văn xuôi, nhưng mỗi lần Claude lại diễn giải khác nhau.", "ask": "Cách tiếp cận nào hiệu quả nhất cho vòng lặp tiếp theo?", "options": [{"id": "A", "text": "Viết một JSON schema mô tả cấu trúc đầu ra mong đợi và kiểm tra đầu ra của Claude dựa trên schema đó sau mỗi vòng lặp."}, {"id": "B", "text": "Cung cấp 2–3 ví dụ đầu vào-đầu ra cụ thể minh họa phép chuyển đổi mong đợi cho các phản hồi API tiêu biểu."}, {"id": "C", "text": "Viết lại yêu cầu với độ chính xác kỹ thuật cao hơn, chỉ định chính xác cách ánh xạ trường, quy tắc lồng nhau và chuỗi định dạng dấu thời gian."}, {"id": "D", "text": "Yêu cầu Claude giải thích cách hiểu hiện tại của nó về các yêu cầu để xác định nơi các diễn giải bị lệch nhau."}], "correct": "B", "explanation": "Các ví dụ đầu vào-đầu ra cụ thể loại bỏ sự mơ hồ vốn có trong các mô tả bằng văn xuôi bằng cách cho Claude thấy chính xác kết quả chuyển đổi mong đợi. Điều này giải quyết trực tiếp nguyên nhân gốc rễ—việc diễn giải sai yêu cầu dạng văn bản—bằng cách cung cấp các mẫu rõ ràng cho việc lồng trường và định dạng dấu thời gian.", "scenario": "Code Generation with Claude Code"}, {"set": "practice", "n": 32, "situation": "Bạn cần thêm Slack làm một kênh thông báo mới. Codebase hiện có các mẫu rõ ràng, đã được thiết lập cho các kênh email, SMS và push. Tuy nhiên, API của Slack cung cấp những cách tích hợp khác biệt căn bản—incoming webhooks (đơn giản, một chiều), bot tokens (hỗ trợ xác nhận gửi và điều khiển theo chương trình), hoặc Slack Apps (sự kiện hai chiều, yêu cầu phê duyệt workspace). Nhiệm vụ của bạn ghi “thêm hỗ trợ Slack” mà không chỉ định phương thức tích hợp hay yêu cầu các tính năng nâng cao như theo dõi việc gửi.", "ask": "Bạn nên tiếp cận nhiệm vụ này như thế nào?", "options": [{"id": "A", "text": "Bắt đầu ở chế độ thực thi trực tiếp dùng incoming webhooks để khớp với mẫu thông báo một chiều hiện có."}, {"id": "B", "text": "Chuyển sang planning mode để khám phá các phương án tích hợp và hệ quả về mặt kiến trúc, sau đó đưa ra khuyến nghị trước khi triển khai."}, {"id": "C", "text": "Bắt đầu ở chế độ thực thi trực tiếp bằng cách dựng khung lớp kênh Slack dùng các mẫu hiện có, hoãn quyết định về phương thức tích hợp."}, {"id": "D", "text": "Bắt đầu ở chế độ thực thi trực tiếp dùng cách tiếp cận bot-token để đảm bảo có thể xác nhận việc gửi."}], "correct": "B", "explanation": "Việc tích hợp Slack có nhiều cách tiếp cận hợp lệ với hệ quả kiến trúc khác biệt đáng kể, và các yêu cầu thì mơ hồ. Planning mode cho phép bạn đánh giá các trade-off giữa webhooks, bot tokens và Slack Apps rồi thống nhất về một cách tiếp cận trước khi triển khai.", "scenario": "Code Generation with Claude Code"}, {"set": "practice", "n": 33, "situation": "Tệp CLAUDE.md của bạn đã phình lên hơn 400 dòng, chứa các chuẩn lập trình, quy ước kiểm thử, một checklist review PR chi tiết, hướng dẫn triển khai và quy trình migration cơ sở dữ liệu. Bạn muốn Claude luôn tuân theo các chuẩn lập trình và quy ước kiểm thử, nhưng chỉ áp dụng hướng dẫn review PR, deploy và migration khi đang làm các tác vụ đó.", "ask": "Cách tái cấu trúc nào hiệu quả nhất?", "options": [{"id": "A", "text": "Chuyển tất cả hướng dẫn vào các tệp Skills riêng được tổ chức theo loại quy trình làm việc, chỉ để lại một mô tả dự án ngắn gọn trong CLAUDE.md."}, {"id": "B", "text": "Giữ mọi thứ trong CLAUDE.md nhưng dùng cú pháp `@import` để tổ chức thành các tệp được bảo trì riêng theo từng danh mục."}, {"id": "C", "text": "Tách CLAUDE.md thành các tệp dưới `.claude/rules/` với các mẫu glob ràng buộc theo đường dẫn để mỗi quy tắc chỉ được tải cho các loại tệp liên quan."}, {"id": "D", "text": "Giữ các chuẩn phổ quát trong CLAUDE.md và tạo các Skills cho hướng dẫn theo từng quy trình cụ thể (review PR, deploy, migration) kèm các từ khóa kích hoạt."}], "correct": "D", "explanation": "Nội dung CLAUDE.md được tải trong mọi session, đảm bảo các chuẩn lập trình và quy ước kiểm thử luôn được áp dụng, trong khi các Skills được gọi theo nhu cầu khi Claude phát hiện các từ khóa kích hoạt—lý tưởng cho hướng dẫn theo quy trình cụ thể như review PR, deploy và migration.", "scenario": "Code Generation with Claude Code"}, {"set": "practice", "n": 34, "situation": "Bạn được giao nhiệm vụ tái cấu trúc ứng dụng monolithic của nhóm thành microservices. Việc này tác động đến các thay đổi trên hàng chục tệp và đòi hỏi các quyết định về ranh giới dịch vụ và phụ thuộc giữa các module.", "ask": "Bạn nên chọn cách tiếp cận nào?", "options": [{"id": "A", "text": "Chuyển sang planning mode để khám phá codebase, hiểu các phụ thuộc và thiết kế cách tiếp cận triển khai trước khi thực hiện thay đổi."}, {"id": "B", "text": "Bắt đầu ở chế độ thực thi trực tiếp và chỉ chuyển sang planning sau khi gặp phải độ phức tạp bất ngờ trong quá trình triển khai."}, {"id": "C", "text": "Bắt đầu ở chế độ thực thi trực tiếp và thực hiện các thay đổi tăng dần, để việc triển khai tự bộc lộ các ranh giới dịch vụ tự nhiên."}, {"id": "D", "text": "Dùng thực thi trực tiếp với các hướng dẫn chi tiết định trước, chỉ định cấu trúc của từng dịch vụ."}], "correct": "A", "explanation": "Planning mode là chiến lược đúng đắn cho việc tái cấu trúc kiến trúc phức tạp như tách một monolith: nó cho phép khám phá an toàn và đưa ra quyết định có cơ sở về các ranh giới trước khi cam kết với những thay đổi có thể tốn kém trên nhiều tệp.", "scenario": "Code Generation with Claude Code"}, {"set": "practice", "n": 35, "situation": "Nhóm của bạn đã tạo một skill `/analyze-codebase` thực hiện phân tích mã sâu—quét phụ thuộc, đếm độ phủ kiểm thử và các chỉ số chất lượng mã. Sau khi chạy lệnh, các thành viên trong nhóm báo cáo rằng Claude trở nên kém phản hồi hơn trong session và mất ngữ cảnh của nhiệm vụ ban đầu.", "ask": "Bạn khắc phục điều này hiệu quả nhất bằng cách nào trong khi vẫn giữ đầy đủ khả năng phân tích?", "options": [{"id": "A", "text": "Thêm `context: fork` trong frontmatter của skill để chạy phân tích trong một context subagent tách biệt."}, {"id": "B", "text": "Thêm `model: haiku` trong frontmatter để dùng một mô hình nhanh hơn, rẻ hơn cho việc phân tích."}, {"id": "C", "text": "Tách skill thành ba skill nhỏ hơn, mỗi skill tạo ra ít đầu ra hơn."}, {"id": "D", "text": "Thêm hướng dẫn vào skill để nén tất cả kết quả thành một bản tóm tắt ngắn trước khi hiển thị."}], "correct": "A", "explanation": "`context: fork` chạy phân tích trong một context subagent tách biệt nên đầu ra lớn không làm ô nhiễm context window của session chính và Claude không bị mất dấu nhiệm vụ ban đầu. Nó bảo toàn đầy đủ khả năng phân tích trong khi giữ cho session chính luôn phản hồi tốt.", "scenario": "Code Generation with Claude Code"}, {"set": "practice", "n": 36, "situation": "Nhóm của bạn dùng một skill `/commit` trong `.claude/skills/commit/SKILL.md`. Một lập trình viên muốn tùy chỉnh nó cho quy trình làm việc cá nhân của họ (định dạng commit message khác, thêm các kiểm tra) mà không ảnh hưởng đến đồng đội.", "ask": "Bạn khuyến nghị điều gì?", "options": [{"id": "A", "text": "Tạo một phiên bản cá nhân dưới `~/.claude/skills/` với tên khác, ví dụ `/my-commit`."}, {"id": "B", "text": "Thêm logic điều kiện dựa trên username trong frontmatter của skill dự án."}, {"id": "C", "text": "Tạo một phiên bản cá nhân tại `~/.claude/skills/commit/SKILL.md` với cùng tên."}, {"id": "D", "text": "Đặt `override: true` trong frontmatter của skill cá nhân để ưu tiên nó hơn phiên bản dự án."}], "correct": "C", "explanation": "Việc phân giải skill dựa trên vị trí: cấp doanh nghiệp ghi đè cấp cá nhân, và cấp cá nhân ghi đè cấp dự án. Do đó một skill cá nhân tại `~/.claude/skills/commit/SKILL.md` sẽ che khuất `.claude/skills/commit/SKILL.md` của nhóm chỉ đối với riêng lập trình viên đó — không có gì trong repository thay đổi, nên các đồng đội vẫn chạy phiên bản dự án và `/commit` hoạt động y như cũ với mọi người khác. Phương án A chạy được về mặt cơ chế nhưng là khuyến nghị yếu hơn: `/commit` của dự án vẫn hoạt động song song với `/my-commit`, và hai skill có trường `description` gần như giống hệt nhau khiến việc Claude tự động chọn skill trở nên khó đoán, đồng thời phá vỡ thói quen sử dụng và tài liệu của nhóm vốn hướng dẫn chạy `/commit`. B sai vì frontmatter của skill không có logic điều kiện hay khả năng đọc username, và nó còn buộc phải sửa tệp dự án dùng chung — điều mà tình huống đã loại trừ. D sai vì không tồn tại trường `override` — thứ tự ưu tiên đến từ vị trí, không phải từ một khai báo.", "scenario": "Code Generation with Claude Code"}, {"set": "practice", "n": 37, "situation": "Nhóm của bạn đã dùng Claude Code trong nhiều tháng. Gần đây, ba lập trình viên báo cáo rằng Claude tuân theo hướng dẫn “luôn bao gồm xử lý lỗi toàn diện,” nhưng một lập trình viên thứ tư vừa gia nhập lại nói Claude không tuân theo. Cả bốn người làm việc trong cùng một repo và có mã được cập nhật mới nhất.", "ask": "Nguyên nhân và cách khắc phục khả dĩ nhất là gì?", "options": [{"id": "A", "text": "Hướng dẫn nằm trong các tệp `~/.claude/CLAUDE.md` ở cấp người dùng của những lập trình viên ban đầu, không nằm trong `.claude/CLAUDE.md` của dự án. Hãy chuyển hướng dẫn sang tệp cấp dự án để tất cả thành viên trong nhóm đều nhận được."}, {"id": "B", "text": "Tệp `~/.claude/CLAUDE.md` của lập trình viên mới chứa các hướng dẫn xung đột ghi đè lên cài đặt dự án; họ nên xóa phần xung đột đó."}, {"id": "C", "text": "Claude Code học các tùy chọn theo từng người dùng theo thời gian; lập trình viên mới phải lặp lại yêu cầu cho đến khi Claude “nhớ” nó."}, {"id": "D", "text": "Claude Code cache CLAUDE.md sau lần đọc đầu tiên; các lập trình viên ban đầu dùng phiên bản đã cache. Mọi người nên xóa cache của Claude Code."}], "correct": "A", "explanation": "Nếu hướng dẫn chỉ được thêm vào các tệp cấu hình cấp người dùng của những lập trình viên ban đầu mà không thêm vào `.claude/CLAUDE.md` cấp dự án, các thành viên mới sẽ không nhận được. Việc chuyển nó sang cấu hình cấp dự án đảm bảo tất cả thành viên hiện tại và tương lai đều tự động nhận được hướng dẫn.", "scenario": "Code Generation with Claude Code"}, {"set": "practice", "n": 38, "situation": "Bạn nhận thấy việc đưa 2–3 ví dụ triển khai endpoint đầy đủ làm ngữ cảnh giúp cải thiện đáng kể tính nhất quán khi sinh các endpoint API mới. Tuy nhiên, ngữ cảnh này chỉ hữu ích khi tạo endpoint mới—không hữu ích khi debug, review mã, hoặc làm các việc khác trong thư mục API.", "ask": "Cách tiếp cận cấu hình nào hiệu quả nhất?", "options": [{"id": "A", "text": "Thêm các ví dụ endpoint và tài liệu về mẫu vào CLAUDE.md của dự án để chúng luôn sẵn có."}, {"id": "B", "text": "Tham chiếu thủ công các ví dụ endpoint trong mỗi yêu cầu sinh mã bằng cách sao chép mã vào prompt."}, {"id": "C", "text": "Cấu hình các quy tắc theo đường dẫn trong `.claude/rules/api/` bao gồm các ví dụ endpoint và kích hoạt khi làm việc trong thư mục API."}, {"id": "D", "text": "Tạo một skill tham chiếu các ví dụ endpoint và chứa hướng dẫn tuân theo mẫu, được gọi theo nhu cầu qua một slash command."}], "correct": "D", "explanation": "Một skill được gọi theo nhu cầu chỉ tải ngữ cảnh ví dụ khi sinh các endpoint mới, chứ không phải trong các tác vụ không liên quan như debug hay review. Điều này giữ cho context chính sạch sẽ trong khi vẫn bảo toàn việc sinh mã chất lượng cao khi cần.", "scenario": "Code Generation with Claude Code"}, {"set": "practice", "n": 39, "situation": "Nhóm của bạn đã tạo một skill `/migration` sinh các tệp migration cơ sở dữ liệu. Nó nhận tê y logic khám phá như một tiến trình con bash."}, {"id": "B", "text": "Thêm `context: fork` trong frontmatter của skill."}, {"id": "C", "text": "Tách thành hai skill—`/explore-start` và `/explore-end`—để đánh dấu ranh giới khi nào ngữ cảnh khám phá nên được loại bỏ."}, {"id": "D", "text": "Tạo skill trong `~/.claude/skills/` thay vì `.claude/skills/`."}], "correct": "B", "explanation": "`context: fork` chạy skill trong một context subagent tách biệt nên các cuộc thảo luận khám phá không làm ô nhiễm lịch sử cuộc trò chuyện chính. Điều này ngăn các cách tiếp cận đã bị loại bỏ và ngữ cảnh brainstorm ảnh hưởng đến công việc triển khai tiếp theo.", "scenario": "Code Generation with Claude Code"}, {"set": "practice", "n": 44, "situation": "Nhóm của bạn muốn thêm một GitHub MCP server để tìm kiếm PR và kiểm tra trạng thái CI qua Claude Code. Mỗi người trong sáu lập trình viên đều có token truy cập GitHub cá nhân riêng. Bạn muốn có bộ công cụ nhất quán trên toàn nhóm mà không commit thông tin xác thực vào hệ thống quản lý phiên bản.", "ask": "Cách tiếp cận cấu hình nào hiệu quả nhất?", "options": [{"id": "A", "text": "Để mỗi lập trình viên tự thêm server ở phạm vi người dùng qua `claude mcp add --scope user`."}, {"id": "B", "text": "Tạo một wrapper MCP server đọc token từ một tệp `.env` và làm proxy cho các lệnh gọi GitHub API, rồi thêm wrapper vào `.mcp.json` của dự án."}, {"id": "C", "text": "Thêm server vào `.mcp.json` của dự án dùng thay thế biến môi trường (`${GITHUB_TOKEN}`) cho việc xác thực và ghi rõ biến môi trường bắt buộc trong README của dự án."}, {"id": "D", "text": "Cấu hình server ở phạm vi dự án với một token giữ chỗ, rồi bảo các lập trình viên ghi đè nó trong cấu hình cục bộ của họ."}], "correct": "C", "explanation": "Một `.mcp.json` cấp dự án với thay thế biến môi trường là cách thông dụng: nó cung cấp một nguồn sự thật duy nhất được quản lý phiên bản cho cấu hình MCP trong khi cho phép mỗi lập trình viên cung cấp thông tin xác thực qua các biến môi trường. Việc ghi tài liệu cho biến này giúp việc onboarding dễ dàng mà không commit bí mật.", "scenario": "Code Generation with Claude Code"}, {"set": "practice", "n": 45, "situation": "Bạn đang thêm các wrapper xử lý lỗi quanh các lệnh gọi API bên ngoài trên một codebase 120 tệp. Công việc có ba giai đoạn: (1) khám phá tất cả các điểm gọi và mẫu, (2) cùng nhau thiết kế cách tiếp cận xử lý lỗi, và (3) triển khai các wrapper một cách nhất quán. Trong Giai đoạn 1, Claude sinh ra đầu ra lớn liệt kê hàng trăm điểm gọi kèm ngữ cảnh, nhanh chóng lấp đầy context window trước khi việc khám phá hoàn tất.", "ask": "Cách tiếp cận nào hiệu quả nhất để hoàn thành nhiệm vụ trong khi vẫn duy trì tính nhất quán của việc triển khai?", "options": [{"id": "A", "text": "Dùng một Explore subagent cho Giai đoạn 1 để cô lập đầu ra khám phá dài dòng và trả về một bản tóm tắt, sau đó tiếp tục Giai đoạn 2–3 trong cuộc trò chuyện chính."}, {"id": "B", "text": "Thực hiện tất cả các giai đoạn trong cuộc trò chuyện chính, định kỳ dùng `/compact` để giảm mức sử dụng ngữ cảnh khi đi qua các tệp."}, {"id": "C", "text": "Chuyển sang chế độ headless với `--continue`, truyền các bản tóm tắt ngữ cảnh rõ ràng giữa các lệnh gọi batch để duy trì tính liên tục."}, {"id": "D", "text": "Định nghĩa mẫu xử lý lỗi trong CLAUDE.md, rồi xử lý các tệp theo từng batch qua nhiều session, dựa vào tệp bộ nhớ chung để đảm bảo tính nhất quán."}], "correct": "A", "explanation": "Một Explore subagent cô lập đầu ra khám phá dài dòng trong một context riêng và chỉ trả về một bản tóm tắt ngắn gọn cho cuộc trò chuyện chính. Điều này bảo toàn context window chính cho các giai đoạn thiết kế cộng tác và triển khai nhất quán, nơi ngữ cảnh được giữ lại có giá trị nhất.", "scenario": "Code Generation with Claude Code"}, {"set": "practice", "n": 46, "situation": "Trong quá trình thử nghiệm, bạn nhận thấy agent thường gọi `get_customer` khi người dùng hỏi về trạng thái đơn hàng, mặc dù `lookup_order` mới là lựa chọn phù hợp hơn. Bạn nên kiể
