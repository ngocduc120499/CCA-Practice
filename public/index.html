    tagEx: "Câu mẫu", tagPr: "Luyện tập", tagOk: "Đúng", tagMiss: "Sai", answer: "Đáp án", retry: "Làm lại", empty: "Không có câu hỏi nào khớp bộ lọc.",
    hEx: "Bài tập thực hành", exercise: "Bài tập", goal: "Mục tiêu", domains: "Lĩnh vực", hPrep: "Kế hoạch ôn tập", hDocs: "Tài liệu chính thức", thDocs: ["Tài liệu", "Liên kết"], hMore: "Thêm từ kho tài liệu",
    more: [`Hướng dẫn đầy đủ bằng 15 ngôn ngữ (có tiếng Việt), bản PDF và EPUB, bộ thẻ Anki và bài thi thử dạng HTML: ${REPO}`, `Đăng ký truy cập khóa học và bài thi chính thức: <a href="${PORTAL}" target="_blank" rel="noopener">anthropic.skilljar.com</a>`, "Các khóa học miễn phí liên quan trên Anthropic Academy: Building with the Claude API, Claude Code in Action, Introduction to MCP, MCP Advanced Topics, Introduction to Agent Skills."]
  }
};
const DOCS = [["Claude API — Messages","https://platform.claude.com/docs/en/api/messages"],["Claude API — Tool use","https://platform.claude.com/docs/en/build-with-claude/tool-use"],["Claude API — Message Batches","https://platform.claude.com/docs/en/build-with-claude/message-batches"],["Agent SDK — Overview","https://platform.claude.com/docs/en/agent-sdk/overview"],["Agent SDK — Hooks","https://platform.claude.com/docs/en/agent-sdk/hooks"],["Agent SDK — Subagents","https://platform.claude.com/docs/en/agent-sdk/subagents"],["Agent SDK — Sessions","https://platform.claude.com/docs/en/agent-sdk/sessions"],["Model Context Protocol","https://modelcontextprotocol.io/"],["MCP — Tools","https://modelcontextprotocol.io/docs/concepts/tools"],["MCP — Resources","https://modelcontextprotocol.io/docs/concepts/resources"],["Claude Code — Overview","https://code.claude.com/docs/en/overview"],["Claude Code — CLAUDE.md and memory","https://code.claude.com/docs/en/memory"],["Claude Code — Skills","https://code.claude.com/docs/en/skills"],["Claude Code — Hooks","https://code.claude.com/docs/en/hooks"],["Claude Code — Sub-agents","https://code.claude.com/docs/en/sub-agents"],["Claude Code — MCP","https://code.claude.com/docs/en/mcp"],["Claude Code — GitHub Actions","https://code.claude.com/docs/en/github-actions"],["Claude Code — Headless mode","https://code.claude.com/docs/en/headless"],["Prompt engineering guide","https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/overview"],["Anthropic Cookbook","https://github.com/anthropics/anthropic-cookbook"]];
/* Canonical scenario keys (English) in exam order; questions carry these keys in both languages. */
const SCEN_KEYS = ["Customer Support Agent","Code Generation with Claude Code","Multi-agent Research System","Developer Productivity Tools","Claude Code for Continuous Integration","Structured Data Extraction","Conversational AI Architecture Patterns","Agentic AI Tools"];
const EXTRA_SCEN = { "Multi-file Code Review": { en: "Multi-file Code Review", vi: "Review code nhiều tệp" } };

const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const md = s => esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\*([^*]+)\*/g,"<i>$1</i>").replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/\n+/g,"<br>");
const $ = id => document.getElementById(id);
const store = { get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };

let lang = store.get("cca-lang", null) || ((navigator.language||"").toLowerCase().startsWith("vi") ? "vi" : "en");
const T = () => UI[lang];
const C = () => DATA[lang];
const qsFor = l => [...DATA[l].examples, ...DATA[l].practice].map(q => ({...q, key: q.set + "-" + q.n}));
const scenLabel = k => { const i = SCEN_KEYS.indexOf(k); return i >= 0 ? C().scen[i][0] : (EXTRA_SCEN[k] ? EXTRA_SCEN[k][lang] : k); };
let QS = qsFor(lang);

/* Tabs */
const tabs = [...document.querySelectorAll("nav.tabs button")];
function showTab(name){
  tabs.forEach(b => b.setAttribute("aria-selected", b.dataset.tab===name ? "true" : "false"));
  ["overview","topics","bank","practice"].forEach(t => $("panel-"+t).hidden = t!==name);
  store.set("cca-tab", name);
}
tabs.forEach(b => b.addEventListener("click", () => showTab(b.dataset.tab)));

function renderStatic(){
  const t = T(), c = C();
  document.documentElement.lang = lang;
  $("lEn").setAttribute("aria-pressed", lang==="en"); $("lVi").setAttribute("aria-pressed", lang==="vi");
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t[el.dataset.t]);
  document.querySelectorAll("[data-h]").forEach(el => el.innerHTML = t[el.dataset.h]);
  $("fSearch").placeholder = t.searchPh;
  $("lede").innerHTML = md(c.lede);
  $("candlead").innerHTML = md(c.candlead);
  $("cand").innerHTML = c.cand.map(x => `<li>${md(x)}</li>`).join("");
  $("readTips").innerHTML = t.readTips.map(x => `<li>${x}</li>`).join("");
  $("weights").innerHTML = c.domains.map(d => `<div class="wrow"><span class="name">${d.n}. ${md(d.title)}</span><span class="pct">${d.weight}%</span><div class="bar"><span style="width:${d.weight/27*100}%"></span></div></div>`).join("");
  const cnt = {}; QS.forEach(q => cnt[q.scenario] = (cnt[q.scenario]||0)+1);
  $("scenarios").innerHTML = c.scen.map((s,i) => `<article><span class="n">${t.scenario} ${i+1}</span><h3>${md(s[0].replace(/\s*\*\(.*\)\*$/,""))}</h3><p class="muted" style="font-size:.92rem">${md(s[1])}</p><span class="qc">${cnt[SCEN_KEYS[i]] ? t.inBank(cnt[SCEN_KEYS[i]]) : t.noneInBank}</span></article>`).join("");
  $("domains").innerHTML = c.domains.map((d,i) => `<details class="dom" ${i===0?"open":""}><summary><span class="dnum">D${d.n}</span><h2 style="font-size:1.15rem">${md(d.title)}</h2><span class="dw">${d.weight}%</span></summary><div class="dbody">${d.tasks.map(k => `<div class="task"><h3><span class="tid">${k.id}</span>${md(k.title)}</h3><div class="ks"><div><span class="eyebrow">${t.know}</span><ul>${k.knowledge.map(x=>`<li>${md(x)}</li>`).join("")}</ul></div><div><span class="eyebrow">${t.skills}</span><ul>${k.skills.map(x=>`<li>${md(x)}</li>`).join("")}</ul></div></div></div>`).join("")}</div></details>`).join("");
  $("tech").innerHTML = `<tr><th>${t.thTech[0]}</th><th>${t.thTech[1]}</th></tr>` + c.tech.map(r => `<tr><td><b>${md(r[0])}</b></td><td>${md(r[1])}</td></tr>`).join("");
  $("oos").innerHTML = c.oos.map(o => `<li>${md(o)}</li>`).join("");
  $("exercises").innerHTML = c.exercises.map((e,i) => `<div class="ex"><span class="eyebrow">${t.exercise} ${i+1} · ${t.domains}: ${md(e.domains)}</span><h3>${md(e.title)}</h3><p class="muted"><b>${t.goal}:</b> ${md(e.goal)}</p><ol>${e.steps.map(s=>`<li>${md(s)}</li>`).join("")}</ol></div>`).join("");
  $("prep").innerHTML = c.prep.map(p => `<li>${md(p)}</li>`).join("");
  $("docs").innerHTML = `<tr><th>${t.thDocs[0]}</th><th>${t.thDocs[1]}</th></tr>` + DOCS.map(r => `<tr><td>${esc(r[0])}</td><td style="overflow-wrap:anywhere"><a href="${r[1]}" target="_blank" rel="noopener">${esc(r[1].replace(/^https:\/\//,""))}</a></td></tr>`).join("");
  $("more").innerHTML = t.more.map(x => `<li>${x}</li>`).join("");
  const sv = $("fScen").value || "all", setv = $("fSet").value || "all";
  const keys = SCEN_KEYS.filter(k => cnt[k]).concat(Object.keys(cnt).filter(k => !SCEN_KEYS.includes(k)));
  $("fScen").innerHTML = `<option value="all">${t.allScen}</option>` + keys.map(k => `<option value="${esc(k)}">${esc(scenLabel(k).replace(/\s*\*\(.*\)\*$/,""))} (${cnt[k]})</option>`).join("");
  $("fScen").value = sv;
  $("fSet").innerHTML = `<option value="all">${t.setAll}</option><option value="example">${t.setEx}</option><option value="practice">${t.setPr}</option>`;
  $("fSet").value = setv;
}

/* Question bank */
let answers = store.get("cca-answers", {});
let mode = store.get("cca-mode", "quiz");
const shuffleSeed = {};
function order(q){
  if (!$("fShuffle").checked) return q.options;
  if (!shuffleSeed[q.key]) { const ids=q.options.map(o=>o.id); for(let i=ids.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [ids[i],ids[j]]=[ids[j],ids[i]]; } shuffleSeed[q.key]=ids; }
  return shuffleSeed[q.key].map(id => q.options.find(o => o.id===id));
}
function filtered(){
  const sc=$("fScen").value, st=$("fSet").value, term=$("fSearch").value.trim().toLowerCase(), wrong=$("fWrong").checked;
  return QS.filter(q => (sc==="all"||q.scenario===sc) && (st==="all"||q.set===st) && (!wrong || (answers[q.key] && answers[q.key]!==q.correct)) &&
    (!term || (q.situation+" "+q.ask+" "+q.options.map(o=>o.text).join(" ")+" "+q.explanation).toLowerCase().includes(term)));
}
function renderScore(list){
  const t=T(); const done = list.filter(q => answers[q.key]); const right = done.filter(q => answers[q.key]===q.correct);
  $("score").innerHTML = `<span>${t.showing} <b>${list.length}</b></span><span>${t.answered} <b>${done.length}</b></span><span>${t.correct} <b>${right.length}</b></span><span>${t.accuracy} <b>${done.length?Math.round(right.length/done.length*100)+"%":"–"}</b></span>`;
}
function qHTML(q){
  const t=T(); const picked = answers[q.key]; const reveal = mode==="study" || !!picked; const ord = order(q);
  const opts = ord.map((o,i) => {
    let cls = "opt";
    if (reveal && o.id===q.correct) cls += " correct"; else if (picked && o.id===picked) cls += " wrong";
    return `<button type="button" class="${cls}" data-q="${q.key}" data-o="${o.id}" ${reveal?"disabled":""}><span class="l">${"ABCD"[i]}</span><span>${md(o.text)}</span></button>`;
  }).join("");
  const res = picked ? (picked===q.correct ? `<span class="tag res-good">${t.tagOk}</span>` : `<span class="tag res-bad">${t.tagMiss}</span>`) : "";
  return `<article class="q" data-key="${q.key}"><div class="qhead"><span class="tag ${q.set==="example"?"set-ex":""}">${q.set==="example"?t.tagEx:t.tagPr} ${q.n}</span><span class="tag">${esc(scenLabel(q.scenario))}</span>${res}</div>
    <p>${md(q.situation)}</p><p class="ask">${md(q.ask)}</p><div class="opts">${opts}</div>
    ${reveal?`<div class="expl"><span class="h">${t.answer} ${"ABCD"[ord.findIndex(o=>o.id===q.correct)]}</span><span>${md(q.explanation)}</span></div>`:""}
    ${picked && mode==="quiz"?`<div class="qfoot"><button type="button" class="btn" data-retry="${q.key}">${t.retry}</button></div>`:""}</article>`;
}
function render(){
  const list = filtered(); renderScore(list);
  $("qlist").innerHTML = list.length ? list.map(qHTML).join("") : `<p class="empty">${T().empty}</p>`;
  $("mQuiz").setAttribute("aria-pressed", mode==="quiz"); $("mStudy").setAttribute("aria-pressed", mode==="study");
}
function rerenderOne(key){
  const q = QS.find(x=>x.key===key); const card = document.querySelector(`.q[data-key="${key}"]`);
  const tmp = document.createElement("div"); tmp.innerHTML = qHTML(q); card.replaceWith(tmp.firstElementChild);
  renderScore(filtered());
}
$("qlist").addEventListener("click", e => {
  const o = e.target.closest(".opt"); const r = e.target.closest("[data-retry]");
  if (o && !o.disabled) { answers[o.dataset.q] = o.dataset.o; store.set("cca-answers", answers); rerenderOne(o.dataset.q); }
  if (r) { delete answers[r.dataset.retry]; delete shuffleSeed[r.dataset.retry]; store.set("cca-answers", answers); rerenderOne(r.dataset.retry); }
});
["fScen","fSet","fShuffle","fWrong"].forEach(id => $(id).addEventListener("change", () => { if(id==="fShuffle") for(const k in shuffleSeed) delete shuffleSeed[k]; render(); }));
$("fSearch").addEventListener("input", render);
$("mQuiz").addEventListener("click", () => { mode="quiz"; store.set("cca-mode",mode); render(); });
$("mStudy").addEventListener("click", () => { mode="study"; store.set("cca-mode",mode); render(); });
let resetArmed = false;
$("bReset").addEventListener("click", () => {
  if (!resetArmed) { resetArmed = true; $("bReset").textContent = T().resetConfirm; setTimeout(()=>{ resetArmed=false; $("bReset").textContent=T().reset; }, 3000); return; }
  answers = {}; store.set("cca-answers", answers); resetArmed=false; $("bReset").textContent=T().reset; render();
});
function setLang(l){ lang = l; store.set("cca-lang", l); QS = qsFor(l); renderStatic(); render(); }
$("lEn").addEventListener("click", () => setLang("en"));
$("lVi").addEventListener("click", () => setLang("vi"));

const hashTab = (location.hash||"").slice(1);
if (hashTab === "vi" || hashTab === "en") { lang = hashTab; }
setLang(lang);
showTab(["overview","topics","bank","practice"].includes(hashTab) ? hashTab : store.get("cca-tab","overview"));
</script>
