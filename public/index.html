m tra điều gì đầu tiên để xử lý vấn đề này?", "ask": "Bạn nên kiểm tra điều gì đầu tiên?", "options": [{"id": "A", "text": "Triển khai một classifier tiền xử lý để phát hiện các yêu cầu liên quan đến đơn hàng và định tuyến chúng trực tiếp đến `lookup_order`."}, {"id": "B", "text": "Giảm số lượng tool khả dụng cho agent để đơn giản hóa việc lựa chọn."}, {"id": "C", "text": "Thêm các ví dụ few-shot vào system prompt bao quát tất cả các mẫu yêu cầu đơn hàng có thể có nhằm cải thiện việc chọn tool."}, {"id": "D", "text": "Kiểm tra mô tả của các tool để đảm bảo chúng phân biệt rõ ràng mục đích của từng tool."}], "correct": "D", "explanation": "Mô tả tool là đầu vào chính mà mô hình dùng để quyết định gọi tool nào. Khi một agent liên tục chọn sai tool, bước chẩn đoán đầu tiên là xác minh rằng mô tả tool phân tách rõ ràng mục đích và ranh giới sử dụng của từng tool.", "scenario": "Customer Support Agent"}, {"set": "practice", "n": 47, "situation": "Agent của bạn xử lý các yêu cầu một-vấn-đề với độ chính xác 94% (ví dụ: \"Tôi cần hoàn tiền cho đơn hàng #1234\"). Nhưng khi khách hàng đưa nhiều vấn đề vào một tin nhắn (ví dụ: \"Tôi cần hoàn tiền cho đơn hàng #1234 và cũng muốn cập nhật địa chỉ giao hàng cho đơn hàng #5678\"), độ chính xác chọn tool giảm xuống còn 58%. Agent thường chỉ giải quyết một vấn đề hoặc trộn lẫn các tham số giữa các yêu cầu. Cách tiếp cận nào cải thiện độ tin cậy hiệu quả nhất cho các yêu cầu nhiều vấn đề?", "ask": "Cách tiếp cận nào hiệu quả nhất?", "options": [{"id": "A", "text": "Triển khai một lớp tiền xử lý dùng một lời gọi mô hình riêng để phân rã các tin nhắn nhiều vấn đề thành các yêu cầu riêng biệt, xử lý độc lập từng yêu cầu và hợp nhất kết quả."}, {"id": "B", "text": "Kết hợp các tool liên quan thành ít tool đa năng hơn."}, {"id": "C", "text": "Thêm các ví dụ few-shot vào prompt minh họa cách suy luận đúng và trình tự gọi tool cho các yêu cầu nhiều vấn đề."}, {"id": "D", "text": "Triển khai validation phản hồi để phát hiện các câu trả lời chưa đầy đủ và tự động nhắc lại agent để giải quyết những vấn đề bị bỏ sót."}], "correct": "C", "explanation": "Các ví dụ few-shot minh họa cách suy luận đúng và trình tự gọi tool cho các yêu cầu nhiều vấn đề là hiệu quả nhất bởi vì agent đã hoạt động tốt với các vấn đề đơn lẻ—thứ nó cần là hướng dẫn về mẫu để phân rã và định tuyến nhiều vấn đề cũng như giữ các tham số tách biệt.", "scenario": "Customer Support Agent"}, {"set": "practice", "n": 48, "situation": "Production logs cho thấy với các yêu cầu đơn giản như \"hoàn tiền cho đơn hàng #1234,\" agent của bạn giải quyết vấn đề trong 3–4 lần gọi tool với tỷ lệ thành công 91%. Nhưng với các yêu cầu phức tạp như \"Tôi bị tính tiền hai lần, chiết khấu của tôi không được áp dụng, và tôi muốn hủy,\" agent trung bình cần hơn 12 lần gọi tool với tỷ lệ thành công chỉ 54%—thường điều tra các vấn đề một cách tuần tự và lấy dữ liệu khách hàng dư thừa cho mỗi vấn đề. Thay đổi nào cải thiện hiệu quả nhất việc xử lý các yêu cầu phức tạp?", "ask": "Thay đổi nào hiệu quả nhất?", "options": [{"id": "A", "text": "Thêm các điểm kiểm tra xác minh rõ ràng giữa các giai đoạn, yêu cầu agent ghi lại tiến trình sau khi giải quyết mỗi vấn đề trước khi chuyển sang vấn đề tiếp theo."}, {"id": "B", "text": "Giảm số lượng tool bằng cách kết hợp `get_customer`, `lookup_order`, và các tool liên quan đến hóa đơn thành một tool `investigate_issue` duy nhất."}, {"id": "C", "text": "Phân rã yêu cầu thành các vấn đề riêng biệt, sau đó điều tra song song từng vấn đề bằng cách dùng chung context khách hàng trước khi tổng hợp một giải pháp cuối cùng."}, {"id": "D", "text": "Thêm các ví dụ few-shot vào system prompt minh họa các trình tự gọi tool lý tưởng cho nhiều kịch bản hóa đơn đa diện."}], "correct": "C", "explanation": "Phân rã thành các vấn đề riêng biệt và điều tra song song với context khách hàng dùng chung khắc phục cả hai vấn đề then chốt: nó loại bỏ việc truy xuất dữ liệu dư thừa bằng cách tái sử dụng context dùng chung giữa các vấn đề và giảm tổng số vòng lặp gọi tool bằng cách điều tra song song trước khi tổng hợp một giải pháp duy nhất.", "scenario": "Customer Support Agent"}, {"set": "practice", "n": 49, "situation": "Agent của bạn đạt tỷ lệ giải quyết ngay trong lần liên hệ đầu tiên là 55%, thấp hơn nhiều so với mục tiêu 80%. Logs cho thấy nó escalation các trường hợp đơn giản (thay thế tiêu chuẩn cho hàng bị hư hỏng có bằng chứng ảnh) trong khi lại cố gắng tự xử lý các tình huống phức tạp đòi hỏi ngoại lệ chính sách. Cách hiệu quả nhất để cải thiện việc hiệu chỉnh escalation là gì?", "ask": "Cách hiệu quả nhất để cải thiện việc hiệu chỉnh escalation là gì?", "options": [{"id": "A", "text": "Yêu cầu agent tự đánh giá độ tin cậy trên thang điểm 1–10 trước mỗi phản hồi và tự động định tuyến đến con người khi độ tin cậy giảm dưới một ngưỡng."}, {"id": "B", "text": "Triển khai một mô hình classifier riêng được huấn luyện trên các ticket lịch sử để dự đoán những yêu cầu nào cần escalation trước khi agent chính bắt đầu xử lý."}, {"id": "C", "text": "Thêm các tiêu chí escalation rõ ràng vào system prompt cùng với các ví dụ few-shot cho thấy khi nào nên escalation so với khi nào tự giải quyết."}, {"id": "D", "text": "Triển khai phân tích cảm xúc để xác định mức độ bức xúc của khách hàng và tự động escalation khi vượt quá một ngưỡng cảm xúc tiêu cực."}], "correct": "C", "explanation": "Các tiêu chí escalation rõ ràng kèm ví dụ few-shot trực tiếp giải quyết nguyên nhân gốc rễ—ranh giới quyết định không rõ ràng giữa các trường hợp đơn giản và phức tạp. Đây là can thiệp đầu tiên cân xứng và hiệu quả nhất, dạy cho agent khi nào nên escalation và khi nào tự giải quyết mà không cần thêm hạ tầng.", "scenario": "Customer Support Agent"}, {"set": "practice", "n": 50, "situation": "Sau khi gọi `get_customer` và `lookup_order`, agent đã có tất cả dữ liệu hệ thống khả dụng nhưng vẫn đối mặt với sự không chắc chắn. Tình huống nào là yếu tố kích hoạt việc gọi `escalate_to_human` hợp lý nhất?", "ask": "Tình huống nào hợp lý nhất để escalation?", "options": [{"id": "A", "text": "Một khách hàng muốn hủy một đơn hàng đã giao đi hôm qua và sẽ đến vào ngày mai. Agent nên escalation vì khách hàng có thể đổi ý sau khi nhận được gói hàng."}, {"id": "B", "text": "Một khách hàng khẳng định họ không nhận được đơn hàng, nhưng thông tin theo dõi cho thấy nó đã được giao và có chữ ký nhận tại địa chỉ của họ ba ngày trước. Agent nên escalation vì việc đưa ra bằng chứng mâu thuẫn có thể làm tổn hại mối quan hệ với khách hàng."}, {"id": "C", "text": "Một khách hàng yêu cầu so khớp giá với đối thủ cạnh tranh. Các chính sách của bạn cho phép điều chỉnh giá khi có giảm giá trên chính website của bạn trong vòng 14 ngày, nhưng không đề cập gì đến giá của đối thủ. Agent nên escalation để diễn giải chính sách."}, {"id": "D", "text": "Một tin nhắn của khách hàng chứa cả một câu hỏi về hóa đơn lẫn một yêu cầu trả lại sản phẩm. Agent nên escalation để một con người có thể phối hợp cả hai vấn đề trong một lần tương tác."}], "correct": "C", "explanation": "Đây là một lỗ hổng chính sách thực sự: các quy tắc của công ty bao quát việc giảm giá trên chính website của bạn nhưng không đề cập đến việc so khớp giá với đối thủ. Agent không được tự đặt ra chính sách và nên escalation để con người phán xét về cách diễn giải hoặc mở rộng các quy tắc hiện có.", "scenario": "Customer Support Agent"}, {"set": "practice", "n": 51, "situation": "Production logs cho thấy trong 12% các trường hợp, agent của bạn bỏ qua `get_customer` và gọi trực tiếp `lookup_order` chỉ dùng tên do khách hàng cung cấp, đôi khi dẫn đến việc nhận diện sai tài khoản và hoàn tiền sai. Thay đổi nào khắc phục vấn đề độ tin cậy này hiệu quả nhất?", "ask": "Thay đổi nào hiệu quả nhất?", "options": [{"id": "A", "text": "Thêm các ví dụ few-shot cho thấy agent luôn gọi `get_customer` trước, ngay cả khi khách hàng tự nguyện cung cấp chi tiết đơn hàng."}, {"id": "B", "text": "Triển khai một classifier định tuyến phân tích mỗi yêu cầu và chỉ kích hoạt một tập con các tool phù hợp với loại yêu cầu đó."}, {"id": "C", "text": "Thêm một điều kiện tiên quyết theo lập trình chặn `lookup_order` và `process_refund` cho đến khi `get_customer` trả về một định danh khách hàng đã được xác minh."}, {"id": "D", "text": "Củng cố system prompt khẳng định rằng việc xác minh khách hàng qua `get_customer` là bắt buộc trước bất kỳ thao tác đơn hàng nào."}], "correct": "C", "explanation": "Một điều kiện tiên quyết theo lập trình cung cấp sự bảo đảm deterministic rằng trình tự yêu cầu được tuân thủ. Đây là cách tiếp cận hiệu quả nhất vì nó loại bỏ khả năng bỏ qua bước xác minh, bất kể hành vi của LLM ra sao.", "scenario": "Customer Support Agent"}, {"set": "practice", "n": 52, "situation": "Các chỉ số production cho thấy khi giải quyết các tranh chấp hóa đơn phức tạp hoặc các trường hợp trả lại nhiều đơn hàng, điểm hài lòng của khách hàng thấp hơn 15% so với các trường hợp đơn giản—ngay cả khi giải pháp về mặt kỹ thuật là đúng. Phân tích nguyên nhân gốc rễ cho thấy agent đưa ra giải pháp chính xác nhưng giải thích lý do không nhất quán: đôi khi bỏ sót các chi tiết chính sách liên quan, đôi khi thiếu thông tin về mốc thời gian hoặc các bước tiếp theo. Các khoảng trống context cụ thể thay đổi theo từng trường hợp. Bạn muốn cải thiện chất lượng giải pháp mà không thêm sự giám sát của con người. Cách tiếp cận nào hiệu quả nhất?", "ask": "Cách tiếp cận nào hiệu quả nhất?", "options": [{"id": "A", "text": "Thêm một giai đoạn tự phê bình, trong đó agent đánh giá bản nháp phản hồi về tính đầy đủ—đảm bảo nó giải quyết vấn đề của khách hàng, bao gồm context liên quan, và dự đoán trước các câu hỏi tiếp theo."}, {"id": "B", "text": "Thêm một giai đoạn xác nhận, trong đó agent hỏi \"Điều này có giải quyết hoàn toàn vấn đề của bạn không?\" trước khi đóng, cho phép khách hàng yêu cầu thêm thông tin nếu cần."}, {"id": "C", "text": "Nâng cấp mô hình từ Haiku lên Sonnet cho các trường hợp phức tạp, định tuyến dựa trên một chỉ số độ phức tạp được định nghĩa."}, {"id": "D", "text": "Triển khai các ví dụ few-shot trong system prompt cho thấy các giải thích đầy đủ cho năm loại trường hợp phức tạp phổ biến, minh họa cách đưa vào context chính sách, mốc thời gian, và các bước tiếp theo."}], "correct": "A", "explanation": "Một giai đoạn tự phê bình (mẫu evaluator-optimizer) trực tiếp giải quyết sự không nhất quán về tính đầy đủ của phần giải thích bằng cách buộc agent đánh giá bản nháp của chính nó dựa trên các tiêu chí cụ thể—như context chính sách, mốc thời gian, và các bước tiếp theo—trước khi trình bày nó. Điều này phát hiện các khoảng trống đặc thù theo từng trường hợp mà không cần sự giám sát của con người.", "scenario": "Customer Support Agent"}, {"set": "practice", "n": 53, "situation": "Các chỉ số production cho thấy agent của bạn trung bình hơn 4 vòng lặp API cho mỗi lần giải quyết. Phân tích cho thấy Claude thường yêu cầu `get_customer` và `lookup_order` trong các lượt tuần tự riêng biệt ngay cả khi cả hai đều cần ngay từ đầu. Cách hiệu quả nhất để giảm số vòng lặp là gì?", "ask": "Cách hiệu quả nhất để giảm số vòng lặp là gì?", "options": [{"id": "A", "text": "Triển khai thực thi suy đoán tự động gọi các tool có khả năng cần dùng song song với bất kỳ tool nào được yêu cầu và trả về tất cả kết quả bất kể đã yêu cầu gì."}, {"id": "B", "text": "Tăng `max_tokens` để cho Claude nhiều không gian hơn để lập kế hoạch và kết hợp các yêu cầu tool một cách tự nhiên."}, {"id": "C", "text": "Tạo các tool tổng hợp như `get_customer_with_orders` gói các tổ hợp tra cứu phổ biến vào các lời gọi đơn lẻ."}, {"id": "D", "text": "Hướng dẫn Claude trong prompt gói các yêu cầu tool vào một lượt và trả về tất cả kết quả cùng nhau trước lời gọi API tiếp theo."}], "correct": "D", "explanation": "Việc nhắc Claude gói các yêu cầu tool liên quan vào một lượt duy nhất tận dụng khả năng vốn có của nó để yêu cầu nhiều tool cùng lúc. Nó trực tiếp khắc phục mẫu gọi tuần tự với thay đổi kiến trúc tối thiểu.", "scenario": "Customer Support Agent"}, {"set": "practice", "n": 54, "situation": "Production logs cho thấy một mẫu: khách hàng tham chiếu đến các con số cụ thể (ví dụ: \"khoản chiết khấu 15% mà tôi đã đề cập\"), nhưng agent phản hồi với các giá trị không chính xác. Điều tra cho thấy các chi tiết này đã được đề cập từ hơn 20 lượt trước và bị cô đọng thành các bản tóm tắt mơ hồ như \"đã thảo luận về giá khuyến mãi.\" Cách khắc phục nào hiệu quả nhất?", "ask": "Cách khắc phục nào hiệu quả nhất?", "options": [{"id": "A", "text": "Tăng ngưỡng tóm tắt từ 70% lên 85% để các cuộc hội thoại có nhiều không gian hơn trước khi việc tóm tắt được kích hoạt."}, {"id": "B", "text": "Lưu trữ toàn bộ lịch sử hội thoại trong bộ lưu trữ bên ngoài và triển khai truy xuất khi agent phát hiện các tham chiếu như \"như tôi đã đề cập.\""}, {"id": "C", "text": "Trích xuất các dữ kiện giao dịch (số tiền, ngày tháng, mã đơn hàng) vào một khối \"case facts\" bền vững được đưa vào mọi prompt nằm ngoài lịch sử đã tóm tắt."}, {"id": "D", "text": "Sửa lại prompt tóm tắt để giữ nguyên văn một cách rõ ràng tất cả các con số, tỷ lệ phần trăm, ngày tháng, và các kỳ vọng do khách hàng nêu ra."}], "correct": "C", "explanation": "Việc tóm tắt vốn dĩ làm mất đi các chi tiết chính xác. Trích xuất các dữ kiện giao dịch vào một khối \"case facts\" có cấu trúc nằm ngoài lịch sử đã tóm tắt giữ lại thông tin quan trọng để nó luôn sẵn có một cách đáng tin cậy trong mọi prompt bất kể đã tóm tắt bao nhiêu lượt.", "scenario": "Customer Support Agent"}, {"set": "practice", "n": 55, "situation": "Tool `get_customer` của bạn trả về tất cả các kết quả khớp khi tìm kiếm theo tên. Hiện tại, khi có nhiều kết quả, Claude chọn khách hàng có đơn hàng gần đây nhất, nhưng dữ liệu production cho thấy điều này chọn sai tài khoản 15% số lần đối với các kết quả khớp mơ hồ. Bạn nên xử lý điều này như thế nào?", "ask": "Bạn nên xử lý điều này như thế nào?", "options": [{"id": "A", "text": "Triển khai một hệ thống chấm điểm độ tin cậy hành động tự động khi độ tin cậy trên 85% và yêu cầu làm rõ khi dưới ngưỡng."}, {"id": "B", "text": "Hướng dẫn Claude yêu cầu một định danh bổ sung (email, số điện thoại, hoặc mã đơn hàng) khi `get_customer` trả về nhiều kết quả khớp, trước khi thực hiện bất kỳ hành động nào dành riêng cho khách hàng."}, {"id": "C", "text": "Sửa đổi `get_customer` để chỉ trả về một kết quả khớp có khả năng cao nhất dựa trên một thuật toán xếp hạng, loại bỏ sự mơ hồ."}, {"id": "D", "text": "Thêm các ví dụ few-shot vào prompt minh họa cách suy luận đúng và trình tự gọi tool cho các kết quả khớp mơ hồ."}], "correct": "B", "explanation": "Yêu cầu người dùng cung cấp một định danh bổ sung là cách đáng tin cậy nhất để giải quyết sự mơ hồ bởi vì người dùng có kiến thức xác định về danh tính của chính họ. Một lượt hội thoại thêm là cái giá nhỏ để đổi lấy việc loại bỏ tỷ lệ lỗi 15% do chọn nhầm tài khoản.", "scenario": "Customer Support Agent"}, {"set": "practice", "n": 56, "situation": "Production logs cho thấy một mẫu nhất quán: khi khách hàng đưa từ \"account\" vào tin nhắn của họ (ví dụ: \"Tôi muốn kiểm tra account của mình cho một đơn hàng tôi đặt hôm qua\"), agent gọi `get_customer` trước 78% số lần. Khi khách hàng diễn đạt các yêu cầu tương tự mà không có \"account\" (ví dụ: \"Tôi muốn kiểm tra một đơn hàng tôi đặt hôm qua\"), nó gọi `lookup_order` trước 93% số lần. Mô tả tool đã rõ ràng và không mơ hồ. Nguyên nhân gốc rễ có khả năng nhất của sự khác biệt này là gì?", "ask": "Nguyên nhân gốc rễ có khả năng nhất là gì?", "options": [{"id": "A", "text": "System prompt chứa các hướng dẫn nhạy cảm với từ khóa điều hướng hành vi dựa trên các từ như \"account,\" tạo ra các mẫu chọn tool ngoài ý muốn."}, {"id": "B", "text": "Quá trình huấn luyện nền tảng của mô hình tạo ra các liên kết giữa thuật ngữ \"account\" và các thao tác liên quan đến khách hàng, lấn át mô tả tool."}, {"id": "C", "text": "Mô hình cần thêm dữ liệu huấn luyện về các tin nhắn đa khái niệm và nên được fine-tune trên các ví dụ chứa cả thuật ngữ account lẫn order."}, {"id": "D", "text": "Mô tả tool cần thêm các ví dụ phủ định chỉ rõ khi nào KHÔNG dùng từng tool để ngăn sự nhầm lẫn do từ khóa gây ra này."}], "correct": "A", "explanation": "Mẫu hệ thống do từ khóa dẫn dắt (78% so với 93%) cho thấy mạnh mẽ rằng có logic định tuyến tường minh trong system prompt phản ứng với từ \"account\" và điều hướng agent về các tool liên quan đến khách hàng. Vì mô tả tool đã rõ ràng, sự khác biệt này chỉ ra rằng các hướng dẫn ở cấp prompt đang tạo ra sự điều hướng hành vi ngoài ý muốn.", "scenario": "Customer Support Agent"}, {"set": "practice", "n": 57, "situation": "Production logs cho thấy agent thường gọi `get_customer` khi người dùng hỏi về đơn hàng (ví dụ: \"kiểm tra đơn hàng #12345 của tôi\") thay vì gọi `lookup_order`. Cả hai tool đều có mô tả tối thiểu (\"Gets customer information\" / \"Gets order details\") và chấp nhận các định dạng định danh trông tương tự nhau. Bước đầu tiên hiệu quả nhất để cải thiện độ tin cậy của việc chọn tool là gì?", "ask": "Bước đầu tiên hiệu quả nhất là gì?", "options": [{"id": "A", "text": "Triển khai một lớp định tuyến phân tích đầu vào của người dùng trước mỗi lượt và chọn trước tool đúng dựa trên các từ khóa được phát hiện và mẫu ID."}, {"id": "B", "text": "Kết hợp cả hai tool thành một tool `lookup_entity` duy nhất chấp nhận bất kỳ định danh nào và tự quyết định bên trong nên truy vấn backend nào."}, {"id": "C", "text": "Thêm các ví dụ few-shot vào system prompt minh họa các mẫu chọn tool đúng, với 5–8 ví dụ định tuyến các truy vấn liên quan đến đơn hàng đến `lookup_order`."}, {"id": "D", "text": "Mở rộng mô tả của từng tool để bao gồm định dạng đầu vào, ví dụ truy vấn, edge case, và ranh giới giải thích khi nào dùng nó so với các tool tương tự."}], "correct": "D", "explanation": "Mở rộng mô tả tool với định dạng đầu vào, ví dụ truy vấn, edge case, và ranh giới rõ ràng trực tiếp khắc phục nguyên nhân gốc rễ—các mô tả tối thiểu không cung cấp cho LLM đủ thông tin để phân biệt các tool tương tự. Đây là bước đầu tiên ít công sức, tác động cao, giúp cải thiện cơ chế chính mà LLM dùng để chọn tool.", "scenario": "Customer Support Agent"}, {"set": "practice", "n": 58, "situation": "Bạn đang triển khai agentic loop cho support agent của mình. Sau mỗi lời gọi Claude API, bạn phải quyết định có tiếp tục vòng lặp hay không (chạy các tool được yêu cầu và gọi Claude lần nữa) hoặc dừng lại (trình bày câu trả lời cuối cùng cho khách hàng). Điều gì quyết định quyết định này?", "ask": "Điều gì quyết định quyết định này?", "options": [{"id": "A", "text": "Kiểm tra trường `stop_reason` trong phản hồi của Claude—tiếp tục nếu nó là `tool_use` và dừng nếu nó là `end_turn`."}, {"id": "B", "text": "Phân tích văn bản của Claude để tìm các cụm từ như \"Tôi đã xong\" hoặc \"Tôi có thể giúp gì thêm không?\"—các tín hiệu ngôn ngữ tự nhiên cho thấy nhiệm vụ đã hoàn thành."}, {"id": "C", "text": "Đặt một số lần lặp tối đa (ví dụ: 10 lời gọi) và dừng khi đạt đến, bất kể Claude có cho thấy cần thêm việc hay không."}, {"id": "D", "text": "Kiểm tra xem phản hồi có chứa nội dung văn bản của assistant hay không—nếu Claude tạo ra văn bản giải thích, vòng lặp nên kết thúc."}], "correct": "A", "explanation": "`stop_reason` là tín hiệu có cấu trúc tường minh của Claude để điều khiển vòng lặp: `tool_use` cho thấy Claude muốn chạy một tool và nhận lại kết quả, trong khi `end_turn` cho thấy Claude đã hoàn thành phản hồi của mình và vòng lặp nên kết thúc.", "scenario": "Customer Support Agent"}, {"set": "practice", "n": 59, "situation": "Production logs cho thấy agent diễn giải sai các đầu ra từ các MCP tool của bạn: Unix timestamps từ `get_customer`, ngày tháng ISO 8601 từ `lookup_order`, và các mã trạng thái dạng số (1=đang chờ, 2=đã giao). Một số tool là các MCP server của bên thứ ba mà bạn không thể chỉnh sửa. Cách tiếp cận chuẩn hóa định dạng dữ liệu nào dễ bảo trì nhất?", "ask": "Cách tiếp cận nào dễ bảo trì nhất?", "options": [{"id": "A", "text": "Dùng một PostToolUse hook để chặn các đầu ra của tool và áp dụng các phép biến đổi định dạng trước khi agent xử lý chúng."}, {"id": "B", "text": "Chỉnh sửa các tool mà bạn kiểm soát để trả về các định dạng dễ đọc cho con người và tạo các wrapper cho các tool của bên thứ ba."}, {"id": "C", "text": "Tạo một tool `normalize_data` mà agent gọi sau mỗi lần truy xuất dữ liệu để biến đổi các giá trị."}, {"id": "D", "text": "Thêm tài liệu định dạng chi tiết vào system prompt giải thích các quy ước dữ liệu của từng tool."}], "correct": "A", "explanation": "Một PostToolUse hook cung cấp một điểm tập trung, deterministic để chặn và chuẩn hóa tất cả các đầu ra của tool—bao gồm cả dữ liệu từ MCP server của bên thứ ba—trước khi agent xử lý chúng. Nó dễ bảo trì hơn vì các phép biến đổi nằm trong code và áp dụng đồng nhất, thay vì dựa vào sự diễn giải của LLM.", "scenario": "Customer Support Agent"}, {"set": "practice", "n": 60, "situation": "Production logs cho thấy agent đôi khi chọn `get_customer` khi `lookup_order` mới phù hợp hơn, đặc biệt với các truy vấn mơ hồ như \"Tôi cần trợ giúp với lần mua hàng gần đây của tôi.\" Bạn quyết định thêm các ví dụ few-shot vào system prompt để cải thiện việc chọn tool. Cách tiếp cận nào giải quyết vấn đề hiệu quả nhất?", "ask": "Cách tiếp cận nào hiệu quả nhất?", "options": [{"id": "A", "text": "Thêm hướng dẫn \"use when\" và \"don't use when\" rõ ràng trong mỗi mô tả tool bao quát các trường hợp mơ hồ."}, {"id": "B", "text": "Thêm các ví dụ được nhóm theo tool—tất cả các kịch bản `get_customer` cùng nhau, rồi đến tất cả các kịch bản `lookup_order`."}, {"id": "C", "text": "Thêm 4–6 ví dụ nhắm vào các kịch bản mơ hồ, mỗi ví dụ kèm lý do tại sao chọn một tool thay vì các lựa chọn thay thế hợp lý khác."}, {"id": "D", "text": "Thêm 10–15 ví dụ về các yêu cầu rõ ràng, không mơ hồ minh họa việc chọn tool đúng cho các kịch bản điển hình của từng tool."}], "correct": "C", "explanation": "Nhắm các ví dụ few-shot vào chính những kịch bản mơ hồ nơi xảy ra lỗi, kèm lý do tường minh tại sao một tool tốt hơn các lựa chọn thay thế, dạy cho mô hình quá trình ra quyết định so sánh cần thiết cho các edge case. Điều này hiệu quả hơn các ví dụ chung chung hoặc các quy tắc mang tính khai báo.", "scenario": "Customer Support Agent"}, {"set": "practice", "n": 61, "situation": "Tool `remove_team_member` của bạn dùng một tham số `dry_run: boolean` để xem trước tác động trước khi thực thi. Giám sát production cho thấy agent bỏ qua bước xem trước bằng cách gọi trực tiếp với `dry_run=false`. Bạn cần đảm bảo mọi thao tác xóa đều phải đi trước bởi một bước xem trước mà người dùng xác nhận tường minh.", "ask": "Cách tiếp cận đáng tin cậy nhất là gì?", "options": [{"id": "A", "text": "Thêm validation phía server chỉ cho phép `dry_run=false` khi có một lời gọi `dry_run=true` với các tham số giống hệt diễn ra trong vòng 60 giây vừa qua."}, {"id": "B", "text": "Chú thích tool là yêu cầu xác nhận và cấu hình lớp orchestration để nhắc người dùng phê duyệt trước khi chuyển tiếp bất kỳ lời gọi nào đến các tool đã được chú thích."}, {"id": "C", "text": "Thêm hướng dẫn chi tiết và ví dụ few-shot vào mô tả tool, yêu cầu agent luôn gọi với `dry_run=true` trước và chờ người dùng xác nhận trước khi gọi lại."}, {"id": "D", "text": "Thay bằng hai tool: `preview_remove_member` trả về chi tiết tác động và một confirmation token dùng một lần; `execute_remove_member` yêu cầu token đó, ràng buộc việc thực thi với bước xem trước."}], "correct": "D", "explanation": "Cách tiếp cận hai tool ràng buộc bằng token khiến việc thực thi mà không có bước xem trước trở nên bất khả thi về mặt kiến trúc—tool execute thực sự yêu cầu một token mà chỉ tool preview mới có thể tạo ra. Đây là cách tiếp cận duy nhất thực thi ràng buộc ở cấp độ code thay vì dựa vào việc LLM tuân thủ các hướng dẫn (C), heuristic về thời gian (A), hay hạ tầng orchestration (B).", "scenario": "Conversational AI Architecture Patterns"}, {"set": "practice", "n": 62, "situation": "Giám sát production cho thấy tool `search_catalog` của bạn thất bại 12% số lần: 8% là network timeout sẽ thành công khi retry, và 4% là lỗi cú pháp truy vấn không bao giờ thành công dù retry bao nhiêu lần. Hiện tại cả hai loại lỗi đều được trả về giống hệt nhau, gây lãng phí các lần retry.", "ask": "Bạn nên chỉnh sửa cơ chế xử lý lỗi của tool như thế nào?", "options": [{"id": "A", "text": "Thêm các ví dụ few-shot vào system prompt minh họa cách phân biệt lỗi network với lỗi cú pháp."}, {"id": "B", "text": "Áp dụng logic retry với exponential backoff cho mọi lỗi một cách đồng đều."}, {"id": "C", "text": "Triển khai tự động retry với backoff cho network timeout bên trong tool; trả về lỗi cú pháp ngay lập tức kèm chi tiết validation tham số."}, {"id": "D", "text": "Trả về mọi lỗi kèm một cờ boolean `retryable` và chi tiết loại lỗi."}], "correct": "C", "explanation": "Xử lý retry ở cấp độ tool đối với các lỗi tạm thời là ranh giới trừu tượng đúng đắn—tool có hiểu biết dứt khoát về loại lỗi và có thể triển khai logic retry deterministic mà không phải dựa vào agent để diễn giải một cờ (D) hay tuân theo các hướng dẫn ở cấp prompt (A). Backoff đồng đều (B) lãng phí thời gian cho các lỗi cú pháp vốn không bao giờ thành công.", "scenario": "Conversational AI Architecture Patterns"}, {"set": "practice", "n": 63, "situation": "Qua nhiều lượt trao đổi về chiến lược đầu tư, người dùng đã nói \"Tôi có khẩu vị rủi ro rất thấp\" và sau đó \"Tôi muốn tối đa hóa lợi nhuận.\" Bây giờ họ hỏi: \"Tôi nên đầu tư vào cái gì?\"", "ask": "Cách tiếp cận nào đảm bảo tốt nhất rằng khuyến nghị phù hợp với ưu tiên thực sự của người dùng?", "options": [{"id": "A", "text": "Nêu ra mâu thuẫn và hỏi người dùng để làm rõ điều nào quan trọng hơn."}, {"id": "B", "text": "Cung cấp các khuyến nghị riêng biệt cho cả hai kịch bản."}, {"id": "C", "text": "Tiến hành theo sở thích được nêu gần đây nhất."}, {"id": "D", "text": "Khuyến nghị một danh mục cân bằng mà không giải quyết xung đột."}], "correct": "A", "explanation": "Khi các sở thích của người dùng mâu thuẫn trực tiếp với nhau, nêu ra xung đột và hỏi để làm rõ là cách duy nhất đảm bảo khuyến nghị phù hợp với ý định thực sự của người dùng. Bất kỳ cách tiếp cận nào khác đều liên quan đến việc đưa ra một giả định có thể sai—tối đa hóa lợi nhuận và khẩu vị rủi ro thấp là những mục tiêu về cơ bản không tương thích, đòi hỏi một quyết định của con người.", "scenario": "Conversational AI Architecture Patterns"}, {"set": "practice", "n": 64, "situation": "Người dùng tinh chỉnh sở thích playlist qua nhiều lượt hội thoại. Hai tin nhắn sau khi người dùng nói \"Tôi yêu nhạc jazz,\" Claude lại hỏi \"Bạn thích những thể loại nào?\"", "ask": "Nguyên nhân có khả năng nhất là gì?", "options": [{"id": "A", "text": "Claude yêu cầu một kết nối vector database để duy trì bộ nhớ hội thoại."}, {"id": "B", "text": "Context window của mô hình đã bị vượt quá."}, {"id": "C", "text": "Claude API yêu cầu một tham số `session_id`."}, {"id": "D", "text": "Ứng dụng của bạn không bao gồm các tin nhắn trước đó trong mảng `messages`."}], "correct": "D", "explanation": "Claude không có bộ nhớ phía server—mỗi lời gọi API đều stateless. Nếu không bao gồm toàn bộ lịch sử hội thoại trong mảng `messages` của mỗi request, Claude không có hiểu biết gì về các lượt trước đó. Vector database (A) và `session_id` (C) không phải là một phần trong kiến trúc của Claude; việc tràn context window (B) là bất khả thi đối với cuộc trao đổi chỉ có hai tin nhắn.", "scenario": "Conversational AI Architecture Patterns"}, {"set": "practice", "n": 65, "situation": "Sau một phiên nấu ăn kéo dài 40 phút, cuộc hội thoại đạt 78.000 token. Lịch sử bao gồm các dị ứng, việc điều chỉnh tỷ lệ công thức, các thuật ngữ nấu ăn đã được làm rõ, và thảo luận chung. Bạn phải giảm số token trong khi vẫn bảo toàn thông tin quan trọng.", "ask": "Cách tiếp cận nào cân bằng tốt nhất giữa việc bảo toàn và việc giảm token?", "options": [{"id": "A", "text": "Tóm tắt toàn bộ lịch sử hội thoại."}, {"id": "B", "text": "Chỉ giữ lại 20.000 token gần đây nhất."}, {"id": "C", "text": "Trích xuất dữ liệu có cấu trúc trọng yếu (dị ứng, số lượng, sở thích), tóm tắt phần thảo luận chung, và giữ nguyên văn các cuộc trao đổi gần đây."}, {"id": "D", "text": "Lưu toàn bộ cuộc hội thoại ở bên ngoài và truy xuất các phần liên quan qua semantic search."}], "correct": "C", "explanation": "Cách tiếp cận lai bảo toàn thông tin có giá trị cao nhất với chi phí thấp nhất. Các sự kiện trọng yếu như dị ứng và số lượng trong công thức được trích xuất thành một khối có cấu trúc gọn gàng (ngăn ngừa sự mất mát độ chính xác xảy ra trong quá trình tóm tắt), phần thảo luận chung được tóm tắt, và các cuộc trao đổi gần đây được giữ nguyên văn để đảm bảo tính mạch lạc của hội thoại. Phương án A và B có nguy cơ làm mất thông tin ăn kiêng trọng yếu; D là quá mức về mặt kiến trúc đối với một phiên nấu ăn đơn lẻ.", "scenario": "Conversational AI Architecture Patterns"}, {"set": "practice", "n": 66, "situation": "Người dùng báo cáo rằng trong các cuộc hội thoại kéo dài, trợ lý mất dấu các chủ đề và sở thích trước đó. Triển khai hiện tại của bạn chỉ giữ lại 25 cặp tin nhắn gần nhất.", "ask": "Giải pháp hiệu quả nhất là gì?", "options": [{"id": "A", "text": "Cách tiếp cận lai: tóm tắt các tin nhắn cũ hơn trong khi giữ nguyên văn các tin nhắn gần đây."}, {"id": "B", "text": "Vector similarity search trên toàn bộ lịch sử hội thoại."}, {"id": "C", "text": "Tăng cửa sổ lên 50 cặp tin nhắn."}, {"id": "D", "text": "Tóm tắt các tin nhắn bị loại bỏ ở mỗi lượt và đặt bản tóm tắt đang chạy lên đầu."}], "correct": "A", "explanation": "Cách tiếp cận lai giải quyết cả hai chiều của vấn đề: giữ lại context gần đây chính xác (then chốt cho tính mạch lạc của hội thoại) trong khi duy trì một biểu diễn nén của các sở thích trước đó (ngăn ngừa mất mát hoàn toàn khi các cặp bị loại bỏ). Tăng cửa sổ (C) chỉ đơn giản là trì hoãn chính vấn đề đó. Vector search (B) có thể bỏ sót context quan trọng vốn không tương đồng ngữ nghĩa với truy vấn hiện tại. Tóm tắt toàn bộ ở mỗi lượt (D) làm tăng chi phí xử lý và tích lũy các lỗi tóm tắt.", "scenario": "Conversational AI Architecture Patterns"}, {"set": "practice", "n": 67, "situation": "Người dùng báo cáo rằng latency tăng và chi phí tăng khi các cuộc hội thoại vượt quá 50 lượt.", "ask": "Nguyên nhân chính là gì?", "options": [{"id": "A", "text": "Toàn bộ lịch sử hội thoại được bao gồm trong mỗi request API."}, {"id": "B", "text": "Mô hình tạo ra các phản hồi dài dần lên."}, {"id": "C", "text": "Các thao tác database chậm đi khi lịch sử tăng lên."}, {"id": "D", "text": "Mô hình xây dựng một hồ sơ người dùng nội bộ đòi hỏi nhiều xử lý hơn."}], "correct": "A", "explanation": "API của Claude hoàn toàn stateless—mỗi request phải bao gồm toàn bộ lịch sử hội thoại trong mảng `messages`. Khi các cuộc hội thoại lớn dần, mỗi request mang theo nhiều token hơn, điều này trực tiếp làm tăng cả latency xử lý lẫn chi phí. Mô hình không duy trì bất kỳ trạng thái nội bộ nào giữa các lời gọi (D là sai), và độ dài phản hồi vốn không gắn liền với độ dài hội thoại (B).", "scenario": "Conversational AI Architecture Patterns"}, {"set": "practice", "n": 68, "situation": "Sau ba tháng với các phiên hàng tuần, lịch sử hội thoại tăng lên 85.000 token. Khi người dùng hỏi \"Chúng ta đã kết luận gì về chủ đề sự cô lập?\", trợ lý đưa ra các câu trả lời chung chung thay vì tham chiếu đến các cuộc thảo luận trước đó.", "ask": "Cách tiếp cận hiệu quả nhất là gì?", "options": [{"id": "A", "text": "Cắt bớt theo cửa sổ trượt."}, {"id": "B", "text": "Tóm tắt lũy tiến nắm bắt các kết luận then chốt."}, {"id": "C", "text": "Semantic embedding cùng với việc truy xuất các cuộc trao đổi liên quan."}, {"id": "D", "text": "Thêm các thẻ XML có cấu trúc đánh dấu các kết luận thảo luận."}], "correct": "C", "explanation": "Semantic search trên lịch sử hội thoại là cách tiếp cận duy nhất có thể mở rộng cho ba tháng thảo luận trong khi vẫn có thể đưa ra các cuộc trao đổi liên quan cụ thể theo yêu cầu. Cửa sổ trượt (A) sẽ loại bỏ phần lớn lịch sử. Tóm tắt lũy tiến (B) nén các cuộc thảo luận thành những khái niệm trừu tượng làm mất đi các kết luận cụ thể mà người dùng đang hỏi. Thẻ XML (D) đòi hỏi tái cấu trúc toàn bộ nội dung quá khứ và không giải quyết được vấn đề truy xuất ở quy mô này.", "scenario": "Conversational AI Architecture Patterns"}, {"set": "practice", "n": 69, "situation": "Trong quá trình kiểm thử QA, Claude tuân theo các hướng dẫn của system prompt trong 10–15 lượt đầu tiên, nhưng các phản hồi về sau lại lệch đi. Cuộc hội thoại vẫn nằm trong giới hạn token.", "ask": "Giải pháp tốt nhất là gì?", "options": [{"id": "A", "text": "Chuyển các hướng dẫn về hành vi vào tin nhắn đầu tiên của người dùng."}, {"id": "B", "text": "Bắt đầu một cuộc hội thoại mới sau 20 lượt."}, {"id": "C", "text": "Chèn các tin nhắn vai trò người dùng nhằm củng cố các hướng dẫn tại những điểm ngắt của cuộc hội thoại."}, {"id": "D", "text": "Dùng validation sau phản hồi để tạo lại các phản hồi không tuân thủ."}], "correct": "C", "explanation": "Việc chèn định kỳ các lời nhắc về hành vi trực tiếp chống lại hiện tượng trôi hướng dẫn bằng cách tái thiết lập các ràng buộc theo những khoảng đều đặn khi lịch sử hội thoại tích lũy. Chuyển các hướng dẫn vào tin nhắn đầu tiên của người dùng (A) làm giảm thẩm quyền của chúng. Bắt đầu một cuộc hội thoại mới (B) phá hủy context. Validation sau phản hồi (D) mang tính khắc phục hơn là phòng ngừa và làm tăng latency đáng kể.", "scenario": "Conversational AI Architecture Patterns"}, {"set": "practice", "n": 70, "situation": "Gia sư AI của bạn có một system prompt 2.800 token định nghĩa phương pháp giảng dạy và các quy tắc thích ứng. Sau 12 lượt, trợ lý bắt đầu phớt lờ các cấp độ trình độ.", "ask": "Cách khắc phục hiệu quả nhất là gì?", "options": [{"id": "A", "text": "Chèn các lời nhắc mỗi 4–5 lượt."}, {"id": "B", "text": "Thay các quy tắc dài dòng bằng các ví dụ few-shot minh họa việc thích ứng theo cấp độ trình độ."}, {"id": "C", "text": "Đặt các quy tắc trọng yếu ở cuối system prompt."}, {"id": "D", "text": "Đánh giá các phản hồi và tạo lại nếu cấp độ khó không khớp."}], "correct": "B", "explanation": "Một system prompt 2.800 token với các quy tắc khai báo dễ bị trôi vì các quy tắc trừu tượng đòi hỏi mô hình phải suy luận về chúng ở mỗi lượt. Thay các quy tắc dài dòng bằng các ví dụ few-shot cụ thể minh họa việc thích ứng theo cấp độ trình độ đúng đắn sẽ cung cấp cho mô hình những mẫu hành vi rõ ràng để khớp theo—điều này được tuân theo đáng tin cậy hơn qua nhiều lượt so với các hướng dẫn trừu tượng. Việc chèn lời nhắc (A) có ích nhưng chỉ giải quyết triệu chứng; đặt ở cuối (C) có ích lúc đầu nhưng không xử lý được hiện tượng trôi theo từng lượt; việc tạo lại (D) tốn kém và mang tính khắc phục.", "scenario": "Conversational AI Architecture Patterns"}, {"set": "practice", "n": 71, "situation": "Trợ lý của bạn phải duy trì giọng điệu hào hứng, giải thích lập luận của mình, và đặt các câu hỏi làm rõ. Những hướng dẫn về hành vi này nên được định nghĩa ở đâu?", "ask": "Những hướng dẫn về hành vi này nên được định nghĩa ở đâu?", "options": [{"id": "A", "text": "Đặt lên đầu mỗi tin nhắn của người dùng."}, {"id": "B", "text": "Trong system prompt."}, {"id": "C", "text": "Trong tin nhắn assistant đầu tiên."}, {"id": "D", "text": "Trong các biến môi trường."}], "correct": "B", "explanation": "System prompt được thiết kế chuyên biệt cho các ràng buộc và hướng dẫn về hành vi mang tính bền vững, áp dụng xuyên suốt toàn bộ cuộc hội thoại. Đặt lên đầu mỗi tin nhắn của người dùng (A) là chi phí thừa thãi và dư thừa. Tin nhắn assistant đầu tiên (C) không đáng tin cậy vì mô hình có thể đi chệch khỏi chính các phát biểu trước đó của nó. Các biến môi trường (D) không có tác động gì đến hành vi của mô hình.", "scenario": "Conversational AI Architecture Patterns"}, {"set": "practice", "n": 72, "situation": "Người dùng báo cáo các phần mở đầu phản hồi lặp đi lặp lại như \"Certainly!\" và \"I'd be happy to help!\"", "ask": "Cách tiếp cận hiệu quả nhất là gì?", "options": [{"id": "A", "text": "Nối thêm một tin nhắn assistant một phần với phần mở đầu trả lời trực tiếp."}, {"id": "B", "text": "Hạ thấp thiết lập temperature."}, {"id": "C", "text": "Hậu xử lý các phản hồi để loại bỏ lời chào."}, {"id": "D", "text": "Thêm hướng dẫn vào system prompt để tránh các cụm từ đó."}], "correct": "A", "explanation": "Việc prefill phản hồi của assistant bằng phần khởi đầu của một câu trả lời trực tiếp ngăn chặn các mẫu lời chào ngay ở cấp độ sinh—mô hình tiếp tục từ phần prefill thay vì tạo ra các cụm mở đầu mới. Hướng dẫn trong system prompt (D) có thể có ích nhưng kém tin cậy hơn vì mô hình vẫn có thể tạo ra các biến thể. Hậu xử lý (C) là một cách lách dễ vỡ. Temperature (B) kiểm soát tính ngẫu nhiên, chứ không phải các mẫu cụm từ cụ thể.", "scenario": "Conversational AI Architecture Patterns"}, {"set": "practice", "n": 73, "situation": "Một webhook thông báo cho hệ thống của bạn rằng kiện hàng của người dùng đã được giao đi trong khi người dùng đang trò chuyện. Bạn muốn trợ lý đưa thông tin này vào phản hồi tiếp theo một cách tự nhiên.", "ask": "Cách tiếp cận tốt nhất là gì?", "options": [{"id": "A", "text": "Thêm trạng thái giao hàng vào system prompt."}, {"id": "B", "text": "Gửi ngay một tin nhắn người dùng tổng hợp."}, {"id": "C", "text": "Buộc trợ lý gọi một status tool ở mỗi lượt."}, {"id": "D", "text": "Nối phần cập nhật trạng thái như một tiền tố cho tin nhắn tiếp theo của người dùng."}], "correct": "D", "explanation": "Đặt phần cập nhật trạng thái làm tiền tố cho tin nhắn tiếp theo của người dùng sẽ chèn context thời gian thực tại một ranh giới hội thoại tự nhiên mà không làm gián đoạn dòng chảy. Chỉnh sửa system prompt (A) đòi hỏi xây dựng lại session hoặc cồng kềnh về mặt kiến trúc. Một tin nhắn người dùng tổng hợp (B) có thể phá vỡ dòng đối thoại tự nhiên và gây nhầm lẫn về nguồn gốc phát ngôn. Buộc gọi một tool ở mỗi lượt (C) là lãng phí khi các sự kiện hiếm khi xảy ra.", "scenario": "Conversational AI Architecture Patterns"}, {"set": "practice", "n": 74, "situation": "Người dùng thường xuyên gửi các yêu cầu như \"Đặt một địa điểm cho bữa tiệc.\" Trợ lý đặt từ 4 câu hỏi làm rõ trở lên, gây ra tỷ lệ bỏ cuộc 35%.", "ask": "Cách tiếp cận nào cải thiện trade-off tốt nhất?", "options": [{"id": "A", "text": "Tiến hành với các giá trị mặc định ẩn."}, {"id": "B", "text": "Hỏi tất cả các câu hỏi làm rõ trong một tin nhắn gộp."}, {"id": "C", "text": "Nêu các giả định một cách tường minh và tiến hành trong khi mời người dùng đính chính."}, {"id": "D", "text": "Sử dụng một biểu mẫu thu thập thông tin có cấu trúc."}], "correct": "C", "explanation": "Nêu các giả định một cách tường minh rồi tiến hành sẽ mang lại cho người dùng một phản hồi tức thì, hữu ích trong khi vẫn giữ được khả năng đính chính các giả định sai của họ. Các giá trị mặc định ẩn (A) khiến người dùng không hề biết điều gì đã được giả định. Một danh sách câu hỏi gộp (B) vẫn đòi hỏi nỗ lực trả lời trước từ người dùng. Một biểu mẫu có cấu trúc (D) tạo thêm ma sát chứ không phải bớt đi—trái với mục tiêu giảm tỷ lệ bỏ cuộc.", "scenario": "Conversational AI Architecture Patterns"}, {"set": "practice", "n": 75, "situation": "Trợ lý của bạn dùng một system prompt với persona nhà thầu. Các lượt đầu tuân theo các quy tắc, nhưng đến lượt 7 trợ lý lại đưa ra lời khuyên chung chung. Độ dài hội thoại chỉ mới 2.500 token.", "ask": "Nguyên nhân có khả năng nhất là gì?", "options": [{"id": "A", "text": "System prompt chỉ thiết lập hành vi ban đầu."}, {"id": "B", "text": "Sự chú ý của mô hình suy yếu khi các lượt tích lũy."}, {"id": "C", "text": "Các phản hồi assistant tích lũy làm loãng ảnh hưởng của system prompt."}, {"id": "D", "text": "System prompt chỉ được gửi đi một lần."}], "correct": "C", "explanation": "Khi các phản hồi assistant tích lũy trong lịch sử hội thoại, tỷ lệ văn bản phản ánh các ràng buộc về hành vi của system prompt giảm đi so với khối lượng ngày càng tăng của nội dung do assistant tạo ra. Mô hình ngày càng khớp mẫu theo các đầu ra trước đó của chính nó thay vì theo system prompt, làm trầm trọng thêm hiện tượng trôi ngay cả ở độ dài token ngắn. System prompt được bao gồm trong mỗi lời gọi API (D là sai nếu xét như một lời giải thích độc lập), và sự suy giảm chú ý của mô hình (B) không xảy ra ở mức 2.500 token.", "scenario": "Conversational AI Architecture Patterns"}, {"set": "practice", "n": 76, "situation": "Người dùng đặt các yêu cầu mơ hồ như \"Bạn có thể giúp với bản báo cáo không?\" Trợ lý phản hồi bằng cách đặt nhiều câu hỏi (báo cáo nào? giúp gì? hạn chót khi nào?), gây ra tỷ lệ bỏ cuộc 40%.", "ask": "Giải pháp tốt nhất là gì?", "options": [{"id": "A", "text": "Đưa ra các giả định hợp lý, nêu chúng một cách tường minh, và đề nghị điều chỉnh."}, {"id": "B", "text": "Phân loại mức độ mơ hồ bằng một mô hình nhỏ hơn trước khi phản hồi."}, {"id": "C", "text": "Sử dụng các cách diễn giải định trước mà không nêu các giả định."}, {"id": "D", "text": "Giới hạn trợ lý ở một câu hỏi làm rõ mỗi lượt."}], "correct": "A", "explanation": "Tiến hành với các giả định hợp lý đã được nêu rõ sẽ loại bỏ hoàn toàn việc qua lại trong khi vẫn giữ cho người dùng được thông tin và nắm quyền kiểm soát. Các cách diễn giải định trước âm thầm (C) khiến người dùng bối rối khi phản hồi không khớp với ý định của họ. Một giới hạn một câu hỏi (D) vẫn đòi hỏi nhiều lượt qua lại. Một mô hình phân loại nhỏ hơn (B) làm tăng latency và độ phức tạp hạ tầng mà không giải quyết được vấn đề UX cốt lõi.", "scenario": "Conversational AI Architecture Patterns"}], "domains": [{"n": 1, "title": "Kiến trúc và Điều phối Agent", "weight": 27, "tasks": [{"id": "1.1", "title": "Thiết kế Agentic Loop để Thực thi Tác vụ Tự chủ", "knowledge": ["Vòng đời của agent loop: gửi một yêu cầu Claude, kiểm tra `stop_reason` (`\"tool_use\"` so với `\"end_turn\"`), thực thi tool, trả kết quả về cho vòng lặp kế tiếp", "Kết quả của tool được nối thêm vào lịch sử hội thoại để mô hình có thể quyết định hành động tiếp theo", "Ra quyết định do mô hình điều khiển (Claude chọn tool kế tiếp) so với cây quyết định cứng (hard-coded)"], "skills": ["Điều khiển luồng: tiếp tục vòng lặp khi `stop_reason = \"tool_use\"` và dừng khi gặp `\"end_turn\"`", "Nối kết quả của tool vào context giữa các vòng lặp", "Các anti-pattern cần tránh: phân tích văn bản của assistant để xác định hoàn thành, dùng giới hạn số vòng lặp tùy ý làm cơ chế dừng chính"]}, {"id": "1.2", "title": "Điều phối Hệ thống Multi-agent (Coordinator–Subagent)", "knowledge": ["Kiến trúc hub-and-spoke: coordinator nắm toàn bộ giao tiếp giữa các agent, xử lý lỗi và định tuyến", "Các subagent hoạt động với context tách biệt—chúng không tự động kế thừa lịch sử của coordinator", "Trách nhiệm của coordinator: phân rã tác vụ, ủy thác, tổng hợp kết quả, lựa chọn subagent một cách động", "Rủi ro coordinator phân rã quá hẹp"], "skills": ["Chia phạm vi nghiên cứu giữa các subagent để giảm thiểu trùng lặp", "Triển khai vòng lặp tinh chỉnh lặp lại (coordinator đánh giá phần tổng hợp và định tuyến lại tác vụ)", "Định tuyến toàn bộ giao tiếp qua coordinator để có khả năng quan sát"]}, {"id": "1.3", "title": "Cấu hình các Lời gọi Subagent, Truyền Context và Spawning", "knowledge": ["Tool `Task` spawn các subagent; `allowedTools` của coordinator phải bao gồm `\"Task\"`", "Context của subagent phải được đưa vào prompt một cách tường minh; subagent không kế thừa context của agent cha", "Cấu hình `AgentDefinition`: mô tả, system prompt, ràng buộc tool", "Quản lý session qua `fork_session` để khám phá các phương án thay thế"], "skills": ["Đưa toàn bộ đầu ra từ các agent trước vào prompt của subagent", "Dùng định dạng có cấu trúc để tách dữ liệu khỏi metadata khi truyền context", "Spawn các subagent song song qua nhiều lời gọi `Task` trong một lượt duy nhất của coordinator", "Viết prompt cho coordinator theo hướng mục tiêu và tiêu chí chất lượng thay vì hướng dẫn từng bước"]}, {"id": "1.4", "title": "Triển khai Workflow Nhiều bước với các Mẫu Thực thi và Bàn giao", "knowledge": ["Sự khác biệt giữa **thực thi theo lập trình** (hook, điều kiện tiên quyết) và **hướng dẫn bằng prompt** để sắp xếp thứ tự một workflow", "Khi bạn cần các đảm bảo deterministic (ví dụ, xác minh danh tính trước các thao tác tài chính), chỉ dùng prompt là không đủ", "Giao thức bàn giao có cấu trúc trong quá trình escalation (ID khách hàng, lý do, hành động được khuyến nghị)"], "skills": ["Điều kiện tiên quyết theo lập trình để chặn các lời gọi phía sau cho đến khi các bước trước hoàn tất (ví dụ, chặn `process_refund` cho đến khi `get_customer` trả về một ID đã được xác minh)", "Phân rã các yêu cầu khách hàng nhiều khía cạnh thành các mục riêng biệt", "Tạo các bản tóm tắt có cấu trúc khi escalation cho con người"]}, {"id": "1.5", "title": "Agent SDK Hook để Chặn Lời gọi Tool và Chuẩn hóa Dữ liệu", "knowledge": ["Các mẫu hook (ví dụ, `PostToolUse`) để chặn kết quả của tool trước khi mô hình tiêu thụ chúng", "Các hook chặn lời gọi đi ra để thực thi quy tắc tuân thủ (ví dụ, chặn hoàn tiền vượt ngưỡng)", "Hook cung cấp **đảm bảo deterministic** so với hướng dẫn bằng prompt vốn chỉ cung cấp **mức tuân thủ xác suất**"], "skills": ["Các hook `PostToolUse` để chuẩn hóa định dạng dữ liệu (Unix timestamp, ISO 8601, mã trạng thái dạng số)", "Các hook chặn để ngăn các hành động vi phạm chính sách kèm chuyển hướng sang escalation", "Chọn hook thay vì prompt khi quy tắc nghiệp vụ đòi hỏi sự tuân thủ được đảm bảo"]}, {"id": "1.6", "title": "Chiến lược Phân rã Tác vụ cho Workflow Phức tạp", "knowledge": ["**Pipeline cố định** (prompt chaining) so với **phân rã thích ứng động** dựa trên kết quả trung gian", "Prompt chaining: các bước tuần tự (phân tích từng file riêng biệt, sau đó chạy một lượt tích hợp)", "Kế hoạch điều tra thích ứng sinh ra các tác vụ con dựa trên những gì đã được phát hiện"], "skills": ["Dùng prompt chaining cho các đánh giá nhiều khía cạnh có thể dự đoán được; dùng phân rã động cho các điều tra mở", "Chia các đợt review code lớn thành phân tích từng file cộng thêm một lượt tích hợp xuyên file riêng biệt", "Phân rã các tác vụ mở: lập bản đồ cấu trúc trước, sau đó xây dựng một kế hoạch được ưu tiên hóa"]}, {"id": "1.7", "title": "Trạng thái Session, Resuming và Forking", "knowledge": ["`--resume <session-name>` để tiếp tục các session có tên", "`fork_session` để tạo các nhánh điều tra độc lập từ context dùng chung", "Tầm quan trọng của việc thông báo cho agent về các thay đổi file khi resume session", "Một session mới với bản tóm tắt có cấu trúc có thể đáng tin cậy hơn so với việc resume với kết quả đã lỗi thời"], "skills": ["Dùng `--resume` để tiếp tục các session điều tra có tên", "Dùng `fork_session` để so sánh các phương án song song", "Chọn giữa resume (context vẫn còn hiện hành) so với khởi tạo một session mới (kết quả đã lỗi thời)"]}]}, {"n": 2, "title": "Thiết kế Tool và Tích hợp MCP", "weight": 18, "tasks": [{"id": "2.1", "title": "Thiết kế Giao diện Tool với Mô tả Rõ ràng", "knowledge": ["Mô tả tool là **cơ chế chính** mà một LLM dùng để chọn tool; mô tả tối thiểu dẫn đến việc lựa chọn không đáng tin cậy", "Tầm quan trọng của việc đưa vào định dạng đầu vào, các truy vấn ví dụ, các edge case và ranh giới khả dụng", "Mô tả mơ hồ hoặc chồng lấp gây ra định tuyến sai", "Cách diễn đạt trong system prompt có thể tạo ra những liên tưởng ngoài ý muốn với các tool"], "skills": ["Viết mô tả phân biệt rõ ràng mỗi tool với các phương án tương tự", "Đổi tên tool để loại bỏ sự chồng lấp về chức năng (ví dụ, `analyze_content` -> `extract_web_results`)", "Chia các tool đa năng thành các tool chuyên biệt với hợp đồng đầu vào/đầu ra rõ ràng"]}, {"id": "2.2", "title": "Triển khai Phản hồi Lỗi có Cấu trúc cho Tool MCP", "knowledge": ["Cờ `isError` trong phản hồi tool MCP", "Sự khác biệt giữa **lỗi tạm thời** (timeout), **lỗi validation** (đầu vào sai), **lỗi nghiệp vụ** (vi phạm chính sách), và **lỗi truy cập/quyền hạn**", "Lỗi chung chung (\"Operation failed\") ngăn cản các quyết định phục hồi đúng đắn", "Sự khác biệt giữa lỗi có thể retry và không thể retry"], "skills": ["Trả về metadata có cấu trúc như `errorCategory` (transient/validation/permission), `isRetryable`, và một thông điệp mà con người đọc được", "Dùng `retryable: false` cho các vi phạm quy tắc nghiệp vụ kèm giải thích rõ ràng hướng đến người dùng", "Thực hiện phục hồi cục bộ bên trong subagent đối với các lỗi tạm thời; chỉ lan truyền những lỗi mà chúng không thể giải quyết", "Phân biệt lỗi truy cập (quyết định retry) với kết quả rỗng hợp lệ (không có kết quả khớp)"]}, {"id": "2.3", "title": "Phân bổ Tool Giữa các Agent và Cấu hình `tool_choice`", "knowledge": ["Quá nhiều tool cho mỗi agent (ví dụ, 18 thay vì 4–5) **làm giảm** độ tin cậy của việc lựa chọn tool", "Các agent có tool ngoài chuyên môn của mình có xu hướng sử dụng chúng sai cách", "Truy cập tool có phạm vi: chỉ những tool liên quan đến vai trò cộng thêm một tập hạn chế các tiện ích liên vai trò", "`tool_choice`: `\"auto\"`, `\"any\"`, và lựa chọn tool bắt buộc (`{\"type\": \"tool\", \"name\": \"...\"}`)"], "skills": ["Giới hạn bộ tool của mỗi subagent vào những gì liên quan đến vai trò của nó", "Thay thế các tool tổng quát bằng các phương án bị ràng buộc (ví dụ, `fetch_url` -> `load_document`)", "Dùng `tool_choice: \"any\"` để đảm bảo có một lời gọi tool thay vì một câu trả lời văn bản", "Bắt buộc một tool cụ thể để đảm bảo thứ tự thực thi"]}, {"id": "2.4", "title": "Tích hợp MCP Server vào Claude Code và Workflow của Agent", "knowledge": ["Phạm vi MCP server: dự án (`.mcp.json`) cho các nhóm so với người dùng (`~/.claude.json`) cho thử nghiệm", "Thay thế biến môi trường trong `.mcp.json` (ví dụ, `${GITHUB_TOKEN}`) để quản lý secret", "Tool từ tất cả MCP server đã kết nối được khám phá khi kết nối và khả dụng đồng thời", "MCP resource như “danh mục nội dung” (bản tóm tắt tác vụ, schema cơ sở dữ liệu) để giảm các lời gọi tool mang tính khám phá"], "skills": ["Cấu hình các MCP server dùng chung trong `.mcp.json` của dự án với token dựa trên biến môi trường", "Giữ các server cá nhân/thử nghiệm trong `~/.claude.json`", "Ưu tiên các MCP server cộng đồng hơn các server tùy chỉnh cho các tích hợp tiêu chuẩn"]}, {"id": "2.5", "title": "Lựa chọn và Áp dụng các Tool Tích hợp sẵn (Read, Write, Edit, Bash, Grep, Glob)", "knowledge": ["**Grep**: tìm kiếm trong nội dung file (tên hàm, thông điệp lỗi, import)", "**Glob**: tìm file theo mẫu tên/phần mở rộng", "**Read/Write**: thao tác toàn bộ file; **Edit**: thay đổi chính xác qua các khớp văn bản duy nhất", "Nếu Edit thất bại do các khớp không duy nhất, hãy chuyển sang dùng Read + Write"], "skills": ["Dùng Grep để tìm kiếm nội dung và Glob để khám phá file theo mẫu", "Xây dựng sự hiểu biết một cách tăng dần: Grep các điểm vào, sau đó Read để truy vết các luồng", "Truy vết việc sử dụng hàm qua các module bao bọc (wrapper)"]}]}, {"n": 3, "title": "Cấu hình Claude Code và Workflow", "weight": 20, "tasks": [{"id": "3.1", "title": "Cấu hình CLAUDE.md với Phân cấp, Phạm vi và Tổ chức Mô-đun hóa", "knowledge": ["Phân cấp CLAUDE.md: người dùng (`~/.claude/CLAUDE.md`), dự án (`.claude/CLAUDE.md` hoặc `CLAUDE.md` ở thư mục gốc), và cấp thư mục (CLAUDE.md trong các thư mục con)", "Cài đặt cấp người dùng chỉ áp dụng cho một người dùng và không được chia sẻ qua VCS", "Cú pháp `@path` để tham chiếu các file bên ngoài (ví dụ, `@./standards/coding-style.md`) nhằm mô-đun hóa CLAUDE.md", "Thư mục `.claude/rules/` chứa các file quy tắc tập trung theo chủ đề thay cho một CLAUDE.md đơn khối"], "skills": ["Chẩn đoán các vấn đề phân cấp (một thành viên mới của nhóm bỏ lỡ hướng dẫn vì chúng ở cấp người dùng thay vì cấp dự án)", "Dùng `@path` (ví dụ, `@./standards/testing.md`) để đưa các tiêu chuẩn vào một cách chọn lọc trong CLAUDE.md của từng package", "Chia một CLAUDE.md lớn thành nhiều file `.claude/rules/` (testing.md, api-conventions.md, deployment.md)"]}, {"id": "3.2", "title": "Tạo và Cấu hình các Slash Command và Skill Tùy chỉnh", "knowledge": ["**Command của dự án** trong `.claude/commands/` (chia sẻ qua VCS) so với **command của người dùng** trong `~/.claude/commands/`", "Skill trong `.claude/skills/` với frontmatter `SKILL.md`: `context: fork`, `allowed-tools`, `argument-hint`", "`context: fork` chạy skill trong một context subagent tách biệt để nó không làm ô nhiễm session chính", "Các biến thể skill cá nhân có thể nằm trong `~/.claude/skills/` dưới các tên khác nhau"], "skills": ["Lưu các slash command của dự án trong `.claude/commands/` để cả nhóm đều có chúng", "Dùng `context: fork` để cô lập các skill có đầu ra dài dòng", "Dùng `allowed-tools` để hạn chế những tool mà một skill có thể sử dụng", "Dùng `argument-hint` để nhắc nhở lập trình viên về các tham số bắt buộc"]}, {"id": "3.3", "title": "Sử dụng Quy tắc Theo đường dẫn để Tải Quy ước có Điều kiện", "knowledge": ["Các file `.claude/rules/` có thể bao gồm frontmatter YAML `paths` để kích hoạt quy tắc dựa trên các mẫu glob", "Các quy tắc theo phạm vi đường dẫn **chỉ** tải khi chỉnh sửa các file khớp, giúp tiết kiệm context và token", "Các quy tắc đường dẫn dựa trên glob có thể được ưu tiên hơn CLAUDE.md cấp thư mục khi các quy ước áp dụng xuyên nhiều thư mục (ví dụ, các bài test)"], "skills": ["Tạo các file `.claude/rules/` với `paths: [\"terraform/**/*\"]` để chỉ tải khi làm việc trên các file khớp", "Dùng các mẫu glob (`**/*.test.tsx`) để áp dụng quy ước theo loại file bất kể vị trí", "Ưu tiên các quy tắc theo đường dẫn hơn CLAUDE.md cấp thư mục khi các quy ước trải rộng khắp codebase"]}, {"id": "3.4", "title": "Quyết định Khi nào Dùng Planning Mode so với Thực thi Trực tiếp", "knowledge": ["**Planning mode**: cho các tác vụ phức tạp với thay đổi lớn, nhiều phương án khả thi và các quyết định kiến trúc", "**Thực thi trực tiếp**: cho các thay đổi đơn giản, đã được hiểu rõ (ví dụ, thêm một validation duy nhất)", "Planning mode cho phép khám phá codebase một cách an toàn trước khi thực hiện thay đổi", "Subagent Explore cô lập đầu ra khám phá dài dòng"], "skills": ["Dùng planning mode cho các tác vụ có hệ quả về kiến trúc (microservice, các migration chạm tới hơn 45 file)", "Dùng thực thi trực tiếp cho các đợt sửa lỗi có stack trace rõ ràng và một file duy nhất", "Dùng subagent Explore để ngăn việc cạn kiệt context window trong các tác vụ nhiều giai đoạn", "Kết hợp các cách tiếp cận: lập kế hoạch để khám phá, sau đó thực thi để triển khai"]}, {"id": "3.5", "title": "Tinh chỉnh Lặp lại để Cải thiện Tiệm tiến", "knowledge": ["Các ví dụ đầu vào/đầu ra cụ thể là cách hiệu quả nhất để truyền đạt kỳ vọng", "**Lặp lại theo hướng test**: viết test trước, sau đó lặp lại dựa trên các thất bại", "Mẫu “phỏng vấn”: Claude đặt câu hỏi để làm lộ ra các cân nhắc thiết kế không hiển nhiên", "Khi nào nên cung cấp tất cả vấn đề trong một thông điệp (phụ thuộc lẫn nhau) so với cung cấp tuần tự (độc lập)"], "skills": ["Cung cấp 2–3 ví dụ đầu vào/đầu ra cụ thể để làm rõ các yêu cầu biến đổi", "Xây dựng các bộ test với hành vi kỳ vọng, các edge case và các yêu cầu hiệu năng trước khi triển khai", "Dùng mẫu phỏng vấn để làm lộ ra các khía cạnh thiết kế (vô hiệu hóa cache, các chế độ lỗi)", "Cung cấp các test case cụ thể với đầu vào mẫu và đầu ra kỳ vọng cho các edge case"]}, {"id": "3.6", "title": "Tích hợp Claude Code vào Pipeline CI/CD", "knowledge": ["Cờ `-p` (hoặc `--print`) cho chế độ non-interactive trong các pipeline tự động hóa", "`--output-format json` và `--json-schema` cho structured output trong CI", "CLAUDE.md cung cấp context của dự án (tiêu chuẩn test, tiêu chí review) cho Claude Code được kích hoạt bởi CI", "**Cô lập context của session**: chính session đã sinh ra code thì kém hiệu quả hơn trong việc review nó so với một instance độc lập"], "skills": ["Chạy Claude Code trong CI với `-p` để tránh bị treo khi chờ đầu vào tương tác", "Dùng `--output-format json` + `--json-schema` cho các kết quả có cấu trúc (ví dụ, các comment inline trên pull request)", "Đưa kết quả review trước đó vào khi chạy lại sau các commit mới (chỉ báo cáo các vấn đề mới/chưa được sửa)", "Tài liệu hóa tiêu chuẩn test và các fixture sẵn có trong CLAUDE.md để cải thiện chất lượng sinh test", "Đưa các file test hiện có vào context khi sinh test mới nhằm tránh trùng lặp và giữ phong cách nhất quán"]}]}, {"n": 4, "title": "Prompt Engineering và Structured Output", "weight": 20, "tasks": [{"id": "4.1", "title": "Thiết kế Prompt với Tiêu chí Tường minh để Cải thiện Độ chính xác", "knowledge": ["Tiêu chí tường minh hiệu quả hơn các hướng dẫn mơ hồ (ví dụ, “chỉ gắn cờ comment khi chúng mâu thuẫn với code” so với “kiểm tra độ chính xác của comment”)", "Hướng dẫn chung chung kiểu “hãy thận trọng hơn” hoạt động kém hơn so với các tiêu chí phân loại cụ thể", "Tác động của false positive lên niềm tin của lập trình viên: tỷ lệ false-positive cao ở một số hạng mục làm xói mòn niềm tin vào các hạng mục chính xác"], "skills": ["Định nghĩa tiêu chí review: cái gì cần báo cáo (bug, bảo mật) so với cái gì cần bỏ qua (lỗi style nhỏ)", "Tạm thời vô hiệu hóa các hạng mục có tỷ lệ false-positive cao", "Định nghĩa tiêu chí mức độ nghiêm trọng tường minh với ví dụ code cho mỗi cấp độ"]}, {"id": "4.2", "title": "Sử dụng Few-shot Prompting để Cải thiện Tính Nhất quán của Đầu ra", "knowledge": ["Các ví dụ few-shot là phương pháp hiệu quả nhất để tạo ra đầu ra được định dạng nhất quán và có tính hành động", "Few-shot có thể minh họa cách xử lý các trường hợp mơ hồ (lựa chọn tool, các lỗ hổng trong độ phủ test)", "Few-shot giúp mô hình tổng quát hóa sang các mẫu mới thay vì chỉ lặp lại các giá trị mặc định", "Few-shot có thể giảm hiện tượng ảo giác (hallucination) trong các tác vụ trích xuất"], "skills": ["Cung cấp 2–4 ví dụ có mục tiêu cho các kịch bản mơ hồ kèm lý do", "Đưa vào các ví dụ few-shot minh họa định dạng đầu ra (vị trí, vấn đề, mức độ nghiêm trọng, đề xuất sửa)", "Cung cấp các ví dụ phân biệt các mẫu code chấp nhận được với các vấn đề thực sự", "Cung cấp các ví dụ về việc trích xuất đúng từ các tài liệu có cấu trúc khác nhau"]}, {"id": "4.3", "title": "Thực thi Structured Output với `tool_use` và JSON Schema", "knowledge": ["`tool_use` với JSON Schema là cách đáng tin cậy nhất để đảm bảo đầu ra tuân thủ schema và loại bỏ các lỗi cú pháp JSON", "Với `tool_choice: \"auto\"` mô hình có thể trả về văn bản; với `\"any\"` nó phải gọi một tool; lựa chọn bắt buộc thì chọn một tool cụ thể", "JSON Schema nghiêm ngặt loại bỏ các lỗi cú pháp nhưng không ngăn được các lỗi ngữ nghĩa (tổng không khớp; giá trị nằm sai trường)", "Thiết kế schema: trường bắt buộc so với tùy chọn; enum với “other” cộng một chuỗi chi tiết để có khả năng mở rộng"], "skills": ["Định nghĩa các tool trích xuất với JSON Schema và parse dữ liệu từ kết quả `tool_use`", "Dùng `tool_choice: \"any\"` để đảm bảo structured output khi tồn tại nhiều schema", "Bắt buộc một lời gọi tool cụ thể: `tool_choice: {\"type\": \"tool\", \"name\": \"extract_metadata\"}`", "Để các trường ở dạng tùy chọn/nullable khi nguồn có thể không chứa thông tin nhằm tránh bịa ra giá trị", "Dùng các giá trị enum như `\"unclear\"` và `\"other\"` cộng các trường chi tiết để phân loại có khả năng mở rộng"]}, {"id": "4.4", "title": "Triển khai Validation, Retry và Vòng lặp Phản hồi cho Chất lượng Trích xuất", "knowledge": ["Retry kèm phản hồi lỗi: đưa các lỗi validation cụ thể vào prompt retry để hướng dẫn sửa lỗi", "Retry không hiệu quả khi thông tin đơn giản là không có trong nguồn", "Thiết kế vòng lặp phản hồi: theo dõi mẫu đã kích hoạt một phát hiện (`detected_pattern`)", "Lỗi ngữ nghĩa (tổng không khớp) so với lỗi cú pháp (được xử lý bởi `tool_use`)"], "skills": ["Các prompt tiếp nối với tài liệu gốc, một bản trích xuất sai, và các lỗi validation cụ thể", "Nhận diện khi nào retry sẽ không hiệu quả (thông tin cần thiết chỉ nằm trong một tài liệu bên ngoài)", "Đưa các trường `detected_pattern` vào các phát hiện để phân tích false positive", "Thiết kế tự sửa lỗi bằng cách trích xuất cả `calculated_total` lẫn `stated_total` để phát hiện sai lệch"]}, {"id": "4.5", "title": "Thiết kế Chiến lược Batch Processing Hiệu quả", "knowledge": ["Message Batches API: tiết kiệm 50%, cửa sổ xử lý lên đến 24 giờ, không có đảm bảo SLA về độ trễ", "Batch processing phù hợp cho các tác vụ không chặn (báo cáo qua đêm, audit) và không phù hợp cho các tác vụ chặn (kiểm tra trước khi merge)", "Batch API không hỗ trợ gọi tool nhiều lượt trong một yêu cầu duy nhất", "Các trường `custom_id` để tương quan request/response trong các batch"], "skills": ["Dùng API đồng bộ cho các kiểm tra chặn; dùng Batch API cho các khối lượng công việc qua đêm/hàng tuần", "Lập kế hoạch nhịp độ gửi batch dựa trên nhu cầu SLA (ví dụ, cửa sổ 4 giờ cho một đảm bảo 30 giờ với 24 giờ xử lý)", "Xử lý các thất bại bằng cách gửi lại chỉ những tài liệu thất bại (được nhận diện bởi `custom_id`)", "Lặp lại trên prompt bằng một mẫu trước khi chạy xử lý quy mô lớn"]}, {"id": "4.6", "title": "Thiết kế Kiến trúc Review Đa instance và Đa lượt", "knowledge": ["Hạn chế của tự review: mô hình giữ lại context suy luận của nó và ít có khả năng thách thức các quyết định của chính mình", "Các instance review độc lập (không có context sinh ra) tốt hơn trong việc tìm các vấn đề tinh tế", "Review đa lượt: phân tích cục bộ theo từng file cộng thêm một lượt tích hợp xuyên file để tránh sự pha loãng chú ý"], "skills": ["Dùng một instance Claude thứ hai độc lập để review các thay đổi mà không có context sinh ra", "Chia các đợt review nhiều file thành các lượt theo từng file cộng thêm các lượt tích hợp để phân tích luồng dữ liệu xuyên file", "Dùng các lượt xác minh với độ tự tin tự đánh giá để định tuyến các đợt review một cách được hiệu chỉnh"]}]}, {"n": 5, "title": "Quản lý Context và Độ tin cậy", "weight": 15, "tasks": [{"id": "5.1", "title": "Quản lý Context Hội thoại để Bảo toàn Thông tin Quan trọng", "knowledge": ["Rủi ro của việc tóm tắt tiệm tiến: các giá trị số, phần trăm và ngày tháng bị cô đọng thành các bản tóm tắt mơ hồ", "Hiệu ứng lost-in-the-middle: các mô hình xử lý đáng tin cậy phần đầu và phần cuối của các đầu vào dài, nhưng có thể bỏ sót các phát hiện ở phần giữa", "Đầu ra của tool có thể tích lũy trong context không tương xứng với mức độ liên quan (hơn 40 trường trong khi chỉ cần 5)", "Tầm quan trọng của việc gửi toàn bộ lịch sử hội thoại trong các yêu cầu API tiếp theo"], "skills": ["Trích xuất các sự kiện giao dịch vào một khối “case facts” bền vững nằm ngoài lịch sử đã được tóm tắt", "Cắt gọn các đầu ra tool dài dòng xuống còn các trường liên quan", "Đặt các phát hiện then chốt ở đầu của dữ liệu tổng hợp với các tiêu đề mục tường minh", "Yêu cầu các subagent đưa metadata (ngày tháng, nguồn) vào các đầu ra có cấu trúc"]}, {"id": "5.2", "title": "Thiết kế các Mẫu Escalation Hiệu quả và Giải quyết Sự Mơ hồ", "knowledge": ["Các tác nhân kích hoạt escalation phù hợp: yêu cầu rõ ràng cần con người, lỗ hổng/ngoại lệ chính sách, không có khả năng tiến triển", "Escalation tức thì (yêu cầu rõ ràng) so với cố gắng giải quyết (trong phạm vi của agent)", "Phân tích cảm xúc và việc mô hình tự đánh giá độ tự tin là các đại lượng thay thế không đáng tin cậy cho độ phức tạp của vụ việc", "Nhiều khách hàng trùng khớp đòi hỏi phải hỏi thêm định danh, không phải đoán theo heuristic"], "skills": ["Tiêu chí escalation tường minh với các ví dụ few-shot trong system prompt", "Thực thi ngay các yêu cầu rõ ràng cần con người mà không cần điều tra thêm", "Escalation khi chính sách mơ hồ hoặc im lặng đối với một yêu cầu cụ thể", "Hỏi thêm định danh khi kết quả tool chứa nhiều khớp"]}, {"id": "5.3", "title": "Triển khai Chiến lược Lan truyền Lỗi trong Hệ thống Multi-agent", "knowledge": ["Context lỗi có cấu trúc (loại thất bại, truy vấn, kết quả một phần, các phương án thay thế) cho phép coordinator phục hồi thông minh hơn", "Phân biệt lỗi truy cập (timeout đòi hỏi một quyết định retry) với kết quả rỗng hợp lệ (không có khớp)", "Trạng thái lỗi chung chung (“search unavailable”) che giấu context có giá trị khỏi coordinator", "Cả việc lặng lẽ chặn lỗi lẫn việc hủy bỏ toàn bộ workflow chỉ vì một thất bại đều là anti-pattern"], "skills": ["Trả về context lỗi có cấu trúc: loại thất bại, những gì đã được thử, kết quả một phần, các phương án thay thế khả dĩ", "Phân biệt lỗi truy cập với kết quả rỗng hợp lệ", "Thực hiện phục hồi cục bộ trong các subagent đối với các lỗi tạm thời; chỉ lan truyền các lỗi không thể phục hồi kèm kết quả một phần", "Chú thích độ phủ trong phần tổng hợp: cái gì được hỗ trợ tốt so với chỗ nào còn lỗ hổng"]}, {"id": "5.4", "title": "Quản lý Context Hiệu quả khi Điều tra các Codebase Lớn", "knowledge": ["Suy giảm context trong các session dài: mô hình bắt đầu tạo ra các câu trả lời không ổn định và dẫn chiếu đến “các mẫu điển hình” thay vì các lớp cụ thể", "Các file scratchpad bảo toàn các phát hiện then chốt qua các ranh giới context", "Ủy thác cho các subagent cô lập đầu ra khám phá dài dòng", "Lưu trữ trạng thái có cấu trúc cho phép phục hồi sau khi sự cố (crash recovery)"], "skills": ["Spawn các subagent cho các câu hỏi cụ thể trong khi giữ việc điều phối cấp cao trong agent chính", "Dùng các file scratchpad để lưu các phát hiện then chốt và dẫn chiếu chúng sau này", "Tóm tắt các phát hiện then chốt trước khi spawn các subagent của giai đoạn kế tiếp", "Dùng `/compact` để giảm mức sử dụng context trong các đợt điều tra dài"]}, {"id": "5.5", "title": "Thiết kế Workflow với Giám sát của Con người và Hiệu chỉnh Độ tự tin", "knowledge": ["Các chỉ số tổng hợp (ví dụ, độ chính xác tổng thể 97%) có thể che giấu hiệu năng kém trên các loại tài liệu hoặc trường cụ thể", "Lấy mẫu ngẫu nhiên phân tầng đo lường tỷ lệ lỗi trong các đợt trích xuất có độ tự tin cao", "Hiệu chỉnh độ tự tin ở cấp trường bằng cách dùng các tập validation đã gán nhãn", "Xác nhận độ chính xác theo loại tài liệu và phân đoạn trường trước khi tự động hóa"], "skills": ["Triển khai lấy mẫu ngẫu nhiên phân tầng để phát hiện các mẫu lỗi mới", "Phân tích độ chính xác theo loại tài liệu và trường để xác nhận hiệu năng ổn định", "Xuất ra các điểm độ tự tin ở cấp trường và hiệu chỉnh ngưỡng review bằng dữ liệu đã gán nhãn", "Định tuyến các đợt trích xuất có độ tự tin thấp hoặc nguồn mơ hồ sang con người để review"]}, {"id": "5.6", "title": "Bảo toàn Provenance và Xử lý Tính Bất định trong Tổng hợp Đa nguồn", "knowledge": ["Quy gán bị mất trong quá trình tóm tắt nếu không bảo toàn các ánh xạ “claim → source”", "Các ánh xạ có cấu trúc phải được bảo toàn trong quá trình tổng hợp", "Xử lý các thống kê mâu thuẫn bằng cách chú thích các xung đột kèm quy gán thay vì tùy tiện chọn một giá trị", "Đưa vào ngày xuất bản/thu thập để tránh việc đọc nhầm các khác biệt theo thời gian thành mâu thuẫn"], "skills": ["Yêu cầu các subagent xuất ra các ánh xạ “claim → source” (URL, tên tài liệu, trích dẫn)", "Cấu trúc các báo cáo để tách các phát hiện ổn định khỏi các phát hiện đang tranh chấp", "Bảo toàn các giá trị mâu thuẫn kèm chú thích và chuyển chúng cho coordinator để đối soát", "Đưa vào ngày xuất bản để diễn giải theo thời gian đúng đắn", "Render nội dung theo loại: dữ liệu tài chính dạng bảng, tin tức dạng văn xuôi, các phát hiện kỹ thuật dạng danh sách có cấu trúc"]}]}], "scen": [["Agent Hỗ trợ Khách hàng", "Bạn xây dựng một agent để xử lý trả hàng, tranh chấp thanh toán, và các vấn đề tài khoản bằng Claude Agent SDK. Agent sử dụng các MCP tool (`get_customer`, `lookup_order`, `process_refund`, `escalate_to_human`). Mục tiêu là đạt 80%+ tỷ lệ giải quyết ngay lần liên hệ đầu tiên với escalation phù hợp."], ["Sinh mã với Claude Code", "Bạn dùng Claude Code để tăng tốc phát triển: sinh mã, refactor, debug, viết tài liệu. Bạn cần tích hợp nó với các custom slash command và cấu hình CLAUDE.md, đồng thời hiểu khi nào nên dùng planning mode."], ["Hệ thống Nghiên cứu Multi-Agent", "Một coordinator agent ủy thác các tác vụ cho những subagent chuyên biệt: nghiên cứu web, phân tích tài liệu, tổng hợp, và tạo báo cáo. Hệ thống phải tạo ra các báo cáo hoàn chỉnh kèm trích dẫn."], ["Công cụ Nâng cao Năng suất Lập trình viên", "Agent giúp các kỹ sư khám phá những codebase chưa quen thuộc, sinh boilerplate code, và tự động hóa các tác vụ thường nhật. Các tool dựng sẵn (Read, Write, Bash, Grep, Glob) và MCP server được sử dụng."], ["Claude Code cho Continuous Integration", "Tích hợp Claude Code vào một CI/CD pipeline để review code tự động, tạo test, và phản hồi trên pull request. Prompt phải được thiết kế để giảm thiểu false positive."], ["Trích xuất Dữ liệu Có cấu trúc", "Hệ thống trích xuất thông tin từ các tài liệu phi cấu trúc, validate output bằng JSON schema, và duy trì độ chính xác cao. Nó phải xử lý đúng các edge case."], ["Các Mẫu Kiến trúc AI Hội thoại", "Bạn thiết kế các hệ thống hội thoại multi-turn bao gồm quản lý context window, duy trì chỉ dẫn xuyên suốt các lượt, các chiến lược memory, thiết kế tool để thực thi an toàn, và xử lý các đầu vào người dùng mơ hồ hoặc mâu thuẫn."], ["Công cụ Agentic AI *(thiếu nội dung — hãy giúp chúng tôi bổ sung!)*", "Kịch bản này đã được các ứng viên thi báo cáo nhưng chưa được đề cập trong hướng dẫn này. Nếu bạn từng gặp các câu hỏi từ kịch bản này trong bài thi thật, hãy chia sẻ chúng tại [GitHub Issues](https://github.com/paullarionov/claude-certified-architect/issues) để chúng tôi có thể bổ sung đầy đủ. Đóng góp của bạn sẽ giúp ích cho mọi người đang ôn tập cho bài thi."]], "exercises": [{"title": "Agent đa công cụ với logic escalation", "goal": "Thiết kế một agent loop với tích hợp tool, xử lý lỗi có cấu trúc và escalation.", "steps": ["Định nghĩa 3–4 MCP tool kèm mô tả chi tiết (bao gồm hai tool tương tự nhau để kiểm tra việc lựa chọn tool)", "Triển khai một agent loop kiểm tra `stop_reason` (`\"tool_use\"` / `\"end_turn\"`)", "Bổ sung các phản hồi lỗi có cấu trúc: `errorCategory`, `isRetryable`, mô tả", "Triển khai một interceptor hook chặn các thao tác vượt ngưỡng và định tuyến tới escalation", "Kiểm thử với các yêu cầu đa khía cạnh"], "domains": "1 (Kiến trúc agent), 2 (Tools và MCP), 5 (Context và độ tin cậy)"}, {"title": "Cấu hình Claude Code cho phát triển theo nhóm", "goal": "Cấu hình CLAUDE.md, custom command, quy tắc theo đường dẫn và MCP server.", "steps": ["Tạo một CLAUDE.md ở cấp dự án với các tiêu chuẩn áp dụng chung", "Tạo các file `.claude/rules/` với YAML frontmatter cho những vùng code khác nhau (`paths: [\"src/api/**/*\"]`, `paths: [\"**/*.test.*\"]`)", "Tạo một project skill trong `.claude/skills/` với `context: fork` và `allowed-tools`", "Cấu hình một MCP server trong `.mcp.json` với biến môi trường + một override cá nhân trong `~/.claude.json`", "Kiểm thử planning mode so với thực thi trực tiếp trên các tác vụ có độ phức tạp khác nhau"], "domains": "3 (Cấu hình Claude Code), 2 (Tools và MCP)"}, {"title": "Pipeline trích xuất dữ liệu có cấu trúc", "goal": "JSON schema, `tool_use` cho structured output, các vòng lặp validation/retry, batch processing.", "steps": ["Định nghĩa một extraction tool với một JSON schema (trường bắt buộc/tùy chọn, enum kèm \"other\", trường nullable)", "Xây dựng một vòng lặp validation: khi gặp lỗi, retry với tài liệu, kết quả trích xuất sai và lỗi validation cụ thể", "Bổ sung các ví dụ few-shot cho những tài liệu có cấu trúc khác nhau", "Sử dụng batch processing thông qua Message Batches API: 100 tài liệu, xử lý các lần thất bại qua `custom_id`", "Định tuyến tới con người: điểm độ tin cậy ở cấp trường, phân tích loại tài liệu"], "domains": "4 (Prompt engineering), 5 (Context và độ tin cậy)"}, {"title": "Thiết kế và debug một pipeline nghiên cứu đa agent", "goal": "Điều phối subagent, truyền context, lan truyền lỗi, tổng hợp kèm theo dõi nguồn.", "steps": ["Một coordinator với 2+ subagent (`allowedTools` bao gồm `\"Task\"`, context được truyền tường minh trong prompt)", "Chạy các subagent song song qua nhiều lời gọi `Task` trong một response duy nhất", "Yêu cầu subagent xuất kết quả có cấu trúc: nhận định, trích dẫn, source URL, ngày xuất bản", "Mô phỏng một subagent timeout: trả về context lỗi có cấu trúc cho coordinator và tiếp tục với kết quả từng phần", "Kiểm thử với dữ liệu mâu thuẫn: giữ lại cả hai giá trị kèm ghi nguồn; tách biệt các phát hiện đã xác nhận và đang tranh cãi"], "domains": "1 (Kiến trúc agent), 2 (Tools và MCP), 5 (Context và độ tin cậy)"}], "prep": ["**Xây dựng một agent với Claude Agent SDK** — triển khai một agent loop hoàn chỉnh với gọi tool, xử lý lỗi và quản lý session. Thực hành với subagent và truyền context tường minh.", "**Cấu hình Claude Code cho một dự án thực tế** — sử dụng phân cấp CLAUDE.md, quy tắc theo đường dẫn trong `.claude/rules/`, skill với `context: fork` và `allowed-tools`, và tích hợp MCP server.", "**Thiết kế và kiểm thử các MCP tool** — viết mô tả phân biệt các tool tương tự nhau, trả về lỗi có cấu trúc kèm phân loại và cờ retry, và kiểm thử với các yêu cầu mơ hồ của người dùng.", "**Xây dựng một pipeline trích xuất dữ liệu** — sử dụng `tool_use` với JSON schema, vòng lặp validation/retry, trường tùy chọn/nullable, và batch processing qua Message Batches API.", "**Thực hành prompt engineering** — bổ sung ví dụ few-shot cho các kịch bản mơ hồ, tiêu chí đánh giá tường minh, và kiến trúc nhiều lượt cho việc review code lớn.", "**Nghiên cứu các mẫu quản lý context** — trích xuất dữ kiện từ output dài dòng, dùng file scratchpad, và ủy thác việc khám phá cho subagent để xử lý giới hạn context.", "**Hiểu về escalation và human-in-the-loop** — khi nào nên escalate (lỗ hổng chính sách, yêu cầu tường minh từ người dùng, không thể tiến triển) và các quy trình định tuyến dựa trên độ tin cậy.", "**Làm một bài thi thử** trước khi thi thật. Nó dùng cùng các kịch bản và định dạng."], "oos": ["Fine-tuning các model Claude hoặc huấn luyện model tùy chỉnh", "Xác thực Claude API, thanh toán hoặc quản lý tài khoản", "Triển khai chi tiết bằng các ngôn ngữ lập trình hoặc framework cụ thể (vượt ngoài những gì cần thiết để cấu hình tool/schema)", "Triển khai hoặc hosting MCP server (hạ tầng, mạng, điều phối container)", "Kiến trúc nội bộ của Claude, quá trình huấn luyện hoặc model weight", "Constitutional AI, RLHF hoặc các phương pháp huấn luyện an toàn", "Embedding model hoặc chi tiết triển khai vector database", "Computer use (tự động hóa trình duyệt, tương tác desktop)", "Khả năng phân tích hình ảnh (Vision)", "Streaming API hoặc server-sent event", "Rate limiting, hạn ngạch, hoặc tính toán chi tiết chi phí API", "OAuth, xoay vòng API key, hoặc chi tiết giao thức xác thực", "Các cấu hình riêng theo nhà cung cấp cloud (AWS, GCP, Azure)", "Benchmark hiệu năng hoặc chỉ số so sánh model", "Chi tiết triển khai prompt caching (vượt ngoài việc biết nó tồn tại)", "Thuật toán đếm token hoặc các chi tiết tokenization"], "tech": [["Claude Agent SDK", "AgentDefinition, agent loop, `stop_reason`, hook (PostToolUse), tạo subagent qua Task, `allowedTools`"], ["Model Context Protocol (MCP)", "MCP server, tool, resource, `isError`, mô tả tool, `.mcp.json`, biến môi trường"], ["Claude Code", "Phân cấp CLAUDE.md, `.claude/rules/` với mẫu glob, `.claude/commands/`, `.claude/skills/` với SKILL.md, planning mode, `/compact`, `--resume`, `fork_session`"], ["Claude Code CLI", "`-p` / `--print` cho chế độ non-interactive, `--output-format json`, `--json-schema`"], ["Claude API", "`tool_use` với JSON schema, `tool_choice` (\"auto\"/\"any\"/forced), `stop_reason`, `max_tokens`, system prompt"], ["Message Batches API", "tiết kiệm 50%, cửa sổ tối đa 24 giờ, `custom_id`, không hỗ trợ gọi tool nhiều lượt"], ["JSON Schema", "Bắt buộc so với tùy chọn, trường nullable, kiểu enum, \"other\" + chi tiết, strict mode"], ["Pydantic", "Validation schema, lỗi ngữ nghĩa, vòng lặp validation/retry"], ["Built-in tool", "Read, Write, Edit, Bash, Grep, Glob — mục đích và tiêu chí lựa chọn"], ["Few-shot prompting", "Ví dụ có chủ đích cho các tình huống mơ hồ, khái quát hóa sang mẫu mới"], ["Prompt chaining", "Phân rã tuần tự thành các lượt tập trung"], ["Context window", "Ngân sách token, tóm tắt lũy tiến, \"lost in the middle\", file scratchpad"], ["Quản lý session", "Resume, `fork_session`, session đặt tên, cô lập context"], ["Hiệu chỉnh độ tin cậy", "Chấm điểm cấp trường, hiệu chỉnh trên tập có nhãn, lấy mẫu phân tầng"]], "cand": ["**Claude Agent SDK** — điều phối multi-agent, ủy thác cho subagent, tích hợp tool, lifecycle hook", "**Claude Code** — CLAUDE.md, MCP server, Agent Skills, planning mode", "**Model Context Protocol (MCP)** — tool và resource để tích hợp backend", "**Prompt engineering** — JSON schema, ví dụ few-shot, template trích xuất dữ liệu", "**Context window** — làm việc với tài liệu dài, truyền context giữa nhiều agent", "**CI/CD pipeline** — review code tự động, tạo test", "**Escalation và độ tin cậy** — xử lý lỗi, human-in-the-loop"], "candlead": "Ứng viên lý tưởng là một **solution architect** thiết kế và phát hành các ứng dụng production với Claude. Bạn nên có ít nhất 6 tháng kinh nghiệm thực hành với:", "lede": "Chứng chỉ **Claude Certified Architect — Foundations** xác nhận rằng một chuyên gia có thể đưa ra các quyết định trade-off hợp lý khi triển khai các giải pháp dựa trên Claude trong thực tế. Bài thi đánh giá kiến thức nền tảng về Claude Code, Claude Agent SDK, Claude API, và Model Context Protocol (MCP)—những công nghệ cốt lõi để xây dựng các ứng dụng production với Claude."}};

  vi: {

    src: `Tổng hợp từ kho tài liệu cộng đồng ${REPO} (bản tiếng Việt). Đây không phải tài liệu chính thức của Anthropic; hãy đối chiếu với <a href="${PORTAL}" target="_blank" rel="noopener">cổng thi chính thức</a>.`,

    hTopics: "Nội dung thi theo lĩnh vực", topicsNote: "Các nhiệm vụ cùng kiến thức và kỹ năng trọng tâm theo hướng dẫn thi. 30 nhiệm vụ trong 5 lĩnh vực.",
    know: "Kiến thức trọng tâm", skills: "Kỹ năng trọng tâm", hTech: "Công nghệ cần nắm", thTech: ["Công nghệ", "Khía cạnh chính"], hOos: "Ngoài phạm vi thi",
    bankNote: "12 câu hỏi mẫu kèm giải thích từ hướng dẫn thi và 76 câu của bài kiểm tra thực hành. Chế độ Kiểm tra ẩn đáp án cho đến khi bạn chọn; chế độ Ôn tập hiện sẵn đáp án.",
    lScen: "Kịch bản", lSet: "Bộ câu hỏi", lSearch: "Tìm kiếm", searchPh: "vd: tool_choice, hook", lMode: "Chế độ", quiz: "Kiểm tra", study: "Ôn tập", shuffle: "Xáo trộn đáp án", onlyMissed: "Chỉ câu sai", reset: "Xóa kết quả", resetConfirm: "Bấm lần nữa để xóa",
