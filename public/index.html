it."}, {"id": "B", "text": "The new developer’s `~/.claude/CLAUDE.md` contains conflicting instructions overriding project settings; they should delete the conflicting section."}, {"id": "C", "text": "Claude Code learns per-user preferences over time; the new developer must repeat the requirement until Claude “remembers” it."}, {"id": "D", "text": "Claude Code caches CLAUDE.md after first read; original developers use cached versions. Everyone should clear the Claude Code cache."}], "correct": "A", "explanation": "If the guidance was added only to the original developers’ user-level configs and not to the project-level `.claude/CLAUDE.md`, new team members won’t receive it. Moving it to the project-level configuration ensures all current and future team members automatically get the guidance."}, {"set": "practice", "n": 38, "scenario": "Code Generation with Claude Code", "situation": "You find that including 2–3 full endpoint implementation examples as context significantly improves consistency when generating new API endpoints. However, this context is useful only when creating new endpoints—not when debugging, reviewing code, or other work in the API directory.", "ask": "Which configuration approach is most effective?", "options": [{"id": "A", "text": "Add endpoint examples and pattern documentation to the project CLAUDE.md so they are always available."}, {"id": "B", "text": "Manually reference endpoint examples in every generation request by copying code into the prompt."}, {"id": "C", "text": "Configure path-specific rules in `.claude/rules/api/` that include endpoint examples and activate when working in the API directory."}, {"id": "D", "text": "Create a skill that references the endpoint examples and contains pattern-following instructions, invoked on demand via a slash command."}], "correct": "D", "explanation": "A skill invoked on demand loads the example context only when generating new endpoints, not during unrelated tasks like debugging or review. This keeps the main context clean while preserving high-quality generation when needed."}, {"set": "practice", "n": 39, "scenario": "Code Generation with Claude Code", "situation": "Your team created a `/migration` skill that generates database migration files. It takes the migration name via `$ARGUMENTS`. In production you observe three issues: (1) developers often run the skill without arguments, causing poorly named files, (2) the skill sometimes uses database schema details from unrelated prior conversations, and (3) a developer accidentally ran destructive test cleanup when the skill had broad tool access.", "ask": "Which configuration approach fixes all three problems?", "options": [{"id": "A", "text": "Use positional parameters `$1` and `$2` instead of `$ARGUMENTS` to enforce specific inputs, include explicit schema file references via `@` syntax for context control, and add a frontmatter description warning about destructive operations."}, {"id": "B", "text": "Add `argument-hint` in frontmatter to request required parameters, use `context: fork` to isolate execution, and restrict `allowed-tools` to file-write operations."}, {"id": "C", "text": "Split into `/migration-create` and `/migration-apply` skills, add validation instructions to request migration name if missing, and use different `allowed-tools` scopes for each."}, {"id": "D", "text": "Add validation instructions in the skill SKILL.md to ensure `$ARGUMENTS` is a valid name, add prompts to ignore prior conversation context, and list prohibited operations to avoid."}], "correct": "B", "explanation": "This uses three separate configuration features to address each problem: `argument-hint` improves argument entry and reduces missing arguments, `context: fork` prevents context leakage from prior conversations, and `allowed-tools` constrains the skill to safe file-writing operations, preventing destructive actions."}, {"set": "practice", "n": 40, "scenario": "Code Generation with Claude Code", "situation": "Your codebase contains areas with different coding conventions: React components use functional style with hooks, API handlers use async/await with specific error handling, and database models follow the repository pattern. Test files are distributed across the codebase next to the code under test (e.g., `Button.test.tsx` next to `Button.tsx`), and you want all tests to follow the same conventions regardless of location.", "ask": "What is the most supported way to ensure Claude automatically applies the correct conventions when generating code?", "options": [{"id": "A", "text": "Put all conventions in the root CLAUDE.md under headings for each area and rely on Claude to infer which section applies."}, {"id": "B", "text": "Create skills in `.claude/skills/` for each code type, embedding conventions in each SKILL.md."}, {"id": "C", "text": "Place a separate CLAUDE.md file in each subdirectory containing conventions for that area."}, {"id": "D", "text": "Create rule files under `.claude/rules/` with YAML frontmatter specifying glob patterns to conditionally apply conventions based on file paths."}], "correct": "D", "explanation": "`.claude/rules/` files with YAML frontmatter and glob patterns (e.g., `**/*.test.tsx`, `src/api/**/*.ts`) enable deterministic, path-based convention application regardless of directory structure. This is the most supported approach for cross-cutting patterns like distributed test files."}, {"set": "practice", "n": 41, "scenario": "Code Generation with Claude Code", "situation": "You want to create a custom slash command `/review` that runs your team’s standard code review checklist. It should be available to every developer when they clone or update the repository.", "ask": "Where should you create the command file?", "options": [{"id": "A", "text": "In `~/.claude/commands/` in each developer’s home directory."}, {"id": "B", "text": "In the project repository under `.claude/commands/`."}, {"id": "C", "text": "In `.claude/config.json` as an array of commands."}, {"id": "D", "text": "In the root project CLAUDE.md."}], "correct": "B", "explanation": "Putting custom slash commands under `.claude/commands/` inside the project repository ensures they are version-controlled and automatically available to every developer who clones or updates the repo. This is the intended location for project-level custom commands in Claude Code."}, {"set": "practice", "n": 42, "scenario": "Code Generation with Claude Code", "situation": "Your team’s CLAUDE.md grew beyond 500 lines mixing TypeScript conventions, testing guidance, API patterns, and deployment procedures. Developers find it hard to locate and update the right sections.", "ask": "What approach does Claude Code support to organize project-level instructions into focused topical modules?", "options": [{"id": "A", "text": "Define a `.claude/config.yaml` mapping file patterns to specific sections inside CLAUDE.md."}, {"id": "B", "text": "Create separate Markdown files in `.claude/rules/`, each covering one topic (e.g., `testing.md`, `api-conventions.md`)."}, {"id": "C", "text": "Split instructions into README.md files in relevant subdirectories that Claude automatically loads as instructions."}, {"id": "D", "text": "Create multiple files named CLAUDE.md at different levels of the directory tree, each overriding parent instructions."}], "correct": "B", "explanation": "Claude Code supports a `.claude/rules/` directory where you can create separate Markdown files for topical guidance (e.g., `testing.md`, `api-conventions.md`), allowing teams to organize large instruction sets into focused, maintainable modules."}, {"set": "practice", "n": 43, "scenario": "Code Generation with Claude Code", "situation": "You create a custom skill `/explore-alternatives` that your team uses to brainstorm and evaluate implementation approaches before choosing one. Developers report that after running the skill, subsequent Claude responses are influenced by the alternatives discussion—sometimes referencing rejected approaches or retaining exploration context that interferes with actual implementation.", "ask": "How should you most effectively configure this skill?", "options": [{"id": "A", "text": "Use the `!` prefix in the skill to run exploration logic as a bash subprocess."}, {"id": "B", "text": "Add `context: fork` in the skill frontmatter."}, {"id": "C", "text": "Split into two skills—`/explore-start` and `/explore-end`—to mark boundaries when exploration context should be discarded."}, {"id": "D", "text": "Create the skill in `~/.claude/skills/` instead of `.claude/skills/`."}], "correct": "B", "explanation": "`context: fork` runs the skill in an isolated subagent context so exploration discussions do not pollute the main conversation history. This prevents rejected approaches and brainstorming context from influencing subsequent implementation work."}, {"set": "practice", "n": 44, "scenario": "Code Generation with Claude Code", "situation": "Your team wants to add a GitHub MCP server for searching PRs and checking CI status via Claude Code. Each of six developers has their own personal GitHub access token. You want consistent tooling across the team without committing credentials to version control.", "ask": "Which configuration approach is most effective?", "options": [{"id": "A", "text": "Have each developer add the server in user scope via `claude mcp add --scope user`."}, {"id": "B", "text": "Create an MCP server wrapper that reads tokens from a `.env` file and proxies GitHub API calls, then add the wrapper to the project `.mcp.json`."}, {"id": "C", "text": "Add the server to the project `.mcp.json` using environment variable substitution (`${GITHUB_TOKEN}`) for auth and document the required environment variable in the project README."}, {"id": "D", "text": "Configure the server in project scope with a placeholder token, then tell developers to override it in their local config."}], "correct": "C", "explanation": "A project `.mcp.json` with environment variable substitution is idiomatic: it provides a single version-controlled source of truth for MCP configuration while letting each developer supply credentials via environment variables. Documenting the variable makes onboarding easy without committing secrets."}, {"set": "practice", "n": 45, "scenario": "Code Generation with Claude Code", "situation": "You’re adding error-handling wrappers around external API calls across a 120-file codebase. The work has three phases: (1) discover all call sites and patterns, (2) collaboratively design the error-handling approach, and (3) implement wrappers consistently. In Phase 1, Claude generates large output listing hundreds of call sites with context, quickly filling the context window before discovery finishes.", "ask": "Which approach is most effective to complete the task while maintaining implementation consistency?", "options": [{"id": "A", "text": "Use an Explore subagent for Phase 1 to isolate verbose discovery output and return a summary, then continue Phases 2–3 in the main conversation."}, {"id": "B", "text": "Do all phases in the main conversation, periodically using `/compact` to reduce context usage while moving through files."}, {"id": "C", "text": "Switch to headless mode with `--continue`, passing explicit context summaries between batch calls to maintain continuity."}, {"id": "D", "text": "Define the error-handling pattern in CLAUDE.md, then process files in batches across multiple sessions relying on the shared memory file for consistency."}], "correct": "A", "explanation": "An Explore subagent isolates the verbose discovery output in a separate context and returns only a concise summary to the main conversation. This preserves the main context window for the collaborative design and consistent implementation phases where retained context is most valuable."}, {"set": "practice", "n": 46, "scenario": "Customer Support Agent", "situation": "While testing, you notice the agent often calls `get_customer` when users ask about order status, even though `lookup_order` would be more appropriate. What should you check first to address this problem?", "ask": "What should you check first?", "options": [{"id": "A", "text": "Implement a preprocessing classifier to detect order-related requests and route them directly to `lookup_order`."}, {"id": "B", "text": "Reduce the number of tools available to the agent to simplify choice."}, {"id": "C", "text": "Add few-shot examples to the system prompt covering all possible order request patterns to improve tool selection."}, {"id": "D", "text": "Check the tool descriptions to ensure they clearly differentiate each tool’s purpose."}], "correct": "D", "explanation": "Tool descriptions are the primary input the model uses to decide which tool to call. When an agent consistently picks the wrong tool, the first diagnostic step is to verify that tool descriptions clearly separate each tool’s purpose and usage boundaries."}, {"set": "practice", "n": 47, "scenario": "Customer Support Agent", "situation": "Your agent handles single-issue requests with 94% accuracy (e.g., “I need a refund for order #1234”). But when customers include multiple issues in one message (e.g., “I need a refund for order #1234 and also want to update the shipping address for order #5678”), tool selection accuracy drops to 58%. The agent usually solves only one issue or mixes parameters across requests. What approach most effectively improves reliability for multi-issue requests?", "ask": "What approach is most effective?", "options": [{"id": "A", "text": "Implement a preprocessing layer that uses a separate model call to decompose multi-issue messages into separate requests, handle each independently, and merge results."}, {"id": "B", "text": "Combine related tools into fewer universal tools."}, {"id": "C", "text": "Add few-shot examples to the prompt demonstrating correct reasoning and tool sequencing for multi-issue requests."}, {"id": "D", "text": "Implement response validation that detects incomplete answers and automatically reprompts the agent to resolve missed issues."}], "correct": "C", "explanation": "Few-shot examples that demonstrate correct reasoning and tool sequencing for multi-issue requests are most effective because the agent already performs well on single issues—what it needs is guidance on the pattern for decomposing and routing multiple issues and keeping parameters separated."}, {"set": "practice", "n": 48, "scenario": "Customer Support Agent", "situation": "Production logs show that for simple requests like “refund for order #1234,” your agent resolves the issue in 3–4 tool calls with 91% success. But for complex requests like “I was billed twice, my discount didn’t apply, and I want to cancel,” the agent averages 12+ tool calls with only 54% success—often investigating issues sequentially and fetching redundant customer data for each. What change most effectively improves handling of complex requests?", "ask": "What change is most effective?", "options": [{"id": "A", "text": "Add explicit verification checkpoints between stages, requiring the agent to record progress after resolving each issue before moving to the next."}, {"id": "B", "text": "Reduce the number of tools by combining `get_customer`, `lookup_order`, and billing-related tools into a single `investigate_issue` tool."}, {"id": "C", "text": "Decompose the request into separate issues, then investigate each in parallel using shared customer context before synthesizing a final resolution."}, {"id": "D", "text": "Add few-shot examples to the system prompt demonstrating ideal tool-call sequences for various multi-faceted billing scenarios."}], "correct": "C", "explanation": "Decomposing into separate issues and investigating in parallel with shared customer context fixes both key problems: it eliminates redundant data retrieval by reusing shared context across issues and reduces total tool-call loops by parallelizing investigation before synthesizing a single resolution."}, {"set": "practice", "n": 49, "scenario": "Customer Support Agent", "situation": "Your agent achieves 55% first-contact resolution, well below the 80% target. Logs show it escalates simple cases (standard replacements for damaged goods with photo proof) while trying to handle complex situations requiring policy exceptions autonomously. What is the most effective way to improve escalation calibration?", "ask": "What is the most effective way to improve escalation calibration?", "options": [{"id": "A", "text": "Require the agent to self-rate confidence on a 1–10 scale before each response and automatically route to humans when confidence drops below a threshold."}, {"id": "B", "text": "Deploy a separate classifier model trained on historical tickets to predict which requests need escalation before the main agent starts processing."}, {"id": "C", "text": "Add explicit escalation criteria to the system prompt with few-shot examples showing when to escalate versus resolve autonomously."}, {"id": "D", "text": "Implement sentiment analysis to determine customer frustration level and automatically escalate past a negative sentiment threshold."}], "correct": "C", "explanation": "Explicit escalation criteria with few-shot examples directly address the root cause—unclear decision boundaries between simple and complex cases. It’s the most proportional, effective first intervention that teaches the agent when to escalate and when to resolve autonomously without extra infrastructure."}, {"set": "practice", "n": 50, "scenario": "Customer Support Agent", "situation": "After calling `get_customer` and `lookup_order`, the agent has all available system data but still faces uncertainty. Which situation is the most justified trigger for calling `escalate_to_human`?", "ask": "Which situation is most justified for escalation?", "options": [{"id": "A", "text": "A customer wants to cancel an order shipped yesterday and arriving tomorrow. The agent should escalate because the customer might change their mind after receiving the package."}, {"id": "B", "text": "A customer claims they didn’t receive an order, but tracking shows it was delivered and signed for at their address three days ago. The agent should escalate because presenting contradictory evidence could harm the customer relationship."}, {"id": "C", "text": "A customer requests competitor price matching. Your policies allow price adjustments for price drops on your own site within 14 days, but say nothing about competitor prices. The agent should escalate for policy interpretation."}, {"id": "D", "text": "A customer message contains both a billing question and a product return. The agent should escalate so a human can coordinate both issues in one interaction."}], "correct": "C", "explanation": "This is a genuine policy gap: company rules cover price drops on your own site but do not address competitor price matching. The agent must not invent policy and should escalate for human judgment on how to interpret or extend existing rules."}, {"set": "practice", "n": 51, "scenario": "Customer Support Agent", "situation": "Production logs show that in 12% of cases your agent skips `get_customer` and calls `lookup_order` directly using only the customer-provided name, sometimes leading to misidentified accounts and incorrect refunds. What change most effectively fixes this reliability problem?", "ask": "What change is most effective?", "options": [{"id": "A", "text": "Add few-shot examples showing that the agent always calls `get_customer` first, even when customers voluntarily provide order details."}, {"id": "B", "text": "Implement a routing classifier that analyzes each request and enables only a subset of tools appropriate for that request type."}, {"id": "C", "text": "Add a programmatic precondition that blocks `lookup_order` and `process_refund` until `get_customer` returns a verified customer identifier."}, {"id": "D", "text": "Strengthen the system prompt stating that customer verification via `get_customer` is mandatory before any order operations."}], "correct": "C", "explanation": "A programmatic precondition provides a deterministic guarantee that required sequencing is followed. It’s the most effective approach because it eliminates the possibility of skipping verification, regardless of LLM behavior."}, {"set": "practice", "n": 52, "scenario": "Customer Support Agent", "situation": "Production metrics show that when resolving complex billing disputes or multi-order returns, customer satisfaction scores are 15% lower than for simple cases—even when the resolution is technically correct. Root-cause analysis shows the agent provides accurate solutions but inconsistently explains rationale: sometimes omitting relevant policy details, sometimes missing timeline info or next steps. The specific context gaps vary case by case. You want to improve solution quality without adding human oversight. What approach is most effective?", "ask": "What approach is most effective?", "options": [{"id": "A", "text": "Add a self-critique stage where the agent evaluates a draft response for completeness—ensuring it resolves the customer’s issue, includes relevant context, and anticipates follow-up questions."}, {"id": "B", "text": "Add a confirmation stage where the agent asks “Does this fully resolve your issue?” before closing, allowing customers to request additional information if needed."}, {"id": "C", "text": "Upgrade the model from Haiku to Sonnet for complex cases, routing based on a defined complexity metric."}, {"id": "D", "text": "Implement few-shot examples in the system prompt showing complete explanations for five common complex case types, demonstrating how to include policy context, timelines, and next steps."}], "correct": "A", "explanation": "A self-critique stage (the evaluator-optimizer pattern) directly addresses inconsistent explanation completeness by forcing the agent to assess its own draft against concrete criteria—such as policy context, timelines, and next steps—before presenting it. This catches case-specific gaps without human oversight."}, {"set": "practice", "n": 53, "scenario": "Customer Support Agent", "situation": "Production metrics show your agent averages 4+ API loops per resolution. Analysis reveals Claude often requests `get_customer` and `lookup_order` in separate sequential turns even when both are needed initially. What is the most effective way to reduce the number of loops?", "ask": "What is the most effective way to reduce loops?", "options": [{"id": "A", "text": "Implement speculative execution that automatically calls likely-needed tools in parallel with any requested tool and returns all results regardless of what was requested."}, {"id": "B", "text": "Increase `max_tokens` to give Claude more room to plan and naturally combine tool requests."}, {"id": "C", "text": "Create composite tools like `get_customer_with_orders` that bundle common lookup combinations into single calls."}, {"id": "D", "text": "Instruct Claude in the prompt to bundle tool requests into one turn and return all results together before the next API call."}], "correct": "D", "explanation": "Prompting Claude to bundle related tool requests into a single turn leverages its native ability to request multiple tools at once. It directly fixes the sequential-call pattern with minimal architectural change."}, {"set": "practice", "n": 54, "scenario": "Customer Support Agent", "situation": "Production logs show a pattern: customers reference specific amounts (e.g., “the 15% discount I mentioned”), but the agent responds with incorrect values. Investigation shows these details were mentioned 20+ turns ago and condensed into vague summaries like “promotional pricing was discussed.” What fix is most effective?", "ask": "What fix is most effective?", "options": [{"id": "A", "text": "Increase the summarization threshold from 70% to 85% so conversations have more room before summarization triggers."}, {"id": "B", "text": "Store full conversation history in external storage and implement retrieval when the agent detects references like “as I mentioned.”"}, {"id": "C", "text": "Extract transactional facts (amounts, dates, order numbers) into a persistent “case facts” block included in every prompt outside the summarized history."}, {"id": "D", "text": "Revise the summarization prompt to explicitly preserve all numbers, percentages, dates, and customer-stated expectations verbatim."}], "correct": "C", "explanation": "Summarization inherently loses precise details. Extracting transactional facts into a structured “case facts” block outside the summarized history preserves critical information so it’s reliably available in every prompt regardless of how many turns have been summarized."}, {"set": "practice", "n": 55, "scenario": "Customer Support Agent", "situation": "Your `get_customer` tool returns all matches when searching by name. Currently, when there are multiple results, Claude picks the customer with the most recent order, but production data shows this selects the wrong account 15% of the time for ambiguous matches. How should you address this?", "ask": "How should you address this?", "options": [{"id": "A", "text": "Implement a confidence scoring system that acts autonomously above 85% confidence and requests clarification below the threshold."}, {"id": "B", "text": "Instruct Claude to request an additional identifier (email, phone, or order number) when `get_customer` returns multiple matches before taking any customer-specific action."}, {"id": "C", "text": "Modify `get_customer` to return only a single most-likely match based on a ranking algorithm, eliminating ambiguity."}, {"id": "D", "text": "Add few-shot examples to the prompt demonstrating correct reasoning and tool sequencing for ambiguous matches."}], "correct": "B", "explanation": "Asking the user for an additional identifier is the most reliable way to resolve ambiguity because the user has definitive knowledge of their identity. One extra conversational turn is a small price to pay to eliminate a 15% error rate caused by choosing the wrong account."}, {"set": "practice", "n": 56, "scenario": "Customer Support Agent", "situation": "Production logs show a consistent pattern: when customers include the word “account” in their message (e.g., “I want to check my account for an order I made yesterday”), the agent calls `get_customer` first 78% of the time. When customers phrase similar requests without “account” (e.g., “I want to check an order I made yesterday”), it calls `lookup_order` first 93% of the time. Tool descriptions are clear and unambiguous. What is the most likely root cause of this discrepancy?", "ask": "What is the most likely root cause?", "options": [{"id": "A", "text": "The system prompt contains keyword-sensitive instructions that steer behavior based on terms like “account,” creating unintended tool-selection patterns."}, {"id": "B", "text": "The model’s base training creates associations between “account” terminology and customer-related operations that override tool descriptions."}, {"id": "C", "text": "The model needs more training data on multi-concept messages and should be fine-tuned on examples containing both account and order terminology."}, {"id": "D", "text": "Tool descriptions need additional negative examples specifying when NOT to use each tool to prevent this keyword-induced confusion."}], "correct": "A", "explanation": "The systematic keyword-driven pattern (78% vs 93%) strongly indicates explicit routing logic in the system prompt reacting to the word “account” and steering the agent toward customer-related tools. Since tool descriptions are already clear, the discrepancy points to prompt-level instructions creating unintended behavioral steering."}, {"set": "practice", "n": 57, "scenario": "Customer Support Agent", "situation": "Production logs show the agent often calls `get_customer` when users ask about orders (e.g., “check my order #12345”) instead of calling `lookup_order`. Both tools have minimal descriptions (“Gets customer information” / “Gets order details”) and accept similar-looking identifier formats. What is the most effective first step to improve tool selection reliability?", "ask": "What is the most effective first step?", "options": [{"id": "A", "text": "Implement a routing layer that analyzes user input before each turn and preselects the correct tool based on detected keywords and ID patterns."}, {"id": "B", "text": "Combine both tools into a single `lookup_entity` that accepts any identifier and internally decides which backend to query."}, {"id": "C", "text": "Add few-shot examples to the system prompt demonstrating correct tool selection patterns, with 5–8 examples routing order-related queries to `lookup_order`."}, {"id": "D", "text": "Expand each tool’s description to include input formats, example queries, edge cases, and boundaries explaining when to use it versus similar tools."}], "correct": "D", "explanation": "Expanding tool descriptions with input formats, example queries, edge cases, and clear boundaries directly fixes the root cause—minimal descriptions that don’t give the LLM enough information to distinguish similar tools. It’s a low-effort, high-impact first step that improves the primary mechanism the LLM uses for tool selection."}, {"set": "practice", "n": 58, "scenario": "Customer Support Agent", "situation": "You are implementing the agent loop for your support agent. After each Claude API call, you must decide whether to continue the loop (run requested tools and call Claude again) or stop (present the final answer to the customer). What determines this decision?", "ask": "What determines this decision?", "options": [{"id": "A", "text": "Check the `stop_reason` field in Claude’s response—continue if it is `tool_use` and stop if it is `end_turn`."}, {"id": "B", "text": "Parse Claude’s text for phrases like “I’m done” or “Can I help with anything else?”—natural language signals indicate task completion."}, {"id": "C", "text": "Set a maximum iteration count (e.g., 10 calls) and stop when reached, regardless of whether Claude indicates more work is needed."}, {"id": "D", "text": "Check whether the response contains assistant text content—if Claude generated explanatory text, the loop should terminate."}], "correct": "A", "explanation": "`stop_reason` is Claude’s explicit structured signal for loop control: `tool_use` indicates Claude wants to run a tool and receive results back, while `end_turn` indicates Claude has completed its response and the loop should end."}, {"set": "practice", "n": 59, "scenario": "Customer Support Agent", "situation": "Production logs show the agent misinterprets outputs from your MCP tools: Unix timestamps from `get_customer`, ISO 8601 dates from `lookup_order`, and numeric status codes (1=pending, 2=shipped). Some tools are third-party MCP servers you cannot modify. Which approach to data format normalization is most maintainable?", "ask": "Which approach is most maintainable?", "options": [{"id": "A", "text": "Use a PostToolUse hook to intercept tool outputs and apply formatting transformations before the agent processes them."}, {"id": "B", "text": "Modify tools you control to return human-readable formats and create wrappers for third-party tools."}, {"id": "C", "text": "Create a `normalize_data` tool that the agent calls after every data retrieval to transform values."}, {"id": "D", "text": "Add detailed format documentation to the system prompt explaining each tool’s data conventions."}], "correct": "A", "explanation": "A PostToolUse hook provides a centralized, deterministic point to intercept and normalize all tool outputs—including third-party MCP server data—before the agent processes them. It’s more maintainable because transformations live in code and apply uniformly, rather than relying on LLM interpretation."}, {"set": "practice", "n": 60, "scenario": "Customer Support Agent", "situation": "Production logs show the agent sometimes chooses `get_customer` when `lookup_order` would be more appropriate, especially for ambiguous queries like “I need help with my recent purchase.” You decide to add few-shot examples to the system prompt to improve tool selection. Which approach most effectively addresses the problem?", "ask": "Which approach is most effective?", "options": [{"id": "A", "text": "Add explicit “use when” and “don’t use when” guidance in each tool description covering ambiguous cases."}, {"id": "B", "text": "Add examples grouped by tool—all `get_customer` scenarios together, then all `lookup_order` scenarios."}, {"id": "C", "text": "Add 4–6 examples targeted at ambiguous scenarios, each with rationale for why one tool was chosen over plausible alternatives."}, {"id": "D", "text": "Add 10–15 examples of clear, unambiguous requests demonstrating correct tool choice for typical scenarios for each tool."}], "correct": "C", "explanation": "Targeting few-shot examples at the specific ambiguous scenarios where errors occur, with explicit rationale for why one tool is preferable to alternatives, teaches the model the comparative decision process needed for edge cases. This is more effective than generic examples or declarative rules."}, {"set": "practice", "n": 61, "scenario": "Conversational AI Architecture Patterns", "situation": "Your `remove_team_member` tool uses a `dry_run: boolean` parameter for previewing impacts before execution. Production monitoring shows the agent bypasses the preview step by calling with `dry_run=false` directly. You need to ensure every removal is preceded by a preview that the user explicitly confirms.", "ask": "What is the most reliable approach?", "options": [{"id": "A", "text": "Add server-side validation that permits `dry_run=false` only when a `dry_run=true` call with identical parameters occurred within the past 60 seconds."}, {"id": "B", "text": "Annotate the tool as requiring confirmation and configure the orchestration layer to prompt the user for approval before forwarding any calls to annotated tools."}, {"id": "C", "text": "Add detailed instructions and few-shot examples to the tool description requiring the agent to always call with `dry_run=true` first and wait for user confirmation before calling again."}, {"id": "D", "text": "Replace with two tools: `preview_remove_member` returns impact details and a single-use confirmation token; `execute_remove_member` requires that token, binding execution to the preview."}], "correct": "D", "explanation": "The two-tool token-binding approach makes it architecturally impossible to execute without a prior preview—the execute tool literally requires a token that only the preview tool can generate. This is the only approach that enforces the constraint at the code level rather than relying on LLM compliance with instructions (C), timing heuristics (A), or orchestration infrastructure (B)."}, {"set": "practice", "n": 62, "scenario": "Conversational AI Architecture Patterns", "situation": "Production monitoring shows your `search_catalog` tool fails 12% of the time: 8% are network timeouts that succeed when retried, and 4% are query syntax errors that never succeed regardless of retries. Currently both error types are returned identically, causing wasted retries.", "ask": "How should you modify the tool's error handling?", "options": [{"id": "A", "text": "Add few-shot examples to your system prompt demonstrating how to distinguish network errors from syntax errors."}, {"id": "B", "text": "Apply exponential backoff retry logic to all errors uniformly."}, {"id": "C", "text": "Implement automatic retry with backoff for network timeouts inside the tool; return syntax errors immediately with parameter validation details."}, {"id": "D", "text": "Return all errors with a `retryable` boolean flag and error type details."}], "correct": "C", "explanation": "Handling retries at the tool level for transient errors is the correct abstraction boundary—the tool has definitive knowledge of the error type and can implement deterministic retry logic without relying on the agent to interpret a flag (D) or follow prompt-level instructions (A). Uniform backoff (B) wastes time on syntax errors that will never succeed."}, {"set": "practice", "n": 63, "scenario": "Conversational AI Architecture Patterns", "situation": "Over several turns discussing investment strategy, a user stated \"I have a very low risk tolerance\" and later \"I want to maximize my returns.\" They now ask: \"What should I invest in?\"", "ask": "Which approach best ensures the recommendation aligns with the user's actual priority?", "options": [{"id": "A", "text": "Surface the contradiction and ask the user to clarify which matters more."}, {"id": "B", "text": "Provide separate recommendations for both scenarios."}, {"id": "C", "text": "Proceed with the most recently stated preference."}, {"id": "D", "text": "Recommend a balanced portfolio without addressing the conflict."}], "correct": "A", "explanation": "When user preferences directly contradict each other, surfacing the conflict and asking for clarification is the only way to guarantee the recommendation aligns with the user's true intent. Any other approach involves making an assumption that may be wrong—maximizing returns and low risk tolerance are fundamentally incompatible goals that require a human decision."}, {"set": "practice", "n": 64, "scenario": "Conversational AI Architecture Patterns", "situation": "Users refine playlist preferences over multiple conversation turns. Two messages after a user said \"I love jazz,\" Claude asks \"What genres do you enjoy?\"", "ask": "What is the most likely cause?", "options": [{"id": "A", "text": "Claude requires a vector database connection to maintain conversation memory."}, {"id": "B", "text": "The model's context window has been exceeded."}, {"id": "C", "text": "The Claude API requires a `session_id` parameter."}, {"id": "D", "text": "Your application isn't including prior messages in the `messages` array."}], "correct": "D", "explanation": "Claude has no server-side memory—every API call is stateless. Without including the full conversation history in the `messages` array of each request, Claude has no knowledge of prior turns. Vector databases (A) and `session_id` (C) are not part of Claude's architecture; context window overflow (B) is impossible for two-message exchanges."}, {"set": "practice", "n": 65, "scenario": "Conversational AI Architecture Patterns", "situation": "After a 40-minute cooking session, the conversation reaches 78,000 tokens. History includes allergies, recipe scaling, clarified cooking terms, and general discussion. You must reduce tokens while preserving important information.", "ask": "What approach best balances preservation with token reduction?", "options": [{"id": "A", "text": "Summarize the entire conversation history."}, {"id": "B", "text": "Keep only the most recent 20,000 tokens."}, {"id": "C", "text": "Extract critical structured data (allergies, quantities, preferences), summarize general discussion, and keep recent exchanges verbatim."}, {"id": "D", "text": "Store the full conversation externally and retrieve relevant parts via semantic search."}], "correct": "C", "explanation": "The hybrid approach preserves the highest-value information at the lowest cost. Critical facts like allergies and recipe quantities are extracted into a compact structured block (preventing the precision loss that occurs during summarization), general discussion is summarized, and recent exchanges are kept verbatim for conversational coherence. Options A and B risk losing critical dietary information; D is architectural overkill for a single cooking session."}, {"set": "practice", "n": 66, "scenario": "Conversational AI Architecture Patterns", "situation": "Users report that during extended conversations the assistant loses track of earlier topics and preferences. Your current implementation keeps only the last 25 message pairs.", "ask": "What is the most effective solution?", "options": [{"id": "A", "text": "Hybrid approach: summarize older messages while keeping recent ones verbatim."}, {"id": "B", "text": "Vector similarity search over the full conversation history."}, {"id": "C", "text": "Increase the window to 50 message pairs."}, {"id": "D", "text": "Summarize dropped messages every turn and prepend the running summary."}], "correct": "A", "explanation": "The hybrid approach addresses both dimensions of the problem: retaining exact recent context (critical for conversational coherence) while maintaining a compressed representation of earlier preferences (preventing total loss when pairs are dropped). Increasing the window (C) simply delays the same problem. Vector search (B) may miss important context that isn't semantically similar to the current query. Full per-turn summarization (D) adds overhead and accumulates summarization errors."}, {"set": "practice", "n": 67, "scenario": "Conversational AI Architecture Patterns", "situation": "Users report that latency increases and costs rise when conversations exceed 50 turns.", "ask": "What is the primary cause?", "options": [{"id": "A", "text": "The entire conversation history is included with each API request."}, {"id": "B", "text": "The model generates progressively longer responses."}, {"id": "C", "text": "Database operations slow down as history grows."}, {"id": "D", "text": "The model builds an internal user profile requiring more processing."}], "correct": "A", "explanation": "Claude's API is fully stateless—every request must include the complete conversation history in the `messages` array. As conversations grow, each request carries more tokens, which directly increases both processing latency and cost. The model does not maintain any internal state between calls (D is false), and response length is not inherently tied to conversation length (B)."}, {"set": "practice", "n": 68, "scenario": "Conversational AI Architecture Patterns", "situation": "After three months of weekly sessions, conversation history grows to 85,000 tokens. When a user asks \"What did we conclude about the theme of isolation?\", the assistant gives generic answers instead of referencing previous discussions.", "ask": "What is the most effective approach?", "options": [{"id": "A", "text": "Rolling window truncation."}, {"id": "B", "text": "Progressive summarization capturing key conclusions."}, {"id": "C", "text": "Semantic embeddings with retrieval of relevant exchanges."}, {"id": "D", "text": "Add structured XML tags marking discussion conclusions."}], "correct": "C", "explanation": "Semantic search over conversation history is the only approach that scales to three months of discussion while being able to surface specific relevant exchanges on demand. Rolling window (A) would discard most of the history. Progressive summarization (B) compresses discussions into abstractions that lose the specific conclusions users are asking about. XML tags (D) require restructuring all past content and don't solve the retrieval problem at this scale."}, {"set": "practice", "n": 69, "scenario": "Conversational AI Architecture Patterns", "situation": "During QA testing, Claude follows system prompt guidelines for the first 10–15 turns, but later responses deviate. The conversation is still within token limits.", "ask": "What is the best solution?", "options": [{"id": "A", "text": "Move behavioral guidelines into the first user message."}, {"id": "B", "text": "Start a new conversation after 20 turns."}, {"id": "C", "text": "Insert user-role messages reinforcing guidelines at conversation breakpoints."}, {"id": "D", "text": "Use post-response validation to regenerate non-compliant responses."}], "correct": "C", "explanation": "Periodic injection of behavioral reminders directly combats instruction drift by re-establishing constraints at regular intervals as conversation history accumulates. Moving guidelines to the first user message (A) reduces their authority. Starting a new conversation (B) destroys context. Post-response validation (D) is corrective rather than preventive and adds significant latency."}, {"set": "practice", "n": 70, "scenario": "Conversational AI Architecture Patterns", "situation": "Your AI tutor has a 2,800-token system prompt defining teaching methodology and adaptation rules. After 12 turns, the assistant starts ignoring proficiency levels.", "ask": "What is the most effective fix?", "options": [{"id": "A", "text": "Inject reminders every 4–5 turns."}, {"id": "B", "text": "Replace verbose rules with few-shot examples demonstrating proficiency-level adaptation."}, {"id": "C", "text": "Place critical rules at the end of the system prompt."}, {"id": "D", "text": "Evaluate responses and regenerate if difficulty level mismatches."}], "correct": "B", "explanation": "A 2,800-token system prompt with declarative rules is vulnerable to drift because abstract rules require the model to reason about them on every turn. Replacing verbose rules with concrete few-shot examples that demonstrate correct proficiency-level adaptation gives the model clear behavioral patterns to match—this is more reliably followed across many turns than abstract instructions. Reminder injection (A) helps but addresses symptoms; end-placement (C) helps initially but not with turn-level drift; regeneration (D) is expensive and corrective."}, {"set": "practice", "n": 71, "scenario": "Conversational AI Architecture Patterns", "situation": "Your assistant must maintain an enthusiastic tone, explain its reasoning, and ask clarifying questions. Where should these behavioral guidelines be defined?", "ask": "Where should these behavioral guidelines be defined?", "options": [{"id": "A", "text": "Prepended to each user message."}, {"id": "B", "text": "In the system prompt."}, {"id": "C", "text": "In the first assistant message."}, {"id": "D", "text": "In environment variables."}], "correct": "B", "explanation": "The system prompt is specifically designed for persistent behavioral constraints and guidelines that apply throughout the entire conversation. Prepending to each user message (A) is redundant overhead. The first assistant message (C) is unreliable because the model can deviate from its own prior statements. Environment variables (D) have no effect on model behavior."}, {"set": "practice", "n": 72, "scenario": "Conversational AI Architecture Patterns", "situation": "Users report repetitive response openings like \"Certainly!\" and \"I'd be happy to help!\"", "ask": "What is the most effective approach?", "options": [{"id": "A", "text": "Append a partial assistant message with a direct response opening."}, {"id": "B", "text": "Lower the temperature setting."}, {"id": "C", "text": "Post-process responses to remove greetings."}, {"id": "D", "text": "Add system prompt instructions to avoid those phrases."}], "correct": "A", "explanation": "Prefilling the assistant's response with the beginning of a direct answer prevents greeting patterns at the generation level—the model continues from the prefill rather than generating new opening phrases. System prompt instructions (D) can help but are less reliable since the model may still produce variants. Post-processing (C) is a fragile workaround. Temperature (B) controls randomness, not specific phrase patterns."}, {"set": "practice", "n": 73, "scenario": "Conversational AI Architecture Patterns", "situation": "A webhook notifies your system that a user's package has shipped while the user is actively chatting. You want the assistant to incorporate this naturally into the next response.", "ask": "What is the best approach?", "options": [{"id": "A", "text": "Add shipping status to the system prompt."}, {"id": "B", "text": "Send an immediate synthetic user message."}, {"id": "C", "text": "Force the assistant to call a status tool on each turn."}, {"id": "D", "text": "Append the status update as a prefix to the next user message."}], "correct": "D", "explanation": "Prefixing the status update to the next user message injects real-time context at a natural conversation boundary without disrupting the flow. Modifying the system prompt (A) requires rebuilding the session or is architecturally cumbersome. A synthetic user message (B) can break the natural dialogue flow and confuse attribution. Forcing a tool call each turn (C) is wasteful when events are rare."}, {"set": "practice", "n": 74, "scenario": "Conversational AI Architecture Patterns", "situation": "Users frequently send requests like \"Book a venue for the party.\" The assistant asks 4+ clarifying questions, causing 35% abandonment.", "ask": "What approach best improves the trade-off?", "options": [{"id": "A", "text": "Proceed with hidden defaults."}, {"id": "B", "text": "Ask all clarifying questions in one compound message."}, {"id": "C", "text": "State assumptions explicitly and proceed while inviting corrections."}, {"id": "D", "text": "Use a structured intake form."}], "correct": "C", "explanation": "Stating assumptions explicitly and proceeding gives the user an immediate, useful response while preserving their ability to correct wrong assumptions. Hidden defaults (A) leave the user unaware of what was assumed. A compound question list (B) still demands upfront effort from the user. A structured form (D) adds more friction, not less—contradicting the goal of reducing abandonment."}, {"set": "practice", "n": 75, "scenario": "Conversational AI Architecture Patterns", "situation": "Your assistant uses a contractor-persona system prompt. Early turns follow the rules, but by turn 7 the assistant gives generic advice. Conversation length is only 2,500 tokens.", "ask": "What is the most likely cause?", "options": [{"id": "A", "text": "System prompts only establish initial behavior."}, {"id": "B", "text": "Model attention weakens as turns accumulate."}, {"id": "C", "text": "Accumulated assistant responses dilute system prompt influence."}, {"id": "D", "text": "The system prompt is only sent once."}], "correct": "C", "explanation": "As assistant responses accumulate in the conversation history, the proportion of text reflecting the system prompt's behavioral constraints decreases relative to the growing body of assistant-generated content. The model increasingly pattern-matches to its own prior outputs rather than the system prompt, compounding drift even at short token lengths. The system prompt is included in every API call (D is false as a standalone explanation), and model attention degradation (B) doesn't operate at 2,500 tokens."}, {"set": "practice", "n": 76, "scenario": "Conversational AI Architecture Patterns", "situation": "Users ask vague requests like \"Can you help with the report?\" The assistant responds by asking multiple questions (which report? what help? deadline?), causing 40% abandonment.", "ask": "What is the best solution?", "options": [{"id": "A", "text": "Make reasonable assumptions, state them explicitly, and offer to adjust."}, {"id": "B", "text": "Classify ambiguity with a smaller model before responding."}, {"id": "C", "text": "Use predefined interpretations without stating assumptions."}, {"id": "D", "text": "Limit the assistant to one clarifying question per turn."}], "correct": "A", "explanation": "Proceeding with reasonable stated assumptions eliminates the back-and-forth entirely while keeping the user informed and in control. Predefined silent interpretations (C) leave users confused when the response doesn't match their intent. A single-question limit (D) still requires turns of back-and-forth. A smaller classification model (B) adds latency and infrastructure complexity without solving the core UX problem."}], "domains": [{"n": 1, "title": "Agent Architecture and Orchestration", "weight": 27, "tasks": [{"id": "1.1", "title": "Designing Agentic Loops for Autonomous Task Execution", "knowledge": ["Agent loop lifecycle: send a Claude request, check `stop_reason` (`\"tool_use\"` vs `\"end_turn\"`), execute tools, return results for the next iteration", "Tool results are appended to the conversation history so the model can decide the next action", "Model-driven decision making (Claude chooses the next tool) vs hard-coded decision trees"], "skills": ["Flow control: continue the loop when `stop_reason = \"tool_use\"` and stop on `\"end_turn\"`", "Appending tool results to context between iterations", "Anti-patterns to avoid: parsing assistant text for completion, using arbitrary iteration limits as the primary stopping mechanism"]}, {"id": "1.2", "title": "Orchestrating Multi-agent Systems (Coordinator–Subagent)", "knowledge": ["Hub-and-spoke architecture: the coordinator owns all inter-agent communication, error handling, and routing", "Subagents operate with isolated context—they do not automatically inherit the coordinator’s history", "Coordinator responsibilities: task decomposition, delegation, result aggregation, dynamic selection of subagents", "Risk of overly narrow decomposition by the coordinator"], "skills": ["Split research coverage among subagents to minimize duplication", "Implement iterative refinement loops (coordinator evaluates synthesis and re-routes tasks)", "Route all communication through the coordinator for observability"]}, {"id": "1.3", "title": "Configuring Subagent Calls, Context Passing, and Spawning", "knowledge": ["`Task` tool spawns subagents; the coordinator’s `allowedTools` must include `\"Task\"`", "Subagent context must be explicitly included in the prompt; subagents do not inherit parent context", "`AgentDefinition` configuration: descriptions, system prompts, tool constraints", "Session management via `fork_session` for exploring alternatives"], "skills": ["Include full outputs from prior agents in the subagent prompt", "Use structured formats to separate data from metadata when passing context", "Spawn parallel subagents via multiple `Task` calls in a single coordinator turn", "Write coordinator prompts in terms of goals and quality criteria rather than step-by-step instructions"]}, {"id": "1.4", "title": "Implementing Multi-step Workflows with Enforcement and Handoff Patterns", "knowledge": ["The difference between **programmatic enforcement** (hooks, preconditions) and **prompt guidance** for ordering a workflow", "When you need deterministic guarantees (e.g., identity verification before financial operations), prompts alone are insufficient", "Structured handoff protocols during escalation (customer ID, reason, recommended action)"], "skills": ["Programmatic preconditions that block downstream calls until prior steps are complete (e.g., block `process_refund` until `get_customer` returns a verified ID)", "Decompose multi-aspect customer requests into separate items", "Produce structured summaries when escalating to a human"]}, {"id": "1.5", "title": "Agent SDK Hooks for Intercepting Tool Calls and Normalizing Data", "knowledge": ["Hook patterns (e.g., `PostToolUse`) to intercept tool results before the model consumes them", "Hooks that intercept outgoing calls to enforce compliance rules (e.g., block refunds above a threshold)", "Hooks provide **deterministic guarantees** vs prompt instructions that provide **probabilistic compliance**"], "skills": ["`PostToolUse` hooks for normalizing data formats (Unix timestamps, ISO 8601, numeric status codes)", "Interception hooks to block policy-violating actions with redirection to escalation", "Choose hooks over prompts when business rules require guaranteed compliance"]}, {"id": "1.6", "title": "Task Decomposition Strategies for Complex Workflows", "knowledge": ["**Fixed pipelines** (prompt chaining) vs **dynamic adaptive decomposition** based on intermediate results", "Prompt chaining: sequential steps (analyze each file separately, then run an integration pass)", "Adaptive investigation plans that generate subtasks based on what was discovered"], "skills": ["Use prompt chaining for predictable multi-aspect reviews; use dynamic decomposition for open-ended investigations", "Split large code reviews into per-file analysis plus a separate cross-file integration pass", "Decompose open-ended tasks: map structure first, then build a prioritized plan"]}, {"id": "1.7", "title": "Session State, Resuming, and Forking", "knowledge": ["`--resume <session-name>` to continue named sessions", "`fork_session` to create independent investigation branches from shared context", "The importance of informing the agent about file changes when resuming sessions", "A new session with a structured summary can be more reliable than resuming with stale results"], "skills": ["Use `--resume` to continue named investigation sessions", "Use `fork_session` to compare approaches in parallel", "Choose between resuming (context still current) vs starting a new session (results stale)"]}]}, {"n": 2, "title": "Tool Design and MCP Integration", "weight": 18, "tasks": [{"id": "2.1", "title": "Designing Tool Interfaces with Clear Descriptions", "knowledge": ["Tool descriptions are the **primary mechanism** an LLM uses to select tools; minimal descriptions lead to unreliable selection", "The importance of including input formats, example queries, edge cases, and applicability boundaries", "Ambiguous or overlapping descriptions cause misrouting", "System prompt wording can create unintended associations with tools"], "skills": ["Write descriptions that clearly distinguish each tool from similar alternatives", "Rename tools to eliminate functional overlap (e.g., `analyze_content` -> `extract_web_results`)", "Split general-purpose tools into specialized ones with clear input/output contracts"]}, {"id": "2.2", "title": "Implementing Structured Error Responses for MCP Tools", "knowledge": ["The `isError` flag in MCP tool responses", "The difference between **transient errors** (timeouts), **validation errors** (bad input), **business errors** (policy violations), and **access/permission errors**", "Generic errors (\"Operation failed\") prevent correct recovery decisions", "The difference between retryable and non-retryable errors"], "skills": ["Return structured metadata such as `errorCategory` (transient/validation/permission), `isRetryable`, and a human-readable message", "Use `retryable: false` for business-rule violations with clear user-facing explanations", "Do local recovery inside subagents for transient failures; propagate only errors they cannot resolve", "Distinguish access failures (retry decision) from valid empty results (no matches)"]}, {"id": "2.3", "title": "Allocating Tools Across Agents and Configuring `tool_choice`", "knowledge": ["Too many tools per agent (e.g., 18 instead of 4–5) **reduces** tool selection reliability", "Agents with tools outside their specialization tend to misuse them", "Scoped tool access: only role-relevant tools plus a limited set of cross-role utilities", "`tool_choice`: `\"auto\"`, `\"any\"`, and forced tool selection (`{\"type\": \"tool\", \"name\": \"...\"}`)"], "skills": ["Restrict each subagent’s toolset to what is relevant for its role", "Replace general tools with constrained alternatives (e.g., `fetch_url` -> `load_document`)", "Use `tool_choice: \"any\"` to guarantee a tool call instead of a text answer", "Force a specific tool to ensure execution order"]}, {"id": "2.4", "title": "Integrating MCP Servers into Claude Code and Agent Workflows", "knowledge": ["MCP server scope: project (`.mcp.json`) for teams vs user (`~/.claude.json`) for experiments", "Environment variable substitution in `.mcp.json` (e.g., `${GITHUB_TOKEN}`) for secret management", "Tools from all connected MCP servers are discovered on connection and are available simultaneously", "MCP resources as “content catalogs” (task summaries, database schemas) to reduce exploratory tool calls"], "skills": ["Configure shared MCP servers in project `.mcp.json` with env-var-based tokens", "Keep personal/experimental servers in `~/.claude.json`", "Prefer community MCP servers over custom servers for standard integrations"]}, {"id": "2.5", "title": "Selecting and Applying Built-in Tools (Read, Write, Edit, Bash, Grep, Glob)", "knowledge": ["**Grep**: search within file contents (function names, error messages, imports)", "**Glob**: find files by name/extension patterns", "**Read/Write**: full-file operations; **Edit**: precise changes via unique text matches", "If Edit fails due to non-unique matches, fall back to Read + Write"], "skills": ["Use Grep for content search and Glob for file discovery by patterns", "Build understanding incrementally: Grep entry points, then Read to trace flows", "Trace function usage through wrapper modules"]}]}, {"n": 3, "title": "Claude Code Configuration and Workflows", "weight": 20, "tasks": [{"id": "3.1", "title": "Configuring CLAUDE.md with Hierarchy, Scope, and Modular Organization", "knowledge": ["CLAUDE.md hierarchy: user (`~/.claude/CLAUDE.md`), project (`.claude/CLAUDE.md` or root `CLAUDE.md`), and directory-level (CLAUDE.md in subdirectories)", "User-level settings apply only to one user and are not shared via VCS", "`@path` syntax for referencing external files (e.g., `@./standards/coding-style.md`) to modularize CLAUDE.md", "The `.claude/rules/` directory for topic-focused rule files instead of a monolithic CLAUDE.md"], "skills": ["Diagnose hierarchy issues (a new team member misses instructions because they are user-level instead of project-level)", "Use `@path` (e.g., `@./standards/testing.md`) to selectively include standards in each package’s CLAUDE.md", "Split large CLAUDE.md into multiple `.claude/rules/` files (testing.md, api-conventions.md, deployment.md)"]}, {"id": "3.2", "title": "Creating and Configuring Custom Slash Commands and Skills", "knowledge": ["**Project commands** in `.claude/commands/` (shared via VCS) vs **user commands** in `~/.claude/commands/`", "Skills in `.claude/skills/` with `SKILL.md` frontmatter: `context: fork`, `allowed-tools`, `argument-hint`", "`context: fork` runs the skill in an isolated subagent context so it does not pollute the main session", "Personal skill variants can live in `~/.claude/skills/` under different names"], "skills": ["Store project slash commands in `.claude/commands/` so the whole team gets them", "Use `context: fork` to isolate skills with verbose output", "Use `allowed-tools` to restrict what tools a skill can use", "Use `argument-hint` to prompt developers for required parameters"]}, {"id": "3.3", "title": "Using Path-specific Rules for Conditional Convention Loading", "knowledge": ["`.claude/rules/` files can include YAML frontmatter `paths` to activate rules based on glob patterns", "Path-scoped rules load **only** when editing matching files, saving context and tokens", "Glob-based path rules can be preferable to directory-level CLAUDE.md when conventions apply across many directories (e.g., tests)"], "skills": ["Create `.claude/rules/` files with `paths: [\"terraform/**/*\"]` to load only when working on matching files", "Use glob patterns (`**/*.test.tsx`) to apply conventions by file type regardless of location", "Prefer path-specific rules over directory-level CLAUDE.md when conventions span the codebase"]}, {"id": "3.4", "title": "Deciding When to Use Planning Mode vs Direct Execution", "knowledge": ["**Planning mode**: for complex tasks with large changes, multiple viable approaches, and architectural decisions", "**Direct execution**: for simple, well-understood changes (e.g., adding a single validation)", "Planning mode enables safe exploration of the codebase before making changes", "Explore subagent isolates verbose discovery output"], "skills": ["Use planning mode for tasks with architectural consequences (microservices, migrations touching 45+ files)", "Use direct execution for fixes with a clear stack trace and a single file", "Use Explore subagent to prevent context-window exhaustion in multi-phase tasks", "Combine approaches: plan for discovery, then execute for implementation"]}, {"id": "3.5", "title": "Iterative Refinement for Progressive Improvement", "knowledge": ["Concrete input/output examples are the most effective way to communicate expectations", "**Test-driven iteration**: write tests first, then iterate based on failures", "The “interview” pattern: Claude asks questions to surface non-obvious design considerations", "When to provide all issues in one message (interdependent) vs sequentially (independent)"], "skills": ["Provide 2–3 concrete input/output examples to clarify transformation requirements", "Build test sets with expected behavior, edge cases, and performance requirements before implementation", "Use the interview pattern to surface design aspects (cache invalidation, failure modes)", "Provide concrete test cases with sample inputs and expected outputs for edge cases"]}, {"id": "3.6", "title": "Integrating Claude Code into CI/CD Pipelines", "knowledge": ["The `-p` (or `--print`) flag for non-interactive mode in automated pipelines", "`--output-format json` and `--json-schema` for structured output in CI", "CLAUDE.md provides project context (testing standards, review criteria) for CI-triggered Claude Code", "**Session context isolation**: the same session that generated code is less effective at reviewing it than an independent instance"], "skills": ["Run Claude Code in CI with `-p` to avoid hanging on interactive input", "Use `--output-format json` + `--json-schema` for structured results (e.g., inline PR comments)", "Include prior review results when re-running after new commits (report only new/unfixed issues)", "Document testing standards and available fixtures in CLAUDE.md to improve test generation quality", "Include existing test files in context when generating new tests to avoid duplication and keep style consistent"]}]}, {"n": 4, "title": "Prompt Engineering and Structured Output", "weight": 20, "tasks": [{"id": "4.1", "title": "Designing Prompts with Explicit Criteria to Improve Accuracy", "knowledge": ["Explicit criteria are more effective than vague instructions (e.g., “flag comments only when they contradict code” vs “check comment accuracy”)", "Generic guidance like “be more conservative” works worse than concrete categorical criteria", "The effect of false positives on developer trust: high false-positive rates in some categories undermine trust in accurate categories"], "skills": ["Define review criteria: what to report (bugs, security) vs what to ignore (minor style)", "Temporarily disable categories with high false-positive rates", "Define explicit severity criteria with code examples for each level"]}, {"id": "4.2", "title": "Using Few-shot Prompting to Improve Output Consistency", "knowledge": ["Few-shot examples are the most effective method for producing consistently formatted, actionable output", "Few-shot can demonstrate handling of ambiguous cases (tool selection, gaps in test coverage)", "Few-shot helps the model generalize to new patterns rather than just repeating defaults", "Few-shot can reduce hallucinations in extraction tasks"], "skills": ["Provide 2–4 targeted examples for ambiguous scenarios with rationale", "Include few-shot examples that demonstrate the output format (location, issue, severity, suggested fix)", "Provide examples that distinguish acceptable code patterns from real issues", "Provide examples of correct extraction from documents with different structures"]}, {"id": "4.3", "title": "Enforcing Structured Output with `tool_use` and JSON Schemas", "knowledge": ["`tool_use` with JSON Schemas is the most reliable way to guarantee schema-conformant output and eliminate JSON syntax errors", "With `tool_choice: \"auto\"` the model can return text; with `\"any\"` it must call a tool; forced selection chooses a specific tool", "Strict JSON Schemas eliminate syntax errors but do not prevent semantic errors (totals don’t add up; values in wrong fields)", "Schema design: required vs optional fields; enums with “other” plus a detail string for extensibility"], "skills": ["Define extraction tools with JSON Schemas and parse data from `tool_use` results", "Use `tool_choice: \"any\"` to guarantee structured output when multiple schemas exist", "Force a specific tool call: `tool_choice: {\"type\": \"tool\", \"name\": \"extract_metadata\"}`", "Make fields optional/nullable when the source may not contain information to avoid fabricating values", "Use enum values like `\"unclear\"` and `\"other\"` plus detail fields for extensible categorization"]}, {"id": "4.4", "title": "Implementing Validation, Retries, and Feedback Loops for Extraction Quality", "knowledge": ["Retry-with-error-feedback: include concrete validation errors in the retry prompt to guide corrections", "Retries are ineffective when the information is simply absent from the source", "Feedback loop design: track the pattern that triggered a finding (`detected_pattern`)", "Semantic errors (totals don’t reconcile) vs syntax errors (addressed by `tool_use`)"], "skills": ["Follow-up prompts with the original document, an incorrect extraction, and specific validation errors", "Identify when retry will be ineffective (the required info is only in an external document)", "Include `detected_pattern` fields in findings to analyze false positives", "Design self-correction by extracting both `calculated_total` and `stated_total` to detect discrepancies"]}, {"id": "4.5", "title": "Designing Efficient Batch Processing Strategies", "knowledge": ["Message Batches API: 50% savings, up to 24-hour processing window, no latency SLA guarantees", "Batch processing is suitable for non-blocking tasks (overnight reports, audits) and not suitable for blocking tasks (pre-merge checks)", "Batch API does not support multi-turn tool calling within a single request", "`custom_id` fields correlate request/response within batches"], "skills": ["Use synchronous API for blocking checks; use Batch API for overnight/weekly workloads", "Plan batch submission cadence based on SLA needs (e.g., 4-hour windows for a 30-hour guarantee with 24-hour processing)", "Handle failures by re-submitting only failed documents (identified by `custom_id`)", "Iterate on prompts using a sample before running large-scale processing"]}, {"id": "4.6", "title": "Designing Multi-instance and Multi-pass Review Architectures", "knowledge": ["Self-review limitations: the model retains its reasoning context and is less likely to challenge its own decisions", "Independent review instances (without generation context) are better at finding subtle issues", "Multi-pass review: per-file local analysis plus a cross-file integration pass to avoid attention dilution"], "skills": ["Use a second independent Claude instance to review changes without generation context", "Split multi-file reviews into per-file passes plus integration passes for cross-file dataflow analysis", "Use verification passes with self-rated confidence to route reviews in a calibrated way"]}]}, {"n": 5, "title": "Context Management and Reliability", "weight": 15, "tasks": [{"id": "5.1", "title": "Managing Conversation Context to Preserve Critical Information", "knowledge": ["Risks of progressive summarization: numeric values, percentages, and dates get condensed into vague summaries", "Lost-in-the-middle effect: models reliably process the start and end of long inputs, but may miss findings from the middle", "Tool outputs can accumulate in context disproportionately to relevance (40+ fields when 5 are needed)", "The importance of sending the full conversation history in subsequent API requests"], "skills": ["Extract transactional facts into a persistent “case facts” block outside the summarized history", "Trim verbose tool outputs down to relevant fields", "Place key findings at the beginning of aggregated data with explicit section headings", "Require subagents to include metadata (dates, sources) in structured outputs"]}, {"id": "5.2", "title": "Designing Effective Escalation Patterns and Resolving Ambiguity", "knowledge": ["Suitable escalation triggers: explicit request for a human, policy gaps/exceptions, inability to make progress", "Immediate escalation (explicit request) vs attempt-to-resolve (within agent scope)", "Sentiment analysis and model confidence self-ratings are unreliable proxies for case complexity", "Multiple customer matches require asking for additional identifiers, not heuristic guessing"], "skills": ["Explicit escalation criteria with few-shot examples in the system prompt", "Execute explicit requests for a human immediately without additional investigation", "Escalate when policy is ambiguous or silent for a specific request", "Ask for additional identifiers when tool results contain multiple matches"]}, {"id": "5.3", "title": "Implementing Error Propagation Strategies in Multi-agent Systems", "knowledge": ["Structured error context (failure type, query, partial results, alternatives) enables smarter coordinator recovery", "Distinguish access failures (timeouts require a retry decision) from valid empty results (no matches)", "Generic error statuses (“search unavailable”) hide valuable context from the coordinator", "Silent suppression or aborting the whole workflow on a single failure are both anti-patterns"], "skills": ["Return structured error context: failure type, what was attempted, partial results, possible alternatives", "Distinguish access failures from valid empty results", "Perform local recovery in subagents for transient failures; propagate only non-recoverable errors with partial results", "Annotate coverage in synthesis: what is well-supported vs where gaps remain"]}, {"id": "5.4", "title": "Managing Context Efficiently When Investigating Large Codebases", "knowledge": ["Context degradation in long sessions: the model starts producing unstable answers and referring to “typical patterns” instead of specific classes", "Scratchpad files preserve key findings across context boundaries", "Delegating to subagents isolates verbose discovery output", "Structured state persistence enables crash recovery"], "skills": ["Spawn subagents for specific questions while keeping high-level coordination in the main agent", "Use scratchpad files to store key findings and reference them later", "Summarize key findings before spawning next-phase subagents", "Use `/compact` to reduce context usage during long investigations"]}, {"id": "5.5", "title": "Designing Workflows with Human Oversight and Confidence Calibration", "knowledge": ["Aggregate metrics (e.g., 97% overall accuracy) can mask poor performance on specific document types or fields", "Stratified random sampling measures error rates in high-confidence extractions", "Field-level confidence calibration using labeled validation sets", "Validate accuracy by document type and field segment before automating"], "skills": ["Implement stratified random sampling to detect new error patterns", "Analyze accuracy by document type and field to validate stable performance", "Output field-level confidence scores and calibrate review thresholds using labeled data", "Route low-confidence or ambiguous-source extractions to human review"]}, {"id": "5.6", "title": "Preserving Provenance and Handling Uncertainty in Multi-source Synthesis", "knowledge": ["Attribution is lost during summarization without preserving “claim → source” mappings", "Structured mappings must be preserved during aggregation", "Handle conflicting statistics by annotating conflicts with attribution rather than arbitrarily choosing one value", "Include publication/collection dates to avoid misreading temporal differences as contradictions"], "skills": ["Require subagents to output “claim → source” mappings (URL, document name, quotes)", "Structure reports to separate stable findings from disputed ones", "Preserve conflicting values with annotations and pass them to the coordinator for reconciliation", "Include publication dates for correct temporal interpretation", "Render content by type: financial data as tables, news as prose, technical findings as structured lists"]}]}], "scen": [["Customer Support Agent", "You build an agent to handle returns, billing disputes, and account issues using the Claude Agent SDK. The agent uses MCP tools (`get_customer`, `lookup_order`, `process_refund`, `escalate_to_human`). The target is 80%+ first-contact resolution with appropriate escalation."], ["Code Generation with Claude Code", "You use Claude Code to accelerate development: code generation, refactoring, debugging, documentation. You need to integrate it with custom slash commands and CLAUDE.md configuration, and understand when to use planning mode."], ["Multi-Agent Research System", "A coordinator agent delegates tasks to specialized subagents: web research, document analysis, synthesis, and report generation. The system must produce complete reports with citations."], ["Developer Productivity Tools", "The agent helps engineers explore unfamiliar codebases, generate boilerplate code, and automate routine tasks. Built-in tools (Read, Write, Bash, Grep, Glob) and MCP servers are used."], ["Claude Code for Continuous Integration", "Integrate Claude Code into a CI/CD pipeline for automated code reviews, test generation, and pull request feedback. Prompts must be designed to minimize false positives."], ["Structured Data Extraction", "The system extracts information from unstructured documents, validates output with JSON schemas, and maintains high accuracy. It must correctly handle edge cases."], ["Conversational AI Architecture Patterns", "You design multi-turn conversational systems covering context window management, instruction persistence across turns, memory strategies, tool design for safe execution, and handling ambiguous or conflicting user inputs."], ["Agentic AI Tools *(content missing — help us fill it in!)*", "This scenario has been reported by exam candidates but is not yet covered in this guide. If you have encountered questions from this scenario on the real exam, please share them in [GitHub Issues](https://github.com/paullarionov/claude-certified-architect/issues) so we can add full coverage. Your contribution will help everyone preparing for the exam."]], "exercises": [{"title": "Multi-tool Agent with Escalation Logic", "goal": "Design an agent loop with tool integration, structured error handling, and escalation.", "steps": ["Define 3–4 MCP tools with detailed descriptions (include two similar tools to test tool selection)", "Implement an agent loop checking `stop_reason` (`\"tool_use\"` / `\"end_turn\"`)", "Add structured error responses: `errorCategory`, `isRetryable`, description", "Implement an interceptor hook that blocks operations above a threshold and routes to escalation", "Test with multi-aspect requests"], "domains": "1 (Agent architecture), 2 (Tools and MCP), 5 (Context and reliability)"}, {"title": "Configuring Claude Code for Team Development", "goal": "Configure CLAUDE.md, custom commands, path-specific rules, and MCP servers.", "steps": ["Create a project-level CLAUDE.md with universal standards", "Create `.claude/rules/` files with YAML frontmatter for different code areas (`paths: [\"src/api/**/*\"]`, `paths: [\"**/*.test.*\"]`)", "Create a project skill under `.claude/skills/` with `context: fork` and `allowed-tools`", "Configure an MCP server in `.mcp.json` with environment variables + a personal override in `~/.claude.json`", "Test planning mode vs direct execution on tasks of different complexity"], "domains": "3 (Claude Code configuration), 2 (Tools and MCP)"}, {"title": "Structured Data Extraction Pipeline", "goal": "JSON schemas, `tool_use` for structured output, validation/retry loops, batch processing.", "steps": ["Define an extraction tool with a JSON schema (required/optional fields, enums with \"other\", nullable fields)", "Build a validation loop: on error, retry with the document, the incorrect extraction, and the
